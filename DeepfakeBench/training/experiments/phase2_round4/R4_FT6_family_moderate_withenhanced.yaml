# =============================================================================
# Round 4 — R4_FT1: Baseline fine-tune, no enhanced DeepLive strategies
# =============================================================================

name: "R4_FT6_family_moderate_withenhanced"
description: "Fine-tune R25_F1 with family-aware quality augmentation (moderate), including enhanced strategies (860 set)"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true

learning_rate: 5.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 10
total_training_steps: 20000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 500

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r2_experiments/5w453our/top_n_effort_20260212_step18500_auc0.9893_eer0.0356.pth"

combined_paired:
  identity_balanced_sampling: true
  split_seed: 737

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods: null

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "Inswapper128"
    tiers: null

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05
  seed: 737

augmentation:
  version: "quality_targeted_family"
  strength: "moderate"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"

use_arcface_head: true
arcface_m: 0.0
arcface_s: 10.0
s_start: 10.0
s_end: 18.0
anneal_steps: 30000

evaluate_every_steps: 500
test_batch_size: 32
seed: 737

early_stopping_enabled: true
early_stopping_patience: 8

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2r4_experiments/"
