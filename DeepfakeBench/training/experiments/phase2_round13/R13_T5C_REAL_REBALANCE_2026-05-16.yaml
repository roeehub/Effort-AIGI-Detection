# ============================================================================
# R13_T5C_RESCHAIN_2026-05-15.yaml — Slot α (overnight 2026-05-15)
#
# SINGLE-LEVER DELTA vs T5C step3500 base: enable `resolution_chain_aug` —
# the new augmentation written 2026-05-15 evening that randomly downsamples
# each frame to size ∈ {64, 96, 128, 160, 192} then upsamples back with a
# random kernel ∈ {LINEAR, CUBIC, AREA, LANCZOS4} BEFORE the canonical 224
# resize. p_apply = 0.5.
#
# MOTIVATION (FACTS):
#   The 2026-05-15 resolution-chain CPU probe
#   (`analysis/cpu_diagnostics_2026-05-15_resolution_chain/RESULTS_FACTS_2026-05-15.md`)
#   measured per-frame score swing across 20 downsample→upsample variants of
#   the same content on 388 frames spanning chronic + non-chronic cohorts and
#   visomaster_enhanced fakes:
#     - P8A: median score_range 0.97 on real cohorts (full [0,1] swing)
#     - E2B: median score_range 0.93-0.97 on real cohorts
#     - T5C: median score_range 0.54-0.72 on real cohorts (~40% smaller)
#   Source-resolution is the dominant axis (38-42% of variance vs kernel
#   21-23%). Mean real-frame score on P8A goes 0.70 (size=64) → 0.23 (size=192)
#   — a 0.47 systematic drift purely from changing the downsample size.
#   The user's live observation ("real people running too close to 0.5/0.6
#   on T5C at different screen capture sizes") is empirically confirmed.
#
# HYPOTHESIS:
#   Exposing the encoder to randomized resolution-chain variants during
#   training will desensitize L11 features to the down→up signature that
#   the model currently uses as an IQ shortcut. T5C's multi-axis-L11 GRL on
#   sharpness/color_a already partly mitigates (T5C is 40% more stable than
#   P8A); randomized resolution-chain augmentation should attack the size
#   axis at the data layer where the GRL's binarized sharpness signal
#   bottoms out.
#
# FALSIFIERS (close criterion):
#   - `dev_fake_macro_recall` regresses below 0.30 floor across all step
#     checkpoints → augmentation breaks fake recall (similar to T6/T7 jitter@0.50)
#   - chronic-6 `teams_real_dor_dev` FPR > 0.10 at all sampled steps → aug
#     introduces new chronic-FP failures, not reduces existing ones
#   - lockbox_real_fpr regresses > +0.01 absolute vs T5C step3500 (0.0279)
#
# CONFIRMATION (deployment grade):
#   - `dev_fake_macro_recall` ≥ 0.40 at some sampled step (T5C step3500: 0.459)
#   - lockbox_real_fpr ≤ 0.03 (T5C step3500: 0.0279)
#   - viso_enhanced_macro_dev recall ≥ 0.15 (T5C step3500: 0.138)
#   - PLUS a follow-up resolution-chain CPU probe on the trained ckpt shows
#     median real-cohort score_range ≤ 0.40 (vs T5C step3500's 0.54-0.72)
#
# DIFFERS FROM PRIOR ATTEMPTS:
#   - face_scale_jitter (P14 winner, T6/T7 refuted): changes face-pixel-AREA
#     by uniform rescale, then canonical resize. Does NOT introduce a
#     down→up chain — the rescale is one-step. resolution_chain_aug is a
#     TWO-step chain that simulates source-resolution variation.
#   - pipeline_randomization (PA): randomizes a stack of pipeline stages
#     (blur, jpeg, brightness, etc.) but its downscale step uses range
#     [0.85, 1.0] — minimal compared to the [0.286, 0.857] effective range
#     of {64, 96, 128, 160, 192} downsamples relative to a 224 input.
#   - fourier_band_aug: perturbs frequency-amplitude in bands, not resolution.
#
# COST: ~$30-40 Vertex (us-east1, A100×1, ~3500 steps FT regime).
# CONFIDENCE: 30-40% any single ckpt promotes; 65-75% the mechanism produces
#   measurable resolution-chain stability lift on a follow-up CPU probe.
# Seed: 9911
# ============================================================================

name: "R13_T5C_REAL_REBALANCE_2026-05-16"
description: "Slot B (auto-mode 2026-05-16) — T5C step3500 base + family_weight rebalance favoring identity-diverse real pools: realpool_real 1.5→5.0, external_real 2.0→6.0, df40_real 0.5→0.25. Single-lever data-composition delta. Encoder probe 2026-05-16 showed Roy_D occupies a distinct embedding region (PC1=-3.5 vs ilan/orel +7.1, +7.3); the band-shortcut analysis (RESULTS_FACTS_v3) showed training reals have ~0 anchors in the 6+ band region where chronic-FPs live. This packet tests whether boosting non-df40 real pools (which have higher identity / capture-condition diversity) populates more of the 6+ band region with REAL labels at training time."
seed: 9914

wandb:
  tags:
    - "phase2-round13"
    - "stage-auto-mode-2026-05-16"
    - "real-rebalance"
    - "ft-from-t5c-step3500"
    - "inherits-t4-grl"
    - "inherits-t3-slot1-data"
    - "single-lever"
    - "no-pair-rank"
    - "no-group-dro"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "no-arcface"
    - "no-resolution-chain-aug"
    - "seed-9914"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 10
total_training_steps: 3500
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 350

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/best_checkpoints/jrlldtem/periodic_effort_20260511_step3500_auc0.9944_eer0.0197.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# ===== Multi-axis encoder-level GRL — INHERITED from T5C (NOT changed) =====
multi_axis_grl:
  enabled: true
  axes:
    - chronic_flag
    - is_dor
    - sharpness_laplacian_high
    - color_a_approx_dev_high
  lambda_max: 1.0
  lambda_warmup_steps: 250
  loss_weight: 1.0
  hidden_dim: 1024
  bottleneck_dim: 128

# ===== NO resolution_chain_aug — this packet's lever is data composition =====
resolution_chain_aug:
  enabled: false

# ===== All other levers identical to T5C (no change) =====

pair_rank_loss:
  lambda: 0.0

use_group_dro: false

correlation_penalty:
  enabled: false

anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 9914
  seed: 9914

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    frame_keep_list_path: "analysis/cpu_diagnostics_2026-05-09/slot1_teams_real_keep_list_2026-05-09.csv"

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 9914
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      # ===== Lever delta vs T5C base: boost non-df40 reals =====
      # Hypothesis: realpool_real and external_real (VCD) have higher identity /
      # capture-condition diversity than df40_real, so weighting them up
      # populates the 6+ band region (where chronic-FPs live) with more
      # REAL labels during training.
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.25          # was 0.5
      realpool_real: 5.0       # was 1.5  (3.3x boost)
      external_real: 6.0       # was 2.0  (3.0x boost)

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 250
ood_monitoring_start_step: 250
ood_monitoring_every_steps: 500
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 12

periodic_saves:
  enabled: true
  step_list:
    - 100
    - 500
    - 1000
    - 1500
    - 2500
    - 3500

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
