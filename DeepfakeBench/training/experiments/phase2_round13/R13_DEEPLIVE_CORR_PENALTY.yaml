# ============================================================================
# R13_DEEPLIVE_CORR_PENALTY.yaml
# Phase 2, Round 13 — Deeplive ship: FT-from-E2B with multi-axis Pearson
# correlation-penalty loss for shortcut avoidance.
#
# Forks: R13_PA_VISOMASTER_ENHANCED_DATA.yaml (PA) — drops all visomaster
# sources (per user instruction 2026-05-05), switches base to E2B, and adds
# the correlation_penalty loss block introduced in commit landing 2026-05-05.
#
# THE LEVER: train-time penalty on Pearson(score, axis) for two pixel-derivable
# nuisance axes (sharpness_laplacian, luma_mean). Phase 1 audit
# (analysis/shortcut_audit_2026-05-05/) identified `clip_capture_mode` and
# sharpness as E2B's dominant shortcuts; Phase 2 prototype
# (analysis/corr_penalty_prototype_2026-05-05/) confirmed the loss converges
# at lambda=1 with a recall LIFT (+13.6pp) on a frozen-head test population.
# This is the encoder-scale follow-up.
#
# Data plane (drops visomaster per user 2026-05-05):
#   - DF40 + deeplive (regular/enhanced/clean/teams) + realpool + external_real
#   - DROPPED: visomaster, visomaster_enhanced, visomaster_teams_enhanced
#
# Pre-registered close criterion (production-honest, all four required):
#   F1: deeplive lockbox recall ≥ 90% at FPR ≤ 10% on lockbox reals after the
#       deployment quality gate (`is_no_face OR min(W,H) < 150 OR
#       laplacian_var < 8`).
#   F2: |Pearson(score, axis)| dropped ≥30% on at least 2 of the 5 audit axes.
#   F3: NO axis's |Pearson(score, axis)| INCREASED ≥50% (no shortcut shifting,
#       audit done post-hoc on full 5-axis set).
#   F4: HDTF real FPR ≤ 5% (substrate-invariant FPR side, generalization).
#   4/4 → PROMOTE as deeplive ship candidate. <4/4 → mechanism partially
#   working; characterize gap for v2 packet.
#
# Cost: ~$25-30 Vertex (us-east1, 2-3h, 2500 steps, FT regime).
# Region: us-east1 preferred per CLAUDE.md.
#
# Seed: 5051 (distinct from PA=3023 and E2B=3022).
# ============================================================================

name: "R13_DEEPLIVE_CORR_PENALTY"
description: "FT-from-E2B with Pearson correlation-penalty loss on {sharpness_laplacian, luma_mean}; drop visomaster sources per user 2026-05-05; deeplive ship candidate. lambda=1.0 single-lever discipline (encoder fine-tune, no anti-shortcut bundle)."
seed: 5051

wandb:
  tags:
    - "phase2-round13"
    - "deeplive-ship"
    - "correlation-penalty"
    - "shortcut-avoidance"
    - "ft-from-e2b"
    - "no-visomaster"
    - "single-lever"
    - "lambda-1.0"
    - "axes-sharpness-luma"
    - "no-arcface"
    - "cross-entropy-loss"
    - "no-grl"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "seed-5051"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

# FT-from-E2B regime: lower LR than E2B's scratch (2.0e-4); shorter schedule.
learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 8
total_training_steps: 2500
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 250

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# THE LEVER #1 base: FT from E2B (B16 scratch+CE), NOT scratch from CLIP.
load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/best_checkpoints/rmat8lwx/top_n_effort_20260503_step3200_auc0.9863_eer0.0310.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# --- THE LEVER #2: Pearson correlation-penalty loss (added 2026-05-05) ---
# Implementation: loss/correlation_penalty.py + detectors/effort_detector.py
# hook (commit landed 2026-05-05). Penalizes batch-level Pearson correlation
# between model score and per-frame nuisance axes.
correlation_penalty:
  enabled: true
  lambda: 1.0  # Phase 2 prototype proved stable; lambda>=10 oscillates.
  axes:
    - sharpness_laplacian   # Lap-variance on luma channel; documented shortcut
                            # (P8A r=+0.51, E2B r=+0.58 on lockbox reals)
    - luma_mean             # mean Y-channel; secondary IQ shortcut
    - face_area_fraction    # per-sample face area (bbox / image); documented
                            # shortcut (face-size label leak, crop-tightness gap)
                            # — sourced from the parquet below via dataloader
                            # lookup; falls back to NaN-skip if absent

# --- Anchor-aware: DISABLED (single-lever discipline). ---
anchor_aware:
  enabled: false
  weight: 5.0
  target_mean_prob: 0.10
  samples_per_step: 16
  pool_names:
    - "dor-real-webcam-false-flag-no-virtual-bg"

# --- Face scale-jitter: DISABLED (single-lever discipline). ---
face_scale_jitter:
  enabled: false
  scale_limit: 0.50

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  # Pipeline-randomization: matched to E2B baseline (eval-targeted aug).
  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 5051
  seed: 5051

  # Per-sample face_area_fraction lookup, built by the CPU pre-tag job at
  # `analysis/deeplive_face_geometry_2026-05-05/`. Read once at dataloader
  # construction; aggregated to per-sample mean. Absent samples emit NaN
  # which the loss-side code skips gracefully.
  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"     # KEPT here (still legitimate training data;
                                  # routes to deeplive_non_enhanced_fake post
                                  # the 2026-05-05 fix). DO NOT remove from
                                  # include_strategies — see thread
                                  # quality_enhancement_strategy_misrouting.md
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  # DROPPED per user 2026-05-05: deeplive ship is deeplive-only (DF40 +
  # deeplive); visomaster training sources excluded.
  visomaster:
    enabled: false
  visomaster_enhanced:
    enabled: false
  visomaster_teams_enhanced:
    enabled: false
  visomaster_hints_teams:
    enabled: false

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 5051
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      # visomaster_fake / visomaster_enhanced_fake DROPPED per visomaster source disable
      deeplive_non_enhanced_fake: 2.5     # quality_enhancement now correctly routes here
      deeplive_enhanced_fake: 3.0          # only edge_cases_enhanced + minimal_processing_enhanced
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

# Matched to E2B: ArcFace disabled, CrossEntropy stable.
use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 200
ood_monitoring_start_step: 200
ood_monitoring_every_steps: 400
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 10

periodic_saves:
  enabled: true
  step_list:
    - 200
    - 500
    - 1000
    - 1500
    - 2000
    - 2500

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
