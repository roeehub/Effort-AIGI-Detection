# Target-domain scorecard checkpoint map template.
#
# Keys are free-form aliases. They are consumed by:
#   python arena/run_target_domain_validation_sequential.py --checkpoint_map ...
# or:
#   bash arena/run_teams_target_domain_scorecard.sh --checkpoint-map ...
#
# Recommended baseline/candidate aliases for the current plan:
# - R12_G_FP32
# - R12_G_INT8
