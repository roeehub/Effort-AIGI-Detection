# ============================================================================
# R13_FT2 — Heavy Enhanced Fine-Tune from R12_G
# Phase 2, Round 13 — B-16, k=32, seed=737, FINE-TUNE
#
# JUSTIFICATION:
#   FT from R12_G with HEAVY enhanced exposure. The model already
#   generalizes well — push harder on the new enhanced fakes.
#
#   Key differences vs FT1:
#     - learning_rate: 5e-5 (vs 3e-5) — slightly more aggressive
#     - Enhanced weight: 6.0 (vs 3.5) — enhanced fakes are the main signal
#     - total_training_steps: 12000 (vs 10000) — needs slightly more time
#       to absorb the heavier enhanced distribution
#
#   Evidence supporting heavy enhanced exposure in FT:
#     - R4_FT7: When WMA enhanced fakes had 21% detection, upweighting
#       enhanced data to 5.0 solved it → 99.53% TPR. FT + heavy weight
#       is the proven combination for learning new fake types.
#     - R8_E: Inverting the training distribution (target-heavy) fixed
#       VisoMaster (69% → 97%). FT inherently inverts the focus since
#       the pre-existing fakes are already learned.
#     - FT converges fast, so higher enhanced weight won't have time
#       to cause catastrophic forgetting on existing fakes.
#
# Ablation reads:
#   FT2 vs FT1 → heavy vs conservative enhanced weight under FT
#   FT2 vs C   → heavy enhanced FT vs heavy enhanced scratch
#   FT2 vs A   → aggressive FT vs conservative scratch
# ============================================================================

name: "R13_FT2_heavy_enhanced"
description: "Fine-tune R12_G champion + Heavy VisoMaster Enhanced (6.0) — aggressive FT"
seed: 737

wandb:
  tags: ["phase2-round13", "fine-tune", "vit-b-16", "enhanced-visomaster", "k32",
         "teams-v2", "seed-737", "r12g-ft", "compound-aug", "gamma-up",
         "heavy-enhanced-ft"]

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true

# Slightly more aggressive FT learning rate
learning_rate: 5.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736            # k = 32 (same as R12_G)
gradient_clip_val: 1.0

# Slightly longer FT schedule to absorb heavy enhanced distribution
nEpochs: 15
total_training_steps: 12000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 500

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# ★ FINE-TUNE FROM R12_G CHAMPION
load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r12_experiments/0xxqwhxg/ood_composite_effort_20260311_step22500_auc0.9950_eer0.0138.pth"

label_smoothing: 0.0
stability_lambda: 0.0

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [70, 130]
  context_variation_brightness: [-0.20, 0.60]
  context_variation_contrast: 0.25
  context_variation_shift: 0.04
  context_variation_scale: 0.12
  context_variation_rotate: 8
  context_variation_individual_p: 0.15
  context_variation_cct_p: 0.15
  context_variation_cct_range: [2700, 8000]
  hue_shift: 20
  gamma_up_p: 0.15
  gamma_up_range: [0.45, 0.85]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 737
  seed: 737

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    gcs_project: "train-cvit2"
    exclude_tiers: ["ARTIFACT"]
    enhancers: null
    cache_manifest_uri: "gs://visomaster-enhanced-face-cropped/cache/discovery_manifest.json"
    cache_max_age_hours: 12.0

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams-v2"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 737
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.10                  # Slightly reduced (model already knows these)
      visomaster_fake: 2.0             # Slightly reduced (already learned)
      deeplive_non_enhanced_fake: 2.0  # Slightly reduced (already learned)
      deeplive_enhanced_fake: 2.5      # Slightly reduced (already learned)
      visomaster_enhanced_fake: 6.0    # ★ HEAVY — main learning target for FT
      deeplive_teams_fake: 5.0         # Keep Teams at standard
      deeplive_teams_real: 4.0
      df40_real: 0.4
      realpool_real: 3.0               # Bump reals to compensate for heavy enhanced
      external_real: 3.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
      - bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams-v2"
        prefix: "samples"
        method: "teams_ood_real"
        grouping: "by_folder"
        path_contains: "/frames/real/"
        video_id_depth: -4
        max_videos: 300
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
      - bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams-v2"
        prefix: "samples"
        method: "teams_ood_fake"
        grouping: "by_folder"
        path_contains: "/frames/fake/"
        video_id_depth: -4
        max_videos: 300
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: false

# FT ArcFace — gentler than scratch
use_arcface_head: true
arcface_m: 0.0
arcface_s: 6.0
s_start: 6.0
s_end: 12.0
anneal_steps: 15000

evaluate_every_steps: 500
ood_monitoring_start_step: 500
ood_monitoring_every_steps: 1000
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 10

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2r13_experiments/"
  save_every_steps: 2000
  keep_last_n: 3
  ood_composite_enabled: true
  ood_composite_top_n_size: 3
