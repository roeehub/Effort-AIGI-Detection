# Concrete local-machine suite manifest for the frozen Teams target-domain split.
#
# Intended usage from the training root:
#   cd DeepfakeBench/training
#   bash arena/run_teams_target_domain_scorecard.sh \
#     --checkpoint-map arena/checkpoint_maps/teams_target_domain.template.yaml \
#     --checkpoints R12_G_FP32,R12_G_INT8 \
#     --dry-run
#
# If you need to run the scorecard from Vertex or another machine, prefer a copy
# of this file that points at a staged `gs://...` manifest instead.

suites:
  - name: teams_real_all_dev
    df40_mode: none
    external_real_manifest: "arena/manifests/teams_target_domain_manifest_2026-04-06_frozen.json"
    external_real_manifest_split: "dev"
    external_real_manifest_slices: "teams_real_all"
    external_real_deterministic: true

