    notes:
      - title: SUCCESS — 2/3 falsifiers, 3x macro fake recall
        status: success
        text: P22 step 8000 trades 5pp train AUC (0.9926 -> 0.9406) for 3x dev fake_macro_recall at calibrated FPR=2% (0.136 -> 0.393). Deeplive recall +24x (2.4% -> 56.1%). Viso recall +4x at FPR=2% (1.1% -> 4.4%). Pearson |r|(score, laplacian) on viso dropped 0.44 -> 0.12 — direct evidence shortcut weakened.
      - title: Caveat — shortcut shifted onto luma/skin, not erased
        status: caveat
        text: F2 (R² of all 3 attrs ↦ score) ROSE 0.107 -> 0.175 instead of dropping. P22 weakened the direct Laplacian dependency but partially shifted load onto luma+skin. Next packet should target luma randomization (P23-LUMA candidate).
      - title: Caveat — viso underperforms above FPR=5%
        status: caveat
        text: Viso recall regresses vs P8A at FPR ≥ 5%. Viso shortcut signature is under-swap softness, not sharpness; curriculum doesn't directly address it.
      - title: Caveat — lockbox calibration drift
        status: caveat
        text: P22 step8k violates 2% lockbox real-FPR constraint (actual 4.26%). Recalibrating τ on dev+lockbox or augmenting calibration suite with cam_test_s33-style frames recovers.

