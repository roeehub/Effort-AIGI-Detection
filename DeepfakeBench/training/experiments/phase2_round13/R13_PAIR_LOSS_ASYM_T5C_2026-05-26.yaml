# ============================================================================
# R13_PAIR_LOSS_ASYM_T5C_2026-05-26.yaml — BACKBONE-T5C
#
# BACKBONE-T5C packet (post-Phase-1, 2026-05-22).
#
# SINGLE-LEVER DELTA vs T5C step3500 base (R13_T5C_RESCHAIN with the
# resolution-chain aug disabled): enable
# `substrate_pair_asymmetric_loss` — a one-sided hinge that pulls
# prob_fake(raw_clean) UP to match prob_fake(raw_teams) when teams > clean.
# Loss form:
#     L = lambda_pair * mean(ReLU(prob_teams - prob_clean - margin))
# Operates on matched-pair rows (same `substrate_pair_id`, one
# `substrate_transport=0` and one `=1`) in the batch.
#
# MOTIVATION (FACTS):
#   CPU-2 (2026-05-22) measured 275 paired viso fakes on Slot A v2 step3500
#   CLS-pool: mean(raw_clean)=0.5029 < mean(raw_teams)=0.5419, Δ=+0.0390,
#   Wilcoxon p=0.0020. Cohort partition at τ=0.20: target (teams>τ AND
#   raw≤τ) = 62 vs wrong_way (raw>τ AND teams≤τ) = 1. The 62:1 asymmetry
#   indicates the model already favors teams over raw in the right tail;
#   the lever raises raw scores to match teams.
#
#   The reverse direction (pulling teams down to raw) is REFUTED on
#   2026-05-04 + 2026-05-23 — it collapses fake recall. Hinge is one-sided
#   (raw ↑, teams unchanged).
#
# FALSIFIERS (close criterion):
#   - dev_fake_macro_recall regresses below 0.30 across all steps.
#   - lockbox_real_fpr regresses > +0.02 absolute vs T5C step3500
#     (T5C step3500 lockbox_real_fpr = 0.0279).
#   - composite λ=1.0 worsens by > 0.05 vs T5C base.
#   - BCE classifier accuracy drops > 5pp from base.
#
# CONFIRMATION (deployment grade):
#   - composite λ=1.0 ≤ 0.30
#   - lockbox_real_fpr ≤ 0.025
#   - lockbox_fake_recall ≥ 0.70
#   - dev_fake_macro_recall ≥ 0.40
#   - prob_fake(raw) cohort partition shifts: target/wrong_way ratio
#     drops from 62:1 toward 5:1 or less (paired CPU follow-up).
#
# DIFFERS FROM PRIOR ATTEMPTS:
#   - pair_rank_loss (P-* packets): logit-space margin loss; bidirectional
#     in implementation; gates on lambda > 0 in detector init. This loss
#     is probability-space, one-sided, gated by substrate_transport in
#     data_dict.
#   - contrastive_regularization: batch-half split, common+specific
#     features; doesn't use substrate_pair_id and not a hinge.
#   - anchor_aware_penalty: penalizes mean(prob_fake) on a cached pool;
#     doesn't pair across substrates.
#
# COST: ~$45-65 Vertex (us-central1, A100×1, 3500 steps FT regime).
# CONFIDENCE: 30-40% any single ckpt clears the composite ≤ 0.30 gate.
# Seed: 9916
# ============================================================================

name: "R13_PAIR_LOSS_ASYM_T5C_2026-05-26"
description: "BACKBONE-T5C — T5C step3500 base + substrate_pair_asymmetric_loss (lambda_pair=0.3, margin=0.0) — one-sided hinge pulling prob_fake(raw_clean) up to match prob_fake(raw_teams). Single new lever; no anchor_aware (T5C base doesn't have it). Inherits T5C's multi_axis_grl + T3 keep-list + pipeline_randomization."
seed: 9916

wandb:
  tags:
    - "phase2-round13"
    - "stage-phase-2-backbone-2026-05-22"
    - "backbone-t5c"
    - "substrate-pair-asymmetric"
    - "ft-from-t5c-step3500"
    - "inherits-multi-axis-grl"
    - "single-lever"
    - "no-anchor-aware"
    - "no-group-dro"
    - "no-pair-rank"
    - "no-resolution-chain-aug"
    - "no-face-scale-jitter"
    - "no-arcface"
    - "seed-9916"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 10
total_training_steps: 3500
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 350

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/best_checkpoints/jrlldtem/periodic_effort_20260511_step3500_auc0.9944_eer0.0197.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# ===== Multi-axis encoder-level GRL — INHERITED from T5C (NOT changed) =====
multi_axis_grl:
  enabled: true
  axes:
    - chronic_flag
    - is_dor
    - sharpness_laplacian_high
    - color_a_approx_dev_high
  lambda_max: 1.0
  lambda_warmup_steps: 250
  loss_weight: 1.0
  hidden_dim: 1024
  bottleneck_dim: 128

# ===== NO resolution_chain_aug =====
resolution_chain_aug:
  enabled: false

# ===== NEW LEVER: substrate_pair_asymmetric_loss =====
# One-sided hinge on (prob_teams - prob_clean) for matched-pair real rows.
# See loss/substrate_pair_asymmetric.py for the implementation; collate
# stamps substrate_pair_id + substrate_transport via the active stamper.
substrate_pair_asymmetric_loss:
  enabled: true
  lambda_pair: 0.3
  margin: 0.0

# ===== NO anchor_aware (T5C base doesn't have it) =====
anchor_aware:
  enabled: false

# ===== NO GroupDRO (BACKBONE-SlotAv2 uses that lever) =====
use_group_dro: false

# ===== All other levers identical to T5C (no change) =====

pair_rank_loss:
  lambda: 0.0

correlation_penalty:
  enabled: false

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 9916
  seed: 9916

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  # NEW (2026-05-22): substrate-pair stamper. Reads the inventory CSV at
  # trainer init and stamps substrate_pair_id + substrate_transport per
  # video in the collate. The asymmetric pair-loss reads these fields to
  # peel matched (raw_clean, raw_teams) pairs from the batch.
  substrate_pair_sampling:
    enabled: true
    inventory_path: "analysis/substrate_pair_geometry_2026-05-22/inventory_manifest.csv"
    sources:
      - hdtf_visomaster_teams
      - quickclips_visomaster_teams
      - visomaster_teams_enhanced
      - deeplive_teams
    pair_fraction: 0.25

  # NEW (2026-05-22 PM, commit ed10630): substrate_paired_inventory data
  # source. CRITICAL for BACKBONE-T5C — without this block enabled, the
  # asymmetric pair-loss reads ~0 across all steps because only the 54
  # viso_teams_enhanced pairs surface in batches; the loss needs matched
  # (raw_clean, raw_teams) pairs at the 32-frame batch granularity, which
  # requires the 1094 HDTF + 732 quickclips rows to also reach iterators.
  substrate_paired_inventory:
    enabled: true
    inventory_path: "analysis/substrate_pair_geometry_2026-05-22/inventory_manifest.csv"
    sources:
      - hdtf_visomaster_teams
      - quickclips_visomaster_teams
    sparse_indices: [0, 4, 8, 12]
    parallel_download_workers: 8

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    frame_keep_list_path: "analysis/cpu_diagnostics_2026-05-09/slot1_teams_real_keep_list_2026-05-09.csv"

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 9916
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 250
ood_monitoring_start_step: 250
ood_monitoring_every_steps: 500
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 12

periodic_saves:
  enabled: true
  step_list:
    - 100
    - 500
    - 1000
    - 1500
    - 2500
    - 3500

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
