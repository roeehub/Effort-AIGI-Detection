# --- ArcFace Scale Ablation: ViT-B-16 LAION - CONSERVATIVE (s_end=12, batch=256) ---
# EXPECTED: MUST NOT collapse - safest configuration for B16
# Hypothesis: batch_size ≥ 10× s_end should guarantee stability
# Created: Jan 10, 2026

name: "B16_LAION_ArcFace_s12_batch256"
description: "Conservative s_end=12 with max batch=256 - safest B16 config"

# === DATA SOURCE ===
data_source: combined_paired

# Backbone Configuration (LAION via OpenCLIP)
backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224

# Training Hyperparameters
learning_rate: 5.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 1.0
# FIXED Jan 11, 2026: ViT-B-16 attention layers are 768x768, NOT 512x512
# rank=767 gives k=1 trainable singular direction (matching Effort paper default)
# Previously rank=511 gave k=257, causing reg_loss to dominate
rank: 767

# Gradient Clipping
gradient_clip_val: 1.0

# Training Schedule
nEpochs: 150  # Increased from 30 to reach ~12k steps with batch=256

# Dataloader Configuration
dataloader_strategy: combined_paired
frames_per_batch: 256  # MAXIMUM batch for smoothest gradients
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# Combined Dataset Configuration
combined_paired:
  identity_balanced_sampling: true
  df40:
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods: null
  deeplive:
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
  train_split: 0.9
  val_split: 0.1
  test_split: 0.0
  seed: 737

# Augmentation
augmentation:
  version: "base_only"
  base:
    horizontal_flip: true
    color_augmentations: true
    quality_augmentations: true
    geometric_augmentations: true

# Fixed Context
test_batch_size: 32
evaluate_every_steps: 500
seed: 737
load_base_checkpoint: false

# Early stopping
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_delta: 0.001

# Learning rate scheduler
lr_scheduler: "cosine_with_warmup"
total_training_steps: 12000
lr_scheduler_warmup_steps: 4000

# ================================================
# ArcFace Configuration - CONSERVATIVE (s_end=12)
# batch/s_end ratio = 256/12 = 21× (very safe)
# ================================================
use_arcface_head: true
arcface_s: 12.0
arcface_m: 0.28
s_start: 10.0
s_end: 12.0
anneal_steps: 4000

# Normalization
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

# GCS Assets
gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

# Checkpointing
checkpointing:
  gcs_prefix: "gs://training-job-outputs/arcface_scale_ablation/"
  save_every_steps: 2000
  keep_last_n: 3

# Evaluation
evaluation:
  metrics: ["auc", "eer", "accuracy"]
  evaluate_every_steps: 500

# W&B
wandb:
  project: "arcface-scale-ablation"
  tags:
    - "arcface-ablation"
    - "vit-b-16"
    - "laion"
    - "s_end_12"
    - "batch_256"
    - "conservative"
