# B16 Capacity Ceiling - Experiment 2: Unfreeze Last 2 Blocks
# 
# Purpose: Test if unfreezing last 2 transformer blocks improves ceiling
# Expected: Better than baseline if late layers need task-specific adaptation
#
# B16 has 12 transformer blocks (0-11)
# This unfreezes: blocks 10, 11 + ln_post + projection + head

name: "B16_ceiling_2_unfreeze_last_2"
description: "Unfreeze last 2 transformer blocks (10-11) + projection + head"

# === CAPACITY CEILING CONFIG ===
unfreeze_mode: "last_n_blocks"
unfreeze_n_blocks: 2

# === DATA SOURCE ===
data_source: df40_paired

# === BACKBONE: B16 LAION (NO SVD) ===
backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224

# === TRAINING HYPERPARAMETERS ===
# Lower backbone LR to avoid catastrophic forgetting
backbone_lr: 1.0e-5
head_lr: 1.0e-4
weight_decay: 0.05
gradient_clip_val: 1.0

# === TRAINING SCHEDULE ===
nEpochs: 30
lr_scheduler_warmup_steps: 1000

# === DATALOADER ===
dataloader_strategy: df40_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# === DF40 PAIRED CONFIG ===
df40_paired:
  pair_json: "dataset/df40_pairs/df40-pair-matching.json"
  gcs_bucket: "df40-frames-recropped-rfa85"
  sampling_mode: "sparse"
  anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
  methods: null
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 737

# === AUGMENTATION ===
augmentation:
  version: "base_only"
  base:
    horizontal_flip: true
    color_augmentations: true
    quality_augmentations: true
    geometric_augmentations: true

# === EVALUATION ===
test_batch_size: 32
seed: 737

# === EARLY STOPPING ===
early_stopping_patience: 10

# === NORMALIZATION ===
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]
