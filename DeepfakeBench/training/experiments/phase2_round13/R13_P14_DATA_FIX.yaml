# ============================================================================
# R13_P14_DATA_FIX.yaml
# Phase 2, Round 13 — FT-from-P8A + Teams-transport-axis-only viso bucket fix
#
# REVISED 2026-04-29 PM after Move 1 + memory project_visomaster_hints_lanes_bad_data.md:
#
# - DISABLED `visomaster_enhanced` (broad enhancer-pass viso, no Teams transport).
#   Move 1 (analysis/move1_linear_probe_2026-04-29/) refuted the bucket-gap-as-
#   AUC framing: P8A's frozen features rank-order viso fake-vs-real correctly
#   across every bucket variant (probe AUC 0.92-0.998). The 0.7527 frame-level
#   AUC on visomaster_enhanced_macro_dev reflects shortcut-on-reals (FPR), not
#   bucket discriminability of the broad enhanced fake side. Adding
#   visomaster_enhanced does not address the dominant lever.
#
# - DISABLED `visomaster_hints_teams`. Bad data lane: 202 weak-signal Teams-
#   played rows from the April-17 face_parser_enabled bug. RLP1 ablation showed
#   net drag (8/8 holdouts Δ −0.0077..−0.0115). Worse, the partial-swap fingerprint
#   and the Teams codec fingerprint are co-encoded → trains exactly the wrong
#   shortcut. Policy: never enable. (memory project_visomaster_hints_lanes_bad_data.md)
#
# - ENABLED `visomaster_teams_enhanced` (the *conjunction* source: enhancer-pass
#   viso × Teams-v2 transport, the actual eval-substrate match). PLAN.md §7.3.1
#   Path A. Already wired at combined_paired.py:704 (discover function at
#   data/sources/visomaster.py:1044). companion_domains=["teams_v2"] selects
#   the Teams-recapture conjunction.
#
# Hypothesis: the genuine fake-side miss is on Teams-v2-transport viso fakes
# specifically. Move 1 measured tv2_visomaster_fake mean prob_fake=0.437 (only
# 47% above 0.5 threshold). Conjunction-source training closes that miss.
#
# All hyperparameters identical to R13_P14_FT_FROM_P8A. Same anchor_aware bundle,
# same FT recipe.
#
# DO NOT LAUNCH without explicit user OK — this is a $70 / ~8h Vertex spend.
#
# Seed: 737 (matches P14 — pure data delta)
# ============================================================================

name: "R13_P14_DATA_FIX"
description: "FT-from-P8A_step5000 + anti-shortcut bundle + visomaster_teams_enhanced (Teams-transport conjunction source, Path A only)"
seed: 737

wandb:
  tags:
    - "phase2-round13"
    - "p14-data-fix"
    - "teams-transport-conjunction"
    - "anti-shortcut"
    - "anchor-aware-loss"
    - "pipeline-random"
    - "face-scale-jitter"
    - "fork-p8a"
    - "seed-737"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 3.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 8
total_training_steps: 4000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 200

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r13_experiments/9lmvb5b4/value_composite_effort_20260424_step5000_auc0.9926_eer0.0270.pth"

label_smoothing: 0.0
stability_lambda: 0.0

anchor_aware:
  enabled: true
  weight: 5.0
  target_mean_prob: 0.10
  samples_per_step: 16
  pool_names:
    - "dor-real-webcam-false-flag-no-virtual-bg"

face_scale_jitter:
  enabled: true
  scale_limit: 0.25

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.55
    p_fake: 0.45
    jpeg_quality: [40, 95]
    downscale_range: [0.85, 1.0]
    chroma_blur_ksize: 3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 737
  seed: 737

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  # DISABLED 2026-04-29 — Move 1 refuted broad bucket-gap-as-AUC. P8A features
  # rank-order viso fake-vs-real correctly across every bucket including
  # visomaster_enhanced (probe AUC 0.998). The 0.7527 frame-level AUC on
  # visomaster_enhanced_macro_dev is FPR-driven shortcut-on-reals, not bucket
  # discriminability of the broad enhanced fake side.
  visomaster_enhanced:
    enabled: false
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  # DISABLED 2026-04-29 — Bad data lane (April-17 face_parser_enabled bug residue).
  # RLP1 ablation showed net drag; partial-swap × Teams-codec are co-encoded
  # so the lane teaches exactly the camera-signature shortcut we are trying
  # to attack. memory project_visomaster_hints_lanes_bad_data.md.
  visomaster_hints_teams:
    enabled: false

  # NEW vs P14 — Teams-transport conjunction source (PLAN.md §7.3.1 Path A).
  # The actual eval-substrate match: enhancer-pass viso × Teams-v2 transport.
  # Resolver manifest = the canonical 2026-04-06 inventory used across R13.
  # companion_domains=["teams_v2"] selects the Teams-recapture conjunction;
  # leaving it ALL ([teams_v2, clean_companion_only]) would also pull a clean
  # variant we already have via base visomaster, so we restrict to teams_v2.
  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 737
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 8.0      # NEW — Teams-transport conjunction; 2× base
                                          # visomaster_fake to oversample the actual
                                          # eval-substrate match against the broader
                                          # visomaster pool.
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: true
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 12.0
anneal_steps: 4000

evaluate_every_steps: 500
ood_monitoring_start_step: 500
ood_monitoring_every_steps: 1000
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 10

periodic_saves:
  enabled: true
  step_list:
    - 500
    - 1000
    - 1500
    - 2000
    - 2500
    - 3000
    - 3500
    - 4000

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2r13_experiments/"
  save_every_steps: 1000
  keep_last_n: 3
