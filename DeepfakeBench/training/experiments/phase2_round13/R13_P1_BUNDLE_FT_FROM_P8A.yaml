# ============================================================================
# R13_P1_BUNDLE_FT_FROM_P8A.yaml
# Phase 2, Round 13 — Packet P1 (PE_PAIR_RANK_DRO), Slot 1 BUNDLE:
#   pair-rank loss + multi-axis GroupDRO (R-D / F-B keying), FT-from-P8A
#   on the post-`2feea58` codepath.
#
# Plan: docs/relaunch_handoffs/NEXT_STEPS_PLAN_2026-05-06.md §8.2 P1
# Wiring landed 2026-05-07: collate emits per-video pair_id and group_id
# (derived from method/source/identity at collate-time when loaders don't
# pre-stamp it); detector adds `_compute_pair_rank_loss`; GroupDRO mixin
# accepts `group_id_mapping` (str→int) alongside legacy `method_mapping`;
# data pipeline auto-builds `group_id_mapping` from `all_samples` and
# `train_sweep.py` wires it into config. ~27 groups expected per the audit.
#
# THE LEVERS (vs P1_PAIRRANK_ONLY ablation):
#   - pair_rank_loss ON: λ=0.2, margin=0.5 (logit space)
#   - GroupDRO ON: asymmetric R-D real-side + F-B fake-side keys per
#     analysis/group_id_design_audit_2026-05-06; chronic_flag covers Dor /
#     PC_Generator / bla_bla_chow / roy_d / Q__s6 (memory
#     project_chronic_offenders_partition_per_ckpt_2026-05-04).
#   - correlation_penalty OFF (PD scorecard 2026-05-06 substantiated that
#     single-axis IQ-penalty class shortcut-shifts and breaks substrate
#     invariance; see plan §3.7 PD row).
#   - arcface OFF, anchor_aware OFF, face_scale_jitter OFF.
#
# WHY FT-FROM-P8A:
#   - `analysis/checkpoint_cohort_diagnosis_2026-05-06`: P8A wins 7/9 cohort
#     axes; `real_FP_fake_missed` cell at τ=0.5 = P8A 0.0% / E2B 3.2%.
#   - P8A retains uniquely low Dor real-FPR (memory `project_p8a_breakthrough`)
#     where PD arms catastrophically regress at this τ.
#   - Post-`2feea58` codepath activates `apply_svd_to_in_proj` q/k/v
#     classification gradient for the first time on the P8A lineage. Treat
#     the grad-audit at step 100/500/1000 as a plumbing-check (zero gradient
#     → abort, fix regressed silently); per `packets/P8A.md:108` the lever
#     was inert under P10_SYM, so a "nonzero gradient + flat F1-F5" outcome
#     is consistent with the lever being unhelpful for this recipe.
#
# WHY GROUPDRO HERE (and not in P1_PAIRRANK_ONLY ablation):
#   - PD scorecard 2026-05-06 showed catastrophic Dor real-FPR regression
#     across all 6 PD ckpts (24% → 64-86%). The chronic_flag axis in the
#     R-D real-side key directly addresses this cohort by upweighting
#     chronic-FP identities so the optimizer protects Dor invariance.
#   - The slot-1-vs-slot-2 ablation tomorrow morning answers the load-bearing
#     question: "is GroupDRO additive to pair-rank alone, or is pair-rank
#     the load-bearing lever?"
#
# DATA PLANE: identical to P1_PAIRRANK_ONLY (all 6 paired lanes enabled).
#   pair_rank_loss=0 on lane batches without paired counterparts (per
#   `analysis/pair_coverage_audit_2026-05-06` Agent 2). external_vcd_real
#   has empty sample_id by default → pair-rank skips it; GroupDRO still
#   weights it via the real-side key.
#
# Pre-registered close criterion (4/4): same as P1_PAIRRANK_ONLY plus
#   F5: chronic-FP `pc_generator` cluster failure rate (P8A baseline 0.520)
#       drops by ≥ 0.10 absolute via the GroupDRO chronic_flag term.
#
# Confidence (from plan §8.2): single-packet three-pillar closure 20-30%.
#
# Cost: ~$50-80 Vertex (us-east1, 5-7h, 4500 steps, FT regime).
#
# Seed: 5072 (paired with P1_PAIRRANK_ONLY's 5071 for matched-axis ablation).
# ============================================================================

name: "R13_P1_BUNDLE_FT_FROM_P8A"
description: "P1 Slot 1 BUNDLE — pair-rank + multi-axis GroupDRO (R-D / F-B), FT-from-P8A on post-2feea58 codepath. PE_PAIR_RANK_DRO with both levers."
seed: 5072

wandb:
  tags:
    - "phase2-round13"
    - "p1-bundle"
    - "ft-from-p8a"
    - "post-2feea58-codepath"
    - "pair-rank-loss"
    - "lambda-0.2"
    - "margin-0.5"
    - "group-dro-multi-axis"
    - "rd-real-side-key"
    - "fb-fake-side-key"
    - "chronic-flag"
    - "no-correlation-penalty"
    - "no-arcface"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "cross-entropy-loss"
    - "seed-5072"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 12
total_training_steps: 4500
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 450

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r13_experiments/9lmvb5b4/value_composite_effort_20260424_step5000_auc0.9926_eer0.0270.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# Pair-rank loss (PE_PAIR_RANK_DRO, P1).
pair_rank_loss:
  lambda: 0.2
  margin: 0.5

# Multi-axis GroupDRO. The data pipeline (combined_paired.py) builds the
# group_id_mapping from `all_samples × {label=0, label=1}` at config-load
# time (~27 groups expected per audit) and train_sweep.py wires it into
# `data_params.group_id_mapping`. The mixin's tolerant-unknown-id path
# covers any drift between the audit's enumeration and runtime samples.
use_group_dro: true
group_dro_params:
  beta: 3.0
  ema_alpha: 0.1
  clip_min: 1.0
  clip_max: 4.0
  warmup_steps: 100   # uniform weight for first 100 steps; activates EMA after

# Correlation-penalty OFF (single-axis IQ-penalty class refuted by PD).
correlation_penalty:
  enabled: false

anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 5072
  seed: 5072

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 5072
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 250
ood_monitoring_start_step: 250
ood_monitoring_every_steps: 500
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 12

# step 100/500/1000 included for the in-proj-SVD grad-audit (per
# packets/P8A.md:108 the post-fix lever may be inert under this loss class —
# these checkpoints let us re-audit cheaply without abandoning the run).
periodic_saves:
  enabled: true
  step_list:
    - 100
    - 500
    - 1000
    - 1500
    - 2500
    - 3500
    - 4500

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
