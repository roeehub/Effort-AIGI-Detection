# ============================================================================
# R13_T3_SLOT2_IQ_MATCHED_REALS_2026-05-09.yaml
# Stage 3, Slot 2 — IQ-matched reals.
#
# Single-lever change vs the structural FT baseline (R13_S2_SLOT2):
#   - DF40 pair JSON points to filtered set (ff identity whitelist) so the
#     paired-real distribution matches the active fake distribution.
#   - Teams REAL frames are subsampled via frame keep-list to the same
#     fake-matched lap_var profile.
#   - learning_rate: 1.0e-4 (vs 1e-5 in S2 baseline)
#   - lr_scheduler_warmup_steps: 450 (vs 200 in S2 baseline)
#   - All other knobs identical: pipeline_randomization (P22 winner),
#     pair_rank=0, GroupDRO=false, anchor_aware=false, face_scale_jitter=false,
#     correlation_penalty=false, arcface=disabled.
#
# HYPOTHESIS:
#   The IQ shortcut is upstream of P8A's substrate-invariance. Slot 1
#   removes only the high-end, leaving a low-end residual shortcut where
#   blendface/inswap fakes can still be told from FF++ reals by lap_var
#   alone. Slot 2 fully matches reals to fakes in lap_var, so the shortcut
#   is *eliminated* aggregate-wise. If IQ is the binding constraint, this
#   should outperform Slot 1 on viso recall and HDTF transport.
#
# WHAT WOULD FALSIFY:
#   - Aggregate matching is too coarse (per-method shortcut survives) and
#     Slot 3 outperforms; Slot 2 gives intermediate results.
#   - All matching destroys substrate-invariance pillar (analogous to the
#     P14_DATA_FIX bundle outcome xan4dfto value_composite=0.126); the
#     IQ-matching premise would be refuted.
#   - Lookup of "match-to-fake" gives the model a smaller training-real
#     pool than the legacy 9101 baseline (3,843 -> 900 frames here, ~24%);
#     model under-trains on reals → real recall on lockbox collapses to
#     0% indicating the IQ axis carries information the encoder needed.
#
# DATA STATS (sidecars 2026-05-09, atlas-derived fake distribution):
#   - Active-fake lap_var: N=4,000 (6 DF40 methods + train_teams_fake_pool
#     + visomaster_enhanced_v2). p10=19.5 / p50=53.7 / p90=125.4.
#   - FF++ kept identities: 451 / 953 (47%).
#   - Teams real kept frames: 449 / 2,890 (16%).
#   - KS(matched_reals, fakes) = 0.0155 (target was < 0.05).
#
# WHY FT-FROM-P8A:
#   Same as Slot 1.
#
# COST: ~$50-70 Vertex (us-east1, A100×1, ~4500 steps, FT regime).
# CONFIDENCE (single-packet): 25-35%.
# Seed: 9102
# ============================================================================

name: "R13_T3_SLOT2_IQ_MATCHED_REALS_2026-05-09"
description: "Stage 3 Slot 2 — aggregate IQ-matched reals (DF40 + Teams) so lap_var matches fakes; KS=0.016."
seed: 9102

wandb:
  tags:
    - "phase2-round13"
    - "stage3"
    - "t3-slot2"
    - "iq-matched-reals"
    - "iq-shortcut-mitigation"
    - "ft-from-p8a"
    - "single-lever"
    - "no-pair-rank"
    - "no-group-dro"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "no-arcface"
    - "seed-9102"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 12
total_training_steps: 4500
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 450

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r13_experiments/9lmvb5b4/value_composite_effort_20260424_step5000_auc0.9926_eer0.0270.pth"

label_smoothing: 0.0
stability_lambda: 0.0

pair_rank_loss:
  lambda: 0.0

use_group_dro: false

correlation_penalty:
  enabled: false

anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 9102
  seed: 9102

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    # T3 SLOT 2 LEVER (2026-05-09): filtered DF40 pair JSON. Pairs are
    # retained only if their FF++ real identity falls in the IQ-matched
    # whitelist (451 / 953 identities kept).
    pair_json: "dataset/df40_pairs/df40-pair-matching__iq_matched_2026-05-09.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    # T3 SLOT 2 LEVER (2026-05-09): keep-list of 449 Teams REAL frames
    # selected by IQ-matching against the active fake distribution.
    frame_keep_list_path: "analysis/cpu_diagnostics_2026-05-09/slot2_teams_real_keep_list_2026-05-09.csv"

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 9102
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 250
ood_monitoring_start_step: 250
ood_monitoring_every_steps: 500
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 12

periodic_saves:
  enabled: true
  step_list:
    - 100
    - 500
    - 1000
    - 1500
    - 2500
    - 3500
    - 4500

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
