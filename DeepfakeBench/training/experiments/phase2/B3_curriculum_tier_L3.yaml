# =============================================================================
# Phase 2 — Experiment B3 Lesson 3: All tiers (STRONG + MODERATE + MINIMAL)
# =============================================================================
# Purpose: Curriculum Lesson 3 (final) — resume from B3 Lesson 2 checkpoint,
# include all VisoMaster tiers including hardest-to-detect (MINIMAL).
# Night: 4 (Curriculum)
# =============================================================================

name: "P2_B3_curriculum_tier_L3"
description: "Curriculum by tier: Lesson 3 — all tiers (resume from L2)"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true

learning_rate: 5.0e-5  # Further reduced LR for final fine-tuning
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 760
gradient_clip_val: 1.0

nEpochs: 20
total_training_steps: 40000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 500

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# Combined Dataset: DF40 + DeepLive + VisoMaster (ALL tiers)
combined_paired:
  identity_balanced_sampling: true

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods: null

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "Inswapper128"
    tiers: null  # ★ Lesson 3: ALL tiers (STRONG + MODERATE + MINIMAL)

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05
  seed: 737

augmentation:
  version: "base_only"
  base:
    horizontal_flip: true
    color_augmentations: true
    quality_augmentations: true

# --- No lesson gate for final lesson — train to convergence ---
lesson_gate:
  enabled: false

use_arcface_head: false

# ★ Resume from Lesson 2 checkpoint
load_base_checkpoint: true
base_checkpoint_path: ""  # Set to B3 L2 best checkpoint GCS path

evaluate_every_steps: 500
test_batch_size: 32
seed: 737

early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_delta: 0.001

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2_experiments/"
  save_every_steps: 2000
  keep_last_n: 3

mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]
