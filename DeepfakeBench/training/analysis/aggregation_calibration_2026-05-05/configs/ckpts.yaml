    full_name: E2B_TOP_N_STEP3200
    score_dir: analysis/cpu_followups_2026-05-04/raw_reports
    team_sanity_csv: analysis/team_sanity_check_2026-05-05/scores/E2B_TOP_N_STEP3200.csv
