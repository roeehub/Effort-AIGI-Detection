  # can browse bucket info, per-frame thumbnails, recall trajectory,
  # per-packet verdicts, and 2026-05-03 CPU diagnostics in one place.
  # ─────────────────────────────────────────────────────────────────
  - id: viso_overview
    label: Viso Eval Bucket — Overview (visomaster_enhanced_macro_dev)
    run_id: viso_overview
    checkpoint_key: VISO_OVERVIEW
    checkpoint: "(pseudo-run; this entry aggregates eval-suite data, not a model checkpoint)"
    aliases:
      - viso
      - visomaster_enhanced_macro_dev
      - viso_bucket
      - P8A
      - CLIP_B16_RAW
    tags:
      - eval-suite
      - viso
      - bucket-overview
      - "2026-05-03"
    recipe: |
      Pseudo-run aggregating the visomaster_enhanced_macro_dev eval bucket (n=550, all fake).
      Use the 'Open report' button to view the full HTML digest. The Frame Browser panel
      shows the 550 viso fakes via per_frame_scores wired to the existing P8A scorecard.
    artifacts:
      score_distribution_report: analysis/viso_overview_2026-05-03/INDEX.html
      per_frame_scores:
        - analysis/score_distribution_2026-05-02/raw_reports/visomaster_enhanced_macro_dev_p8a_reference_step5000_frames_report.csv
        - analysis/score_distribution_2026-05-02/raw_reports/visomaster_enhanced_macro_dev_p18t_grl_treatment_step4000_frames_report.csv
        - analysis/score_distribution_2026-05-02/raw_reports/visomaster_enhanced_macro_dev_p18c_no_grl_control_step4000_frames_report.csv
      bucket_metadata: analysis/viso_overview_2026-05-03/outputs/bucket_metadata.json
      recall_through_chain: analysis/viso_overview_2026-05-03/outputs/recall_through_chain.csv
      per_packet_verdicts: analysis/viso_overview_2026-05-03/outputs/per_packet_verdicts.csv
      cpu_diagnostic_p8a_param_audit: analysis/p8a_param_audit_2026-05-03/FINDINGS.md
      cpu_diagnostic_skin_frac_gap: analysis/skin_frac_viso_gap_2026-05-03/FINDINGS.md
      cpu_diagnostic_skin_frac_distributions_png: analysis/skin_frac_viso_gap_2026-05-03/outputs/distributions.png
      cpu_diagnostic_clip_vs_p8a: analysis/clip_vs_p8a_viso_2026-05-03/FINDINGS.md
      cpu_diagnostic_clip_vs_p8a_summary_json: analysis/clip_vs_p8a_viso_2026-05-03/outputs/probe_summary.json
      # Manifold defaults to P8A-only (1100 frames: 550 viso_fake + 550 teams_real_dev).
      # The combined and CLIP-only files are exposed as secondary artifacts for direct comparison.
      # NOTE: combined CSV's CLIP and P8A points are in DIFFERENT coordinate spaces
      # (separate t-SNE runs on different feature spaces) — they should be viewed as two
      # parallel maps, not a unified embedding. Color by `method` shows viso_fake vs teams_real_dev.
      manifold_tsne: analysis/viso_overview_2026-05-03/outputs/tsne_for_viewer__p8a.csv
      manifold_tsne_combined: analysis/viso_overview_2026-05-03/outputs/tsne_for_viewer__combined.csv
      manifold_tsne_clip_only: analysis/viso_overview_2026-05-03/outputs/tsne_for_viewer__clip_b16_raw.csv
      manifold_tsne_raw_stream_b: analysis/clip_vs_p8a_viso_2026-05-03/outputs/tsne_combined.csv
    notes:
      - title: Bucket gap is real but quantitatively bounded
        status: context
        text: |
          Eval substrate is GAN-enhanced viso recaptured through Teams (the conjunction).
          Training viso is the union of single-axis sources (enhancers OR Teams transport).
          The conjunction-match training source `visomaster_teams_enhanced` exists in code but
          has only been enabled in P16 (fw=2.0, no lift) and xan4dfto (fw=8.0, collapse).
          See PSERIES_FACTS §1.3 — frozen-feature linear probe AUC 0.92–0.998 across all
          training-bucket variants → the bucket gap is identity-confounded, not a discriminability cliff.
      - title: 27% viso recall ceiling unbroken across 10+ packets
        status: failed
        text: |
          P8A_step5000 holds the viso lead at every joint dev+lockbox FPR floor we've evaluated.
          No post-P8A R13 packet (P14, P15, P16, P17, P18T/C, P22, S1, S2, S3 + step variants)
          has lifted viso recall at FPR=10% above ~25%. Three independent data-axis attempts
          all failed (P14_DATA_FIX fw=8.0 collapsed; P16 fw=2.0 no lift; S3 fw=8.0 lost lockbox).
      - title: 2026-05-03 P8A param audit — PARTIAL
        status: warning
        text: |
          in_proj-SVD residuals are noise-dominated for L0–L4 (early layers, where camera-signature
          and image-quality shortcuts live), genuinely trained for L5–L11. 13/36 in_proj slots (36%)
          effectively unlearned. Median in_proj contribution L2 is 23× smaller than out_proj.
          The "B16 capacity ceiling" framing is partially confirmed but localized to early layers.
          Open the FINDINGS.md artifact for the full breakdown + cheap-test suggestion.
      - title: Stream B (CLIP vs P8A frozen probe) — PASSED, FT chain diffused viso signal
        status: warning
        text: |
          Raw CLIP-B16 outperforms P8A by 9-17pp on viso fake vs teams_real probe under
          classifier-capacity stress (C-sweep) and data-starvation (N-sweep). At C=1e-4:
          CLIP 0.9988 vs P8A 0.8259 (+17pp). At n=16: CLIP 0.998 vs P8A 0.912 (+9pp).
          Both saturate at AUC=1.0 with default hyperparameters because viso vs teams-real
          carries a trivial bucket gap. The C/N sweeps are what break the tie.
          Three interpretations all support revisiting scratch-from-CLIP: (1) Effort's
          orthogonal regularization spread weight across many axes, (2) P8A FT'd toward
          teams-domain axis weakly correlated with viso, (3) 5-stage FT ossification.
          Cheaper pre-test before scratch retry: rank-restoration FT (~$40) that
          concentrates signal back onto top-k singular directions (inverse Effort).
          Caveat: viso-fake-vs-viso-real probe not run (no viso-real frames available).
      - title: Stream C (skin_frac distribution gap) — REFUTED, but bigger finding surfaced
        status: warning
        text: |
          Original hypothesis (skin-aware aug as cheap lever) is refuted: skin_frac KS p=6.7e-54
          but |Δmean|=0.041 < 0.05 floor. Skin-aware aug DROPPED from candidate list.
          BIGGER FINDING: laplacian_var gap is 5.3× — training viso fakes are vastly sharper
          than eval viso fakes (mean 482 vs 91, KS=0.89, p≈10⁻²⁷⁴). luma_mean gap +51 (eval
          brighter, p≈10⁻¹⁷⁴). The eval suite is a thin ridge in image-quality feature space.
          P22's blur-jitter has the right shape but is too weak. Recommendation seeded:
          P-* sister to P22 with augmentation distribution shifted toward eval-viso joint
          (laplacian_var ~50-150, luma_mean ~135-185), single lever. ~$15-25 GPU.

