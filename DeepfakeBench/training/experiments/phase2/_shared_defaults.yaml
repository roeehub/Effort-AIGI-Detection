# =============================================================================
# Phase 2 Shared Defaults
# =============================================================================
# Common settings inherited by all Phase 2 experiment configs.
# Each experiment YAML should !include or copy the relevant sections.
#
# Backbone: ViT-B-16-DataComp-XL (LAION)
# Method: Effort (SVD orthogonal subspace decomposition)
# Base hyperparameters: From Phase 1 winning configuration
# =============================================================================

# --- Backbone ---
backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true

# --- Core hyperparameters (Phase 1 best) ---
learning_rate: 2.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 760  # k=8 trainable directions (embed_dim=768, 768-760=8)

# --- Gradient clipping ---
gradient_clip_val: 1.0

# --- Training schedule ---
nEpochs: 30
total_training_steps: 65000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 1000

# --- Dataloader ---
dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# --- Evaluation ---
evaluate_every_steps: 500
test_batch_size: 32

# --- Augmentation ---
augmentation:
  version: "base_only"
  base:
    horizontal_flip: true
    color_augmentations: true
    quality_augmentations: true
    geometric_augmentations: true

# --- Loss (CE baseline) ---
use_arcface_head: false
loss:
  type: cross_entropy

# --- Early stopping ---
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_delta: 0.001

# --- Seed ---
seed: 737

# --- GCS Assets ---
gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

# --- Checkpointing ---
checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2_experiments/"
  save_every_steps: 2000
  keep_last_n: 3

# --- Normalization ---
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]
