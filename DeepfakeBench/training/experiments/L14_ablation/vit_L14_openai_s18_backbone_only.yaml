# --- L14 Ablation: ViT-L-14 OpenAI - Backbone Only Change (s_end=18) ---
# PURPOSE: Isolate the effect of L14 backbone vs B16
# CHANGES vs B16 baseline: ONLY the backbone (L14 vs B16)
# All other hyperparameters match vit_B16_laion_s18_batch256.yaml
# Created: Jan 12, 2026

name: "L14_OpenAI_s18_backbone_only"
description: "L14 backbone, all other params same as B16 baseline - isolate backbone effect"

# === DATA SOURCE ===
data_source: combined_paired

# Backbone Configuration (OpenAI via HuggingFace) - THE ONLY CHANGE
backbone:
  name: "vit_l_14_openai"
  variant: "ViT-L-14"
  source: "openai"
  huggingface_id: "openai/clip-vit-large-patch14"
  hidden_size: 1024
  resolution: 224

# Training Hyperparameters - SAME AS B16 BASELINE
learning_rate: 5.0e-5  # Same as B16
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 1.0
rank: 1023  # Adjusted for L14 (1024 hidden - 1)

# Gradient Clipping
gradient_clip_val: 1.0

# Training Schedule
nEpochs: 150

# Dataloader Configuration
dataloader_strategy: combined_paired
frames_per_batch: 128  # Reduced from 256 due to L14 memory requirements
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# Combined Dataset Configuration
combined_paired:
  identity_balanced_sampling: true
  df40:
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods: null
  deeplive:
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
  train_split: 0.9
  val_split: 0.1
  test_split: 0.0
  seed: 737

# Augmentation
augmentation:
  version: "base_only"
  base:
    horizontal_flip: true
    color_augmentations: true
    quality_augmentations: true
    geometric_augmentations: true

# Fixed Context
test_batch_size: 32
evaluate_every_steps: 500
seed: 737
load_base_checkpoint: false

# Early stopping
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_delta: 0.001

# Learning rate scheduler - SAME AS B16 BASELINE
lr_scheduler: "cosine_with_warmup"
total_training_steps: 12000
lr_scheduler_warmup_steps: 4000  # Same as B16

# ============================================
# ArcFace Configuration - SAME AS B16 BASELINE
# ============================================
use_arcface_head: true
arcface_s: 18.0
arcface_m: 0.28
s_start: 10.0
s_end: 18.0
anneal_steps: 4000  # Same as B16

# Normalization
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

# GCS Assets
gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/models--openai--clip-vit-large-patch14/"
    local_path: "./weights/models--openai--clip-vit-large-patch14/"
    allowed_files:
      - "model.safetensors"
      - "config.json"

# Checkpointing
checkpointing:
  gcs_prefix: "gs://training-job-outputs/L14_ablation/"
  save_every_steps: 2000
  keep_last_n: 3

# Evaluation
evaluation:
  metrics: ["auc", "eer", "accuracy"]
  evaluate_every_steps: 500

# W&B
wandb:
  project: "L14-ablation"
  tags:
    - "L14-ablation"
    - "vit-l-14"
    - "openai"
    - "s_end_18"
    - "backbone_only"
    - "control"
