# --- DF40 Paired Experiment: ViT-B-16 (OpenAI CLIP) ---
# Training on DF40 paired dataset (~5,379 pairs, 8 methods)
# Created: Jan 8, 2026

name: "DF40_Paired_ViT_B16_OpenAI"
description: "DF40 paired dataset (~5,379 pairs), 8 methods, NO landmarks, ViT-B-16 backbone"

# === DATA SOURCE ===
data_source: df40_paired

# Backbone Configuration
backbone:
  name: "vit_b_16_openai"
  variant: "ViT-B-16"
  source: "openai"
  huggingface_id: "openai/clip-vit-base-patch16"
  hidden_size: 768
  resolution: 224

# Training Hyperparameters
learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 1.0
rank: 767

# Gradient Clipping
gradient_clip_val: 1.0

# Training Schedule
nEpochs: 30  # Fewer epochs needed with more data

# Dataloader Configuration
dataloader_strategy: df40_paired
frames_per_batch: 32
frames_per_video: 8  # Sparse sampling - 8 frames from 32
num_workers: 4
prefetch_factor: 2

# DF40 Paired Dataset Configuration
df40_paired:
  pair_json: "dataset/df40_pairs/df40-pair-matching.json"
  gcs_bucket: "df40-frames-recropped-rfa85"
  sampling_mode: "sparse"
  # 8 evenly spaced frames from 32 total
  anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
  # Use all methods (comment out to use subset)
  # methods: ["simswap", "facedancer", "blendface", "e4s", "faceswap", "inswap", "mobileswap", "uniface"]
  methods: null  # null = all methods
  # 80/10/10 split
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 737

# Augmentation Configuration
# NOTE: DF40 has NO LANDMARKS - landmark occlusion is automatically disabled!
augmentation:
  # This will warn but continue with base augmentations only
  version: "base_only"
  # Base augmentations are always applied
  base:
    horizontal_flip: true
    color_augmentations: true
    quality_augmentations: true
    geometric_augmentations: true

# Fixed Context
test_batch_size: 32
# ~4,303 train samples × 16 frames = ~68,848 frames / 32 batch = ~2,152 steps/epoch
evaluate_every_steps: 500  # Evaluate ~4 times per epoch
seed: 737
load_base_checkpoint: false

# Early stopping
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_delta: 0.001

# Learning rate scheduler
# ~2,152 steps/epoch × 30 epochs = ~64,560 total steps
lr_scheduler: "cosine_with_warmup"
total_training_steps: 65000
lr_scheduler_warmup_steps: 6500  # ~10% warmup

# ArcFace head
use_arcface_head: true
arcface_s: 30.0
arcface_m: 0.28
s_start: 10.0
s_end: 30.0
anneal_steps: 10000  # Anneal over ~5 epochs

# Mean and std for normalization (CLIP)
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

# Checkpointing
checkpointing:
  gcs_prefix: "gs://training-job-outputs/df40_paired_experiments/"
  save_every_steps: 5000
  keep_last_n: 3

# Evaluation
evaluation:
  metrics:
    - "auc"
    - "eer"
    - "accuracy"
  evaluate_every_steps: 500

# W&B Configuration
wandb:
  project: "df40-paired-experiments"
  tags:
    - "df40-paired"
    - "vit-b-16"
    - "openai"
    - "no-landmarks"
    - "8-methods"
