# ============================================================================
# R13_GROUPDRO_SUBSTRATE_SLOTAV2_2026-05-26.yaml — BACKBONE-SlotAv2
#
# BACKBONE-SlotAv2 packet (post-Phase-1, 2026-05-22).
#
# SINGLE-LEVER DELTA vs Slot A v2 step3500 base (R13_T5C_ANCHOR_AWARE):
#   Enable GroupDRO with `data_params.group_id_mapping` (substrate-balanced
#   asymmetric R-D / F-B keying via the existing
#   data/sources/combined_paired.py::_derive_group_id_for_yield_row pipeline).
#   The Phase-1 CPU-2 pair-loss premise was refuted on Slot A v2 (β outcome);
#   per the plan's Fallback B, BACKBONE pivots to GroupDRO substrate-balanced.
#
# Substrate-pair stamping is ENABLED (combined_paired.substrate_pair_sampling)
# so the new data_dict fields `substrate_pair_id` + `substrate_transport` are
# populated for downstream observability and to keep parity with BACKBONE-T5C.
# GroupDRO's group_id_mapping is auto-built by the pipeline; we do NOT
# manually specify the 7-group {real_clean_hdtf,...} map because the existing
# asymmetric R-D / F-B key already balances substrate (transport axis is
# `teams_capture` vs `raw_capture` vs `visomaster`) AND source AND chronic
# vs regular AND quality. See `analysis/group_id_design_audit_2026-05-06/`
# for the rationale.
#
# MOTIVATION (FACTS):
#   - CPU-2 (2026-05-22): mean(raw_clean)=0.5029 < mean(raw_teams)=0.5419,
#     Wilcoxon p=0.0020, cohort partition at τ=0.20 yields 62:1 asymmetry.
#     Same direction as E2B 2026-05-04. Per literal rule, β outcome.
#   - CPU-3 (2026-05-22): cos(P8A, SlotAv2)=0.692, cos(SlotAv2, T5C)=0.924.
#     SlotAv2 and T5C substrate axes are 0.924-aligned → single shared
#     problem; GroupDRO worst-group framing is the appropriate generalization.
#
# FALSIFIERS (close criterion):
#   - dev_fake_macro_recall regresses below 0.40 across all steps.
#   - lockbox_real_fpr regresses > +0.01 absolute vs Slot A v2 step3500
#     (Slot A v2 lockbox_real_fpr = 0.0191).
#   - composite λ=1.0 worsens by > 0.05 vs base.
#
# CONFIRMATION (deployment grade):
#   - composite λ=1.0 ≤ 0.25
#   - lockbox_real_fpr ≤ 0.018
#   - lockbox_fake_recall ≥ 0.70
#   - viso_enhanced_macro_dev recall ≥ 0.15
#   - dev_fake_macro_recall ≥ 0.40
#
# COST: ~$45-65 Vertex (us-west4, A100×1, 3500 steps FT regime).
# CONFIDENCE: 35-45% any single ckpt clears the composite ≤ 0.25 gate.
# Seed: 9915
# ============================================================================

name: "R13_GROUPDRO_SUBSTRATE_SLOTAV2_SMOKE_2026-05-26"
description: "SMOKE variant of R13_GROUPDRO_SUBSTRATE_SLOTAV2_2026-05-26 — 200 steps only to verify GroupDRO mechanism + substrate_paired_inventory data lanes wire end-to-end. Pre-full-launch gate per Phase 2 BACKBONE-SlotAv2 task."
seed: 9915

wandb:
  tags:
    - "phase2-round13"
    - "stage-phase-2-backbone-2026-05-22"
    - "backbone-slotav2"
    - "groupdro-substrate-balanced"
    - "ft-from-slotav2-step3500"
    - "inherits-anchor-aware"
    - "inherits-multi-axis-grl"
    - "single-lever"
    - "no-pair-rank"
    - "no-substrate-pair-asymmetric"
    - "no-resolution-chain-aug"
    - "no-face-scale-jitter"
    - "no-arcface"
    - "seed-9915"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 2
total_training_steps: 200
max_train_steps: 200
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 50

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/best_checkpoints/hp35c51p/periodic_effort_20260516_step3500_auc0.9952_eer0.0123.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# ===== Multi-axis encoder-level GRL — INHERITED from Slot A v2 (unchanged) =====
multi_axis_grl:
  enabled: true
  axes:
    - chronic_flag
    - is_dor
    - sharpness_laplacian_high
    - color_a_approx_dev_high
  lambda_max: 1.0
  lambda_warmup_steps: 250
  loss_weight: 1.0
  hidden_dim: 1024
  bottleneck_dim: 128

# ===== NO resolution_chain_aug =====
resolution_chain_aug:
  enabled: false

# ===== NEW LEVER: GroupDRO substrate-balanced =====
# The existing combined_paired pipeline auto-builds the asymmetric R-D / F-B
# group_id_mapping at config-load time (data/sources/combined_paired.py::
# build_group_id_mapping_for_samples), transferred into config['data_params']
# by train_sweep.py:609-615. The mixin reads it from data_params.
# Beta=0.1 is conservative (default is 3.0); higher beta amplifies worst-
# group weight more aggressively. ema_alpha=0.9 is mixin default; lower
# warmup_steps=200 vs default 100 gives a calmer ramp.
use_group_dro: true
group_dro_params:
  beta: 0.1
  ema_alpha: 0.9
  warmup_steps: 200
  clip_min: 0.05
  clip_max: 1.0

# ===== NO substrate_pair_asymmetric_loss (BACKBONE-T5C uses that lever) =====
substrate_pair_asymmetric_loss:
  enabled: false

# ===== All other levers identical to Slot A v2 (no change) =====

pair_rank_loss:
  lambda: 0.0

correlation_penalty:
  enabled: false

# ===== INHERITED: anchor_aware penalty (from Slot A v2 base) =====
anchor_aware:
  enabled: true
  weight: 5.0
  target_mean_prob: 0.10
  samples_per_step: 16
  pool_names:
    - "dor-real-webcam-false-flag-no-virtual-bg"

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 9915
  seed: 9915

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  # NEW (2026-05-22): substrate-pair stamper. Reads the inventory CSV at
  # trainer init and stamps substrate_pair_id + substrate_transport per
  # video in the collate. GroupDRO uses these fields only indirectly (the
  # asymmetric R-D / F-B key already encodes transport). The stamping is
  # enabled here for downstream observability and parity with BACKBONE-T5C.
  substrate_pair_sampling:
    enabled: true
    inventory_path: "analysis/substrate_pair_geometry_2026-05-22/inventory_manifest.csv"
    sources:
      - hdtf_visomaster_teams
      - quickclips_visomaster_teams
      - visomaster_teams_enhanced
      - deeplive_teams
    pair_fraction: 0.25

  # NEW (2026-05-22 PM, commit ed10630): substrate_paired_inventory data
  # source. Reads HDTF (1094 pairs) + quickclips (732 pairs) directly from
  # the A0.1 inventory CSV — these GCS buckets had no existing iterator
  # before today. Without this block enabled the BACKBONE training only
  # sees the 54 viso_teams_enhanced pairs that already had an iterator.
  substrate_paired_inventory:
    enabled: true
    inventory_path: "analysis/substrate_pair_geometry_2026-05-22/inventory_manifest.csv"
    sources:
      - hdtf_visomaster_teams
      - quickclips_visomaster_teams
    sparse_indices: [0, 4, 8, 12]
    parallel_download_workers: 8

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    frame_keep_list_path: "analysis/cpu_diagnostics_2026-05-09/slot1_teams_real_keep_list_2026-05-09.csv"

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 9915
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 100
ood_monitoring_start_step: 100
ood_monitoring_every_steps: 200
test_batch_size: 32

early_stopping_enabled: false
early_stopping_patience: 999

periodic_saves:
  enabled: true
  step_list:
    - 100
    - 200

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
