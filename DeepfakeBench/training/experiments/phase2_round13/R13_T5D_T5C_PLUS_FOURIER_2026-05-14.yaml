# ============================================================================
# R13_T5D_T5C_PLUS_FOURIER_2026-05-14.yaml
# Single-lever delta on top of T5C step3500: add band-limited Fourier-amp aug.
#
# Hypothesis: T5C's classifier-1024 lever drives uniform encoder invariance
# (per the T5C scorecard mechanism claim, MEDIUM confidence). P2D's Fourier-
# band aug demonstrated weakening of the high-frequency shortcut on B16
# scratch (gap shifts in viso). Stacking the two on T5C should:
#   - preserve T5C's existing F4-substrate gap (0.526)
#   - improve P2-substrate behavior (chronic-cohort like Roy_D, where
#     T5C currently fires 100% of frames > 0.5)
#   - reduce may6 production-drift fire rate (T5C step3500: 17/92 → ?)
#
# Falsifier criteria (set BEFORE looking at scorecard):
#   F1: F4 macro fake recall ≥ 95% at FPR ≤ 5% (preserve T5C's strength)
#   F2: F4 safety gap ≥ 0.45 (within 0.08 of T5C step3500's 0.526)
#   F3: Roy_D per-identity frac > 0.50 drops from 100% to ≤ 70%
#   F4: may6 fire rate ≤ 12/92 (better than T5C's 17/92)
# Promote IF F1 AND F2 (safety floor) AND (F3 OR F4) (robustness gain).
#
# Differs from prior attempts (loop avoidance):
#   - T6 (T3 + jitter@0.50): jitter is geometric, not spectral. Failed.
#   - T7 (T4 + jitter@0.50): same — refuted as composable lever.
#   - P2D (B16 scratch + Fourier): different base. Single-lever discipline.
#   - T5D = T5C + Fourier. NEW combination — single net-new lever vs T5C.
#
# COST: ~$30-50 Vertex (us-east1, A100×1, 3000 added steps from T5C base,
#   FT-style learning rate). Runtime ~3-5h.
# CONFIDENCE: 40-50% any single ckpt improves over T5C on F4 (Fourier could
#   weaken signal as easily as strengthen it). 60-70% the mechanism produces
#   measurable Roy_D-frame-fraction change regardless of scorecard outcome.
# Seed: 9501 (inherits)
# ============================================================================

name: "R13_T5D_T5C_PLUS_FOURIER_2026-05-14"
description: "T5C step3500 base + band-limited Fourier amplitude augmentation. Tests whether spectral aug stacks on the classifier-capacity lever. Single-lever delta vs T5C."
seed: 9501

wandb:
  tags:
    - "phase2-round13"
    - "t5d"
    - "t5c-plus-fourier"
    - "spectral-aug-stack"
    - "ft-from-t5c-step3500"
    - "encoder-invariance"
    - "seed-9501"
    - "2026-05-14"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 5.0e-5  # halved vs T5C's 1.0e-4 for continued FT discipline
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 10
total_training_steps: 3000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 300

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/best_checkpoints/jrlldtem/periodic_effort_20260511_step3500_auc0.9944_eer0.0197.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# ===== Inherit T5C's classifier-1024 multi-axis-GRL =====
multi_axis_grl:
  enabled: true
  axes:
    - chronic_flag
    - is_dor
    - sharpness_laplacian_high
    - color_a_approx_dev_high
  lambda_max: 1.0
  lambda_warmup_steps: 300
  loss_weight: 1.0
  hidden_dim: 1024
  bottleneck_dim: 128

# ===== NEW: Fourier-band aug (single-lever delta vs T5C) =====
# Inherits from P2D (R13_P2_SCRATCH_FOURIER.yaml) — same hyperparameters that
# delivered P2D's spectral-shortcut weakening.
fourier_aug:
  enabled: true
  p_apply: 0.5
  bands_randomize: [8, 9, 10, 11, 12, 13]
  bands_preserve: [5, 6]
  noise_log_range: [-0.3, 0.3]
  radial_resolution: 16
  image_resolution: 224

# ===== All other levers IDENTICAL to T5C =====

pair_rank_loss:
  lambda: 0.0

use_group_dro: false

correlation_penalty:
  enabled: false

anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 9501
  seed: 9501

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
