# ============================================================================
# R13_P1_PAIRRANK_ONLY_FT_FROM_P8A.yaml
# Phase 2, Round 13 — Packet P1 (PE_PAIR_RANK_DRO), Slot 2 ablation:
#   pair-rank loss ONLY, FT-from-P8A on the post-`2feea58` codepath.
#
# Plan: docs/relaunch_handoffs/NEXT_STEPS_PLAN_2026-05-06.md §8.2 P1
# Wiring landed 2026-05-07: collate emits per-video `pair_id`; detector adds
# `_compute_pair_rank_loss` (softplus margin in logit space, skips pair_ids
# with only-real or only-fake samples — safe under non-uniform lane coverage).
#
# THE LEVER (vs P1_BUNDLE):
#   - pair_rank_loss ON: λ=0.2, margin=0.5 (logit space)
#   - GroupDRO OFF (single-lever ablation; bundled variant lives in a separate
#     YAML once the group_id loader plumbing lands)
#   - correlation_penalty OFF (single-lever discipline; the PD scorecard
#     2026-05-06 substantiated that single-axis IQ-penalty class
#     shortcut-shifts and breaks substrate invariance — see plan §3.7 PD row
#     and `analysis/pd_scorecard_artifacts_2026-05-06/`)
#   - arcface OFF, anchor_aware OFF, face_scale_jitter OFF
#
# WHY FT-FROM-P8A:
#   - `analysis/checkpoint_cohort_diagnosis_2026-05-06`: P8A wins 7/9 cohort
#     axes; `real_FP_fake_missed` cell at τ=0.5 = P8A 0.0% / E2B 3.2%.
#   - P8A retains uniquely low Dor real-FPR (memory `project_p8a_breakthrough`)
#     where PD arms catastrophically regress at this τ.
#   - Post-`2feea58` codepath activates `apply_svd_to_in_proj` q/k/v
#     classification gradient for the first time on the P8A lineage. The
#     in-proj-SVD lever's payoff under pair-rank loss is **unverified** —
#     `packets/P8A.md:108` ablation under P10_SYM tied within noise. Treat
#     the grad-audit at step 100/500/1000 as a plumbing-check (zero gradient
#     → abort, fix regressed silently); promotion is gated on F1-F5 metrics.
#
# DATA PLANE: identical to R13_VISO_CORR_PENALTY (all 6 paired lanes
#   enabled); pair_rank_loss=0 on lanes where the batch happens to lack a
#   paired counterpart (per `analysis/pair_coverage_audit_2026-05-06` Agent 2
#   uniform-application recommendation). external_vcd_real has empty
#   sample_id by default → pair_rank_loss skips it naturally.
#
# Pre-registered close criterion (4/4):
#   F1: lockbox fake recall ≥ 90% at FPR ≤ 10%.
#   F2: pair-ranking metric — fraction `fake_score > real_score` on previously
#       missed fakes lifts ≥ 30% on at least 2 of 6 paired lanes; worst-group
#       recall lift ≥ 20% on chronic / dor-drift cohorts (see plan §8.2 P1).
#   F3: no untargeted axis (is_webcam, face_area_fraction, min_dim,
#       color_b_dev) amplifies +50%.
#   F4: HDTF cross-substrate FPR ≤ 5%.
#
# Confidence (from plan §8.2): single-packet three-pillar closure 20-30%.
#   This Slot 2 ablation answers "is pair-rank alone the load-bearing lever,
#   or does GroupDRO need to stack with it?" against the bundled variant.
#
# Cost: ~$50-80 Vertex (us-east1, 5-7h, 4500 steps, FT regime).
#
# Seed: 5071 (distinct from the deeplive/viso ship sequence).
# ============================================================================

name: "R13_P1_PAIRRANK_ONLY_FT_FROM_P8A"
description: "P1 Slot 2 ablation — pair-rank loss only, FT-from-P8A on post-2feea58 codepath. Single-lever PE_PAIR_RANK_DRO without GroupDRO."
seed: 5071

wandb:
  tags:
    - "phase2-round13"
    - "p1-pairrank"
    - "ft-from-p8a"
    - "post-2feea58-codepath"
    - "single-lever-ablation"
    - "pair-rank-loss"
    - "lambda-0.2"
    - "margin-0.5"
    - "no-group-dro"
    - "no-correlation-penalty"
    - "no-arcface"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "cross-entropy-loss"
    - "seed-5071"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true   # Now actually trains q/k/v residuals (post-2feea58)
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

# FT regime — slightly longer than the corr-penalty ships (4500 vs 2500
# steps) because pair-rank's signal is sparser per batch (only fires on
# pair_ids with both labels present; expected hit rate ~50-90% per lane per
# coverage audit). Other hyperparams matched to R13_VISO_CORR_PENALTY for
# direct comparability against the corr-penalty class.
learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 12
total_training_steps: 4500
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 450

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
# P8A_REFERENCE_STEP5000 — run 9lmvb5b4, "smooth-haze-250", trained 2026-04-24.
# Pre-fix in_proj-SVD; post-`2feea58` FT here activates the lever for the
# first time. See plan §6.5 + analysis/p8a_training_date_check_2026-05-06/.
gcs_base_checkpoint: "gs://training-job-outputs/phase2r13_experiments/9lmvb5b4/value_composite_effort_20260424_step5000_auc0.9926_eer0.0270.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# Pair-rank loss (PE_PAIR_RANK_DRO, P1) — softplus(margin - (fake_logit - real_logit))
# averaged over pair_ids with both labels present in the batch.
pair_rank_loss:
  lambda: 0.2
  margin: 0.5

# Correlation-penalty OFF (single-lever discipline; PD scorecard refuted the
# class on the load-bearing real-side cells).
correlation_penalty:
  enabled: false

anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 5071
  seed: 5071

  # face_area parquet (covers 5 deeplive strategies). Not used by pair-rank
  # but kept available for downstream eval-time correlation metrics.
  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  # All 6 paired lanes enabled — pair_rank_loss=0 on lane batches without
  # paired counterpart per coverage audit; harmless to apply uniformly.
  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  # visomaster_hints / visomaster_hints_teams: bad data (per memory
  # `project_visomaster_hints_lanes_bad_data`). NEVER train on these.
  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 5071
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 250
ood_monitoring_start_step: 250
ood_monitoring_every_steps: 500
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 12

# Periodic saves spaced for the longer schedule. step 100/500/1000 are
# included specifically for the in-proj-SVD grad-audit (per packets/P8A.md:108
# the post-fix lever may be inert under this loss class — these checkpoints
# let us re-audit cheaply without abandoning the run).
periodic_saves:
  enabled: true
  step_list:
    - 100
    - 500
    - 1000
    - 1500
    - 2500
    - 3500
    - 4500

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
