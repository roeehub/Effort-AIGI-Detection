# ============================================================================
# R13_LORA_T5C_L8_L9_R8_2026-05-19.yaml — Tonight Slot 2 (overnight 2026-05-19)
#
# LAYER-RELOCATION ABLATION of R13_LORA_T5C_L10_L11_R8_2026-05-14 (Slot α
# rank-8 LoRA on T5C step3500 base, layers 10-11). Single-lever delta:
# target_layers [10, 11] → [8, 9]. All other LoRA parameters (rank=8,
# alpha=16, modules, head LR, lora_lr_mult, freeze_base) IDENTICAL.
#
# MOTIVATION (FACTS — from memory `project_lora_l10_l11_chronic_fp_hard_coupled_2026-05-15`):
#   LoRA r=16 on T5C step3500 at layers 10-11 (Slot 2 in 2026-05-13 batch,
#   run gf6l06rf) produced +74pp visomaster_enhanced_macro_dev recall
#   (0.882 vs T5C step3500's 0.138) at a 9× lockbox_real_fpr cost (0.249 vs
#   T5C 0.0279). Per the memory: "LoRA-L10-L11 +74pp viso lift hard-couples
#   to ~24% lockbox_real_fpr". Rank ablation r=8 (R13_LORA_T5C_L10_L11_R8_2026-05-14,
#   alpha=16) did NOT change the trade-off ratio materially — i.e., capacity
#   is NOT the dial controlling the regression.
#
# HYPOTHESIS:
#   If the regression mechanism is intrinsic to LATE-layer attachment (L10,
#   L11 — the layers most-CLS-aligned for ViT-B/16), earlier-layer LoRA
#   (L8, L9) should produce a different (viso_recall vs lockbox_FPR) point.
#   - If FPR regression vanishes AND viso lift preserved → L8-L9 is a clean
#     deployment-grade lever.
#   - If FPR regression vanishes BUT viso lift also vanishes → confirms the
#     L10-L11 mechanism captures genuine viso signal localized at those layers.
#   - If FPR regression persists → the mechanism is NOT layer-attachment but
#     something else (e.g., LoRA + frozen-SVD interaction); pivot to
#     output-preservation aux loss in a follow-up.
#
# FALSIFIERS (close criterion):
#   - lockbox_real_fpr > 0.15 AND viso_enhanced_macro_dev < 0.40 → neither
#     improvement direction realized; lever class becomes much less
#     interesting (but result is still a clean ablation point).
#
# CONFIRMATION (deployment grade):
#   - lockbox_real_fpr ≤ 0.05 AND viso_enhanced_macro_dev ≥ 0.20
#   - dev_fake_macro_recall ≥ 0.40
#   - no per-identity FPR > 30% on the chronic-6 set
#
# DIFFERS FROM PRIOR ATTEMPTS:
#   - Slot 2 in 2026-05-13 batch: LoRA r=16 / alpha=32, layers [10, 11].
#   - R13_LORA_T5C_L10_L11_R8_2026-05-14 (Slot α): rank ablation; r=8 /
#     alpha=16, layers STILL [10, 11].
#   - This packet: layer ablation; r=8 / alpha=16 unchanged, layers [8, 9].
#   - No prior packet has tested L8-L9 LoRA on T5C base.
#
# OPEN LOOPS ADDRESSED:
#   - LoRA-attachment-layer ablation (extends the L10-L11 hard-coupling
#     finding in memory `project_lora_l10_l11_chronic_fp_hard_coupled_2026-05-15`).
#   - `canary-probe-not-default-in-yaml-templates` (MEDIUM, 2026-05-16):
#     canary enabled at freq=500 (this base yaml had it at freq=1000).
#
# COST: ~$25-35 Vertex (us-east1 first; A100×1, ~5000 steps; LoRA runs land
#   in ~2-3h per prior batch).
# CONFIDENCE: 80% closes the layer-attachment question. 40% deployment-grade.
# Seed: 9918
# ============================================================================

name: "R13_LORA_T5C_L8_L9_R8_2026-05-19"
description: "Tonight Slot 2 — LoRA r=8 alpha=16 on resblocks 8 & 9, frozen T5C step3500 base. Layer-relocation ablation of R13_LORA_T5C_L10_L11_R8_2026-05-14 (Slot α). Single-lever delta: target_layers [10,11] → [8,9]. Tests whether L10-L11's +74pp viso / 9× chronic-FP hard-coupling is intrinsic to late-layer attachment."
seed: 9918

wandb:
  tags:
    - "phase2-round13"
    - "stage-tonight-2026-05-19"
    - "lora"
    - "lora-l8-l9"
    - "lora-layer-ablation"
    - "frozen-base"
    - "rank-8-alpha-16"
    - "layer-ablation-of-slot-alpha-r8"
    - "ft-from-t5c-step3500"
    - "canary-enabled"
    - "no-multi-axis-grl"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "no-arcface"
    - "seed-9918"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  apply_svd_to_mlp: true
  unfreeze_final_proj: false
  unfreeze_final_ln: false

learning_rate: 1.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8

optimizer:
  type: "adam"
  adam:
    lr: 1.0e-5
    eps: 1.0e-8
    weight_decay: 0.05
    lora_lr_mult: 10.0

lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 14
total_training_steps: 5000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 500

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/best_checkpoints/jrlldtem/periodic_effort_20260511_step3500_auc0.9944_eer0.0197.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# ===== LoRA: low-rank adapter at resblocks 8 and 9 (LAYER RELOCATION) =====
# Single-lever delta vs R13_LORA_T5C_L10_L11_R8_2026-05-14: target_layers
# changed from [10, 11] to [8, 9]. Per detectors/lora_adapter.py:316
# `apply_lora_to_openclip_visual(target_layers: Sequence[int], ...)` accepts
# any layer indices 0..n_blocks-1; verified via test_lora_adapter.py.
lora:
  enabled: true
  target_layers: [8, 9]
  rank: 8
  alpha: 16
  target_modules: ["attn.in_proj", "attn.out_proj", "mlp.c_fc", "mlp.c_proj"]
  freeze_base: true

# ===== Disabled levers (isolation of the LoRA mechanism) =====

multi_axis_grl:
  enabled: false

pair_rank_loss:
  lambda: 0.0

use_group_dro: false

correlation_penalty:
  enabled: false

anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: false

# ===== Augmentation (inherited from T5C / T3 SLOT1) =====

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

# ===== Canary probe — freq=500 (base yaml had freq=1000) =====
canary_probe:
  enabled: true
  parquet_path: "arena/canaries/teams_chronic_diverse_800_2026-05-07.parquet"
  frequency_steps: 500
  max_frames: 1000
  batch_size: 64

combined_paired:
  identity_balanced_sampling: true
  split_seed: 9918
  seed: 9918

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
