# Canonical future proper-data target-domain suites.
#
# Use with a manifest built by:
#   python arena/build_future_proper_target_domain_manifest.py \
#     --inventory arena/future_proper_data_inventory.template.yaml \
#     --output arena/manifests/proper_visomaster_target_domain_manifest_2026-04-19_provisional.json
#
# Naming contract coordinated with WT-E:
# - suite names always use `<slice>_<split>`
# - promotion-friendly defaults for `score_teams_promotion_contract.py` are:
#   --dev_real_suite proper_real_teams_dev
#   --dev_fake_suites proper_fake_teams_all_dev,proper_visomaster_teams_dev,proper_visomaster_enhanced_teams_dev
#   --lockbox_real_suite proper_real_teams_lockbox
#   --lockbox_fake_suite proper_fake_teams_all_lockbox
#
# These suites keep the target condition explicit. They do not reuse
# `teams_fake_all`, `teams_real_all`, hint lanes, or `visomaster_teams_enhanced`.

suites:
  - name: proper_real_teams_dev
    df40_mode: none
    external_real_manifest: "arena/manifests/proper_visomaster_target_domain_manifest_2026-04-19_provisional.json"
    external_real_manifest_split: "dev"
    external_real_manifest_slices: "proper_real_teams"
    external_real_deterministic: true

  - name: proper_real_teams_lockbox
    df40_mode: none
    external_real_manifest: "arena/manifests/proper_visomaster_target_domain_manifest_2026-04-19_provisional.json"
    external_real_manifest_split: "lockbox"
    external_real_manifest_slices: "proper_real_teams"
    external_real_deterministic: true

  - name: proper_real_clean_dev
    df40_mode: none
    external_real_manifest: "arena/manifests/proper_visomaster_target_domain_manifest_2026-04-19_provisional.json"
    external_real_manifest_split: "dev"
    external_real_manifest_slices: "proper_real_clean"
    external_real_deterministic: true

  - name: proper_real_clean_lockbox
    df40_mode: none
    external_real_manifest: "arena/manifests/proper_visomaster_target_domain_manifest_2026-04-19_provisional.json"
