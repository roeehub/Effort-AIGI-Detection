# ============================================================================
# R13_T5C_6AXIS_PLUS_ANCHOR_2026-05-19.yaml — Tonight Slot 1 (overnight 2026-05-19)
#
# STACKED-LEVER DELTA vs T5C step3500 base: combines two existing levers that
# have NEVER been stacked simultaneously —
#   (a) `multi_axis_grl` with 6 axes (the Slot β recipe, run `gwntcld0` 2026-05-16)
#   (b) `anchor_aware` penalty on the dor-real-webcam-false-flag-no-virtual-bg
#       pool (the Slot A v2 recipe, weight=5.0 / target=0.10 / samples=16,
#       2026-05-16 batch)
# Both already exist in the codebase; this packet is YAML-ONLY (no code change).
#
# MOTIVATION (FACTS — from 2026-05-19 pre-plan CPU battery):
#   `analysis/cpu_diagnostics_2026-05-19_pre_plan/FACTS_2026-05-19.md`:
#   - Slot β step3500 viso recall 0.235 (highest in 2026-05-16 contract) at
#     lockbox_real_fpr 0.0882 (4.8× P8A).
#   - **93.5% of Slot β's 124 lockbox over-fires concentrate on `dor_shkedi`**
#     (under-covered identity per joint-marginal §2.4, median ratio 0.21).
#   - 86 of 87 NEW failures (vs T5C) are also on dor_shkedi.
#   - Slot A v2 (T5C + anchor_aware on dor-only pool, 2026-05-16) rescued
#     Chikara_Takahashi__s22 (26→0%) and PC_Generator__s15 (28→0%) — both
#     under-covered chronic identities. But used dor-only pool with T5C's
#     4-axis GRL, NOT the Slot β 6-axis GRL.
#
# HYPOTHESIS:
#   Slot β's viso lift is real but bounded by the dor_shkedi over-fire
#   concentration. Anchor_aware directly penalizes prob_fake on the dor
#   false-flag pool — the same identity that drives 93.5% of Slot β's
#   over-fires. Stacking the two should preserve Slot β's viso lift while
#   pulling dor FPR down. Two mechanisms (GRL `is_dor` axis + anchor pool)
#   target the same identity — should be additive or at worst non-interfering.
#
# FALSIFIERS (close criterion):
#   - lockbox_real_fpr > 0.05 AND viso_enhanced_macro_dev < 0.15 at every
#     saved step → stack interference (worst-of-both)
#   - dev_fake_macro_recall regresses below 0.30 floor → stacked levers
#     pull encoder too hard
#
# CONFIRMATION (deployment grade):
#   - lockbox_real_fpr ≤ 0.04 AND viso_enhanced_macro_dev ≥ 0.18
#   - per-identity dor_shkedi FPR < 0.30 at some saved step
#   - dev_fake_macro_recall ≥ 0.40
#
# DIFFERS FROM PRIOR ATTEMPTS:
#   - No prior packet stacks `multi_axis_grl.enabled=true` AND
#     `anchor_aware.enabled=true` simultaneously (validated via grep against
#     experiments/phase2_round13/*.yaml on 2026-05-19).
#   - Slot β (run gwntcld0) had GRL only (anchor_aware disabled).
#   - Slot A v2 (run from 2026-05-16 batch) had anchor only with T5C's 4-axis
#     GRL (NOT 6-axis).
#
# OPEN LOOPS ADDRESSED:
#   - `slot-b-viso-lift-mechanism-and-lockbox-fpr-localization` (HIGH, 2026-05-16):
#     tests whether dor over-fire is rule-rescuable by anchor mechanism.
#   - `canary-probe-not-default-in-yaml-templates` (MEDIUM, 2026-05-16):
#     this yaml ENABLES canary_probe at freq=500.
#
# COST: ~$25-35 Vertex (us-west4 first; A100×1, ~3500 steps FT).
# CONFIDENCE: 70% closes mechanism question (regardless of promotion). 35-45%
#   that a single ckpt is deployment-grade.
# Seed: 9919
# ============================================================================

name: "R13_T5C_6AXIS_PLUS_ANCHOR_2026-05-19"
description: "Tonight Slot 1 — T5C step3500 base + 6-axis GRL (Slot β recipe) STACKED with anchor_aware penalty on dor false-flag pool (Slot A v2 parameters). First packet to stack multi_axis_grl + anchor_aware simultaneously. Tests whether Slot β's 93.5%-dor_shkedi over-fire concentration is recoverable by adding training-time anchor penalty on that exact pool."
seed: 9919

wandb:
  tags:
    - "phase2-round13"
    - "stage-tonight-2026-05-19"
    - "stacked-grl-anchor"
    - "multi-axis-grl-6axis"
    - "anchor-aware-enabled"
    - "ft-from-t5c-step3500"
    - "inherits-slot-beta-recipe"
    - "inherits-slot-a-v2-anchor-params"
    - "closes-slot-b-fpr-loop"
    - "canary-enabled"
    - "no-pair-rank"
    - "no-group-dro"
    - "no-resolution-chain-aug"
    - "no-face-scale-jitter"
    - "no-arcface"
    - "seed-9919"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 10
total_training_steps: 3500
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 350

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/best_checkpoints/jrlldtem/periodic_effort_20260511_step3500_auc0.9944_eer0.0197.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# ===== Multi-axis encoder-level GRL — Slot β recipe (6 axes) =====
multi_axis_grl:
  enabled: true
  axes:
    - chronic_flag
    - is_dor
    - sharpness_laplacian_high
    - color_a_approx_dev_high
    - color_b_dev_high
    - luma_mean_high
  lambda_max: 1.0
  lambda_warmup_steps: 250
  loss_weight: 1.0
  hidden_dim: 1024
  bottleneck_dim: 128

# ===== Slot α's resolution_chain_aug NOT stacked here =====
resolution_chain_aug:
  enabled: false

# ===== All other isolation levers identical to Slot β / Slot A v2 =====

pair_rank_loss:
  lambda: 0.0

use_group_dro: false

correlation_penalty:
  enabled: false

# ===== STACKED LEVER: anchor_aware penalty (Slot A v2 parameters) =====
# Per Slot A v2 (2026-05-16): weight=5.0, target_mean_prob=0.10, samples=16.
# Pool defined in analysis/teams_pool_rescore.py — discovers ~24-50 dor false-flag
# webcam frames at gs://real-teams-dor-roee/.../dor-real-webcam-false-flag-no-virtual-bg/.
# Stacking with 6-axis GRL is novel — see header note for prior-art check.
anchor_aware:
  enabled: true
  weight: 5.0
  target_mean_prob: 0.10
  samples_per_step: 16
  pool_names:
    - "dor-real-webcam-false-flag-no-virtual-bg"

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

# ===== Canary probe — addresses `canary-probe-not-default-in-yaml-templates` loop =====
# freq=500 (not 1000) gives ~7 in-training probes for early score-crash detection.
canary_probe:
  enabled: true
  parquet_path: "arena/canaries/teams_chronic_diverse_800_2026-05-07.parquet"
  frequency_steps: 500
  max_frames: 1000
  batch_size: 64

combined_paired:
  identity_balanced_sampling: true
  split_seed: 9919
  seed: 9919

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    frame_keep_list_path: "analysis/cpu_diagnostics_2026-05-09/slot1_teams_real_keep_list_2026-05-09.csv"

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 9919
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 250
ood_monitoring_start_step: 250
ood_monitoring_every_steps: 500
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 12

periodic_saves:
  enabled: true
  step_list:
    - 100
    - 500
    - 1000
    - 1500
    - 2500
    - 3500

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
