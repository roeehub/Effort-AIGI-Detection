# =============================================================================
# Round 5 — R5_S2: Scratch FT7-like weighted sampler
# =============================================================================

name: "R5_S2_scratch_ft7mix_weighted_seed1337"
description: "From-scratch FT7-style data mix + weighted family resampling (seed=1337)"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true

learning_rate: 2.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 30
total_training_steps: 65000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 1000

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: false

combined_paired:
  identity_balanced_sampling: true
  split_seed: 737

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods: null

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "Inswapper128"
    tiers: null
    cache_manifest_uri: "gs://training-job-outputs/cache/visomaster/r5_ft7mix_visomaster_discovery.json"
    cache_max_age_hours: 6
    cache_validate_listing: true
    cache_revision: "2026-02-17-r5"

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 1.0
      visomaster_fake: 0.8
      deeplive_non_enhanced_fake: 2.0
      deeplive_enhanced_fake: 2.5
      df40_real: 1.0
      realpool_real: 1.0
      external_real: 1.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05
  seed: 1337

  holdout:
    mode: "method_holdout"
    df40_orientation: "target_source"
    methods:
      - "visomaster_Inswapper128"
      - "visomaster_GhostFace-v2"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

augmentation:
  version: "quality_targeted_family"
  strength: "light"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"

use_arcface_head: true
arcface_m: 0.0
arcface_s: 10.0
s_start: 10.0
s_end: 18.0
anneal_steps: 30000

evaluate_every_steps: 500
ood_monitoring_start_step: 1000
ood_monitoring_every_steps: 2000
test_batch_size: 32
seed: 1337

early_stopping_enabled: true
early_stopping_patience: 10

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2r5_experiments/"
