# Stratification parquet — Phase 5 cross-condition probe
parquet:
  path: analysis/lockbox_tagging/full_tags_2026-04-27.parquet
  # Column to join on. The parquet has gcs_uri + blob_path; CSVs use frame_path
  # which is gs://... — we'll attempt join on gcs_uri first, then on basename.
  join_keys: [gcs_uri, blob_path, local_path]
  strat_columns:
    - clip_capture_mode
    - face_area_quartile
    - sharpness_quartile
    - clip_lighting
    - is_low_quality
    - is_no_face
