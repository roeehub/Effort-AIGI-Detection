# Per-checkpoint configuration for production-aggregation calibration framework.
# Adding a new ckpt = add an entry here. Each entry maps suite_name -> CSV path.
#
# Suites are FRAME-LEVEL score reports with cols: method, label, video_id,
# frame_path, frame_prob, group_key, family_key.
#
# label_class is "real" or "fake" — used to compute video-level recall vs FPR.

