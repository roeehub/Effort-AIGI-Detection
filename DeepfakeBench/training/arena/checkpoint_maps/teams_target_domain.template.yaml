# - POST_R12_ENH_INT8
# - TRACK_A_CANDIDATE
#
# Replace the placeholder URIs below with the real checkpoint paths.

R12_G_FP32: "gs://replace-me/r12_g_fp32.pth"
R12_G_INT8: "gs://replace-me/r12_g_int8.pth"
POST_R12_ENH_FP32: "gs://replace-me/post_r12_enh_fp32.pth"
POST_R12_ENH_INT8: "gs://replace-me/post_r12_enh_int8.pth"
