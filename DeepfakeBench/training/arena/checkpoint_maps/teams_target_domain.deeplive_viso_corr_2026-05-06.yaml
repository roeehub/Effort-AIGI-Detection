# Promotion-contract validation map for the corr-penalty deeplive + viso runs
#
# Authored 2026-05-06 to evaluate:
#   - R13_DEEPLIVE_CORR_PENALTY (run 8jgyw1am, "rogue-senate-951")
#   - R13_VISO_CORR_PENALTY     (run 7u3zc5zt, "elegant-emperor-952")
#
# Both arms FT from E2B_TOP_N_STEP3200 with correlation_penalty(lambda=1.0)
# on three pixel/geometry axes: sharpness_laplacian, luma_mean,
# face_area_fraction. Differ only in whether visomaster sources are
# enabled in the data plane.
#
# Close criterion (4/4 must pass):
#   F1: lockbox recall >= 90% at FPR <= 10% (excluding no_face / extreme low IQ)
#   F2: shortcut weakening >= 30% on >= 2 of 5 axes (vs E2B baseline)
#   F3: no shortcut shifting (no untargeted axis +50%)
#   F4: HDTF cross-substrate FPR <= 5%
#
# Baselines included for direct comparison:
#   - P8A_REFERENCE_STEP5000: production anchor (27% viso ceiling)
#   - E2B_TOP_N_STEP3200: FT base for both packets (must beat to justify)
#
# Checkpoint selection rationale:
#   DEEPLIVE (8jgyw1am, 11 ckpts saved):
#     top_n step4800: highest AUC top_n (0.9970, EER 0.0113)
#     top_n step1800: mid-trajectory top_n (0.9962, EER 0.0169)
#     periodic step2000: trajectory anchor for cross-packet comparison (0.9939)
#   VISO (7u3zc5zt, 7 ckpts saved):
#     top_n step600: highest AUC top_n (0.9934, EER 0.0273)
#     periodic step2000: latest periodic anchor (0.9917)
#     periodic step1000: mid-trajectory periodic (0.9910)

