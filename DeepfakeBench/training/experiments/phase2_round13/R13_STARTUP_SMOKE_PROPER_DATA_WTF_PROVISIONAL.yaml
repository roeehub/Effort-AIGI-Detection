# ============================================================================
# R13_STARTUP_SMOKE_PROPER_DATA_WTF_PROVISIONAL
# Phase 2, Round 13 - provisional WT-F proper-data startup smoke
#
# Purpose:
#   Prove the new training-side proper-data lane loads honestly through the
#   normal launcher path, without folding the data into legacy VisoMaster or
#   weak-signal aliases.
#
# Scope:
#   - proper_data only
#   - provisional April 19 inventory + manifest artifacts
#   - tiny 2-step launcher smoke
# ============================================================================

name: "R13_STARTUP_SMOKE_PROPER_DATA_WTF_PROVISIONAL"
description: "2-step startup smoke — provisional WT-F proper-data training path"
seed: 737

wandb:
  tags: ["phase2-round13", "fine-tune", "smoke-test", "startup-smoke", "vit-b-16",
         "proper-data", "wt-f", "provisional", "seed-737"]

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true

learning_rate: 3.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 1
total_training_steps: 8
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 1

dataloader_strategy: combined_paired
frames_per_batch: 16
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: false

label_smoothing: 0.0
stability_lambda: 0.0

augmentation:
  version: "quality_targeted_family"
  strength: "light"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"

combined_paired:
  identity_balanced_sampling: true
  split_seed: 737
  seed: 737

  df40:
    enabled: false

  deeplive:
    enabled: false

  visomaster:
    enabled: false

  visomaster_hints:
    enabled: false

  visomaster_teams_enhanced:
    enabled: false

  visomaster_enhanced:
    enabled: false

  teams:
    enabled: false

  visomaster_hints_teams:
    enabled: false

  visomaster_res_variant:
    enabled: false

  proper_data:
    enabled: true
    inventory_path: "arena/inventories/proper_visomaster_wave_2026_04_19_provisional.yaml"
    manifest_path: "arena/manifests/proper_visomaster_target_domain_manifest_2026-04-19_provisional.json"
    include_lanes:
      - "proper_visomaster_clean"
      - "proper_visomaster_enhanced_clean"
      - "proper_visomaster_teams"
      - "proper_visomaster_enhanced_teams"
    max_samples_per_lane: 32
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  sampling:
    strategy: "identity_resample_uniform"

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 64

  ood_monitoring:
    enabled: false

use_arcface_head: true
arcface_m: 0.0
arcface_s: 6.0
s_start: 6.0
s_end: 12.0
anneal_steps: 8

evaluate_every_steps: 2
ood_monitoring_enabled: false
ood_monitoring_start_step: 2
ood_monitoring_every_steps: 2
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 1

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2r13_experiments/"
  save_every_steps: 2
  keep_last_n: 2
  ood_composite_enabled: false

max_train_steps: 2
