# =============================================================================
# Round 3 — R3_FT3: Fine-Tune R25_F1 with base_only aug + quality_enhancement data
# =============================================================================
# Purpose: Test whether the new quality_enhancement DeepLive strategy data
#   alone (without stronger augmentation) helps the model handle enhanced
#   fakes. This isolates the DATA contribution from the AUGMENTATION contribution.
# Theme: Stage A — data ablation
# Compare: R3_FT1 (moderate aug, same data) — augmentation vs data effect
#          R25_F1 (baseline, no quality_enhancement data) — data contribution
# Note: quality_enhancement strategy is auto-discovered from GCS (~300 samples).
#   Since R25_F1 was trained BEFORE quality_enhancement was uploaded, this run
#   has the same config as R25_F1 but benefits from the new data.
# =============================================================================

name: "R3_FT3_finetune_qe_data"
description: "Fine-tune R25_F1 with quality_enhancement data, base_only augmentation"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true

learning_rate: 5.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736  # Must match R25_F1 (k=32)
gradient_clip_val: 1.0

nEpochs: 10
total_training_steps: 20000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 500

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# Load R25_F1 winning checkpoint
load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r2_experiments/5w453our/top_n_effort_20260212_step18500_auc0.9893_eer0.0356.pth"

combined_paired:
  identity_balanced_sampling: true

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods: null

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    # quality_enhancement strategy auto-discovered — no filtering

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "Inswapper128"
    tiers: null

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05
  seed: 737

# ★ Same augmentation as R25_F1 — isolates data contribution
augmentation:
  version: "base_only"
  base:
    horizontal_flip: true
    color_augmentations: true
    quality_augmentations: true

use_arcface_head: true
arcface_m: 0.0
arcface_s: 10.0
s_start: 10.0
s_end: 18.0
anneal_steps: 30000

evaluate_every_steps: 500
test_batch_size: 32
seed: 737

early_stopping_enabled: true
early_stopping_patience: 8

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2r3_experiments/"

# W&B tags
# tags: phase2-round3, R3-FT3, fine-tune, quality-enhancement-data, base-only
