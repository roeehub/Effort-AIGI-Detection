# ============================================================================
# R13_T5A_CYCLIC_LAMBDA_2026-05-11.yaml
# T5-A: cyclic-λ multi-axis-L11-GRL, dense periodic saves.
#
# T4 RESULT (analysis/cpu_diagnostics_2026-05-10/outputs/L11_inv_mean_with_t4.csv):
# Encoder L11 inv_mean is movable but UNSTABLE — T4-λ1.0 saw the trajectory
#   step 5000:  0.0244  (below P8A baseline of 0.0266)
#   step 9000:  0.0219  (got worse)
#   step 10500: 0.0414  (broke 0.0349 ceiling — first EVER above the line)
#   step 11250: 0.0283  (dropped back near baseline within 750 steps)
# Train-eval AUC is monotonically rising in the same window (0.991 → 0.994).
# The encoder OSCILLATES between high-shortcut and low-shortcut attractors;
# the trainer saves by AUC top_n, so we caught step 10500 only by luck
# (it happened to also be an AUC peak).
#
# T5-A TESTS: does a CYCLIC λ schedule (re-applying pressure each time the
# encoder drifts back) (a) hold the encoder in the invariance attractor
# longer, (b) make the high-inv_mean states more frequent, or (c) just
# keep oscillating at higher amplitude?
#
# DESIGN:
#   - Init: P8A_REFERENCE_STEP5000 (same as T4 — T4 confirmed P8A's
#     features are GRL-responsive; T3's are not).
#   - Data lever: T3 SLOT1 keep-list + visomaster_enhanced + teams_enhanced
#     (same as T4 — preserve that discovery).
#   - GRL block: same 4 axes (chronic_flag, is_dor, sharpness_laplacian_high,
#     color_a_approx_dev_high), same k=128 bottleneck, attached at L11
#     pooled features (post-ln_post / post-proj CLS).
#   - λ SCHEDULE — the new lever:
#       multi_axis_grl.lambda_schedule: triangular_cyclic
#       lambda_max: 1.2  (slightly higher than T4-λ1.0's 1.0 — within the
#                         pre-test-1 validated [1.0, 2.0] window but well
#                         below T4-λ2.0's 2.0 which suppressed train-eval AUC)
#       lambda_warmup_steps: 500   (same as T4)
#       lambda_cycle_steps: 1500   (T4 oscillation period was ~1500-2000 steps
#                                   — cycle matches the natural drift timescale)
#   - DENSE PERIODIC SAVES: every 250 steps from 1000 → 12000. Catches
#     mid-cycle inv_mean states the trainer's AUC-driven top_n would miss.
#   - RELAXED EARLY STOP: patience=24 evals (vs T4's 12). Cycling will
#     LOOK LIKE no train-eval AUC improvement at the bottom of each cycle —
#     the trainer's val_primary metric is the wrong stop criterion for
#     this experiment. Selection happens offline by atlas inv_mean.
#
# COST: ~$65-75 Vertex (A100×1, ~5h training).
# CONFIDENCE: 50-60% we capture ≥1 ckpt with L11 inv_mean ≥ 0.045 (vs T4
#   capturing 0.0414 once at step 10500); 25-35% that captured ckpt scores
#   ≥60% on F4 viso recall.
# FALSIFICATION:
#   - inv_mean trace stays in [0.020, 0.035] across all 48 saves → cycling
#     pressure not the right shape → next iteration: try λ_max=1.5+ with
#     longer cycle period, OR L10+L11 dual attachment (T5-B).
#   - inv_mean spikes captured but no ckpt clears dor_lockbox FPR ≤5% →
#     atlas inv_mean doesn't translate to deployment-grade invariance →
#     pivot to localization aux loss.
# Seed: 9301
# ============================================================================

name: "R13_T5A_CYCLIC_LAMBDA_2026-05-11"
description: "T5-A — cyclic-λ multi-axis-L11-GRL + dense saves. Tests whether cycling pressure waves keep encoder in invariance attractor (T4 oscillation finding)."
seed: 9301

wandb:
  tags:
    - "phase2-round13"
    - "stage-a"
    - "t5-cyclic-lambda"
    - "encoder-invariance"
    - "ft-from-p8a"
    - "inherits-t3-slot1-data"
    - "inherits-t4-mechanism"
    - "dense-periodic-saves"
    - "no-pair-rank"
    - "no-group-dro"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "no-arcface"
    - "no-quality-domain-head"
    - "seed-9301"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 14
total_training_steps: 12000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 500

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r13_experiments/9lmvb5b4/value_composite_effort_20260424_step5000_auc0.9926_eer0.0270.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# ===== Multi-axis encoder-level GRL — TRIANGULAR CYCLIC (new for T5-A) =====
multi_axis_grl:
  enabled: true
  axes:
    - chronic_flag
    - is_dor
    - sharpness_laplacian_high
    - color_a_approx_dev_high
  lambda_max: 1.2
  lambda_warmup_steps: 500
  lambda_schedule: triangular_cyclic
  lambda_cycle_steps: 1500
  loss_weight: 1.0
  hidden_dim: 256
  bottleneck_dim: 128

# ===== All other levers identical to T4 mainline =====

pair_rank_loss:
  lambda: 0.0

use_group_dro: false

correlation_penalty:
  enabled: false

anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 9301
  seed: 9301

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    frame_keep_list_path: "analysis/cpu_diagnostics_2026-05-09/slot1_teams_real_keep_list_2026-05-09.csv"

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 9301
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 250
ood_monitoring_start_step: 250
ood_monitoring_every_steps: 500
test_batch_size: 32

# T5-A: relaxed early-stop. The cyclic-λ schedule will produce dips in
# train-eval AUC at the bottom of each cycle. patience=24 evals = 6000
# steps without improvement before stop. Selection happens offline by
# atlas inv_mean, not in-trainer by val_primary AUC.
early_stopping_enabled: true
early_stopping_patience: 24

# T5-A: DENSE saves to catch transient invariance states the AUC-driven
# top_n would miss. 48 ckpts across the cycling range = ~$0 marginal
# storage cost.
periodic_saves:
  enabled: true
  step_list:
    - 100
    - 250
    - 500
    - 750
    - 1000
    - 1250
    - 1500
    - 1750
    - 2000
    - 2250
    - 2500
    - 2750
    - 3000
    - 3250
    - 3500
    - 3750
    - 4000
    - 4250
    - 4500
    - 4750
    - 5000
    - 5500
    - 6000
    - 6500
    - 7000
    - 7500
    - 8000
    - 8500
    - 9000
    - 9500
    - 10000
    - 10500
    - 11000
    - 11500
    - 12000

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
