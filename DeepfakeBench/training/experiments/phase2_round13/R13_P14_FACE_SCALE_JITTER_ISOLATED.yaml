# ============================================================================
# R13_P14_FACE_SCALE_JITTER_ISOLATED.yaml
# Phase 2, Round 13 — FT-from-P8A + ISOLATED face_scale_jitter at scale_limit=0.50
#
# Direct attack on the face-pixel-area label leak (project_face_size_label_leak.md):
#   - lockbox per-method face-size r = -0.565 (real) / -0.529 (fake)
#   - 47-frame × 5-tightness sweep: 25/47 (53%) flipped predicted label across
#     t∈[0.7, 1.5]; FAIL regime sits in "FAKE valley" at native crop
#
# Single-variable sibling to R13_P14_FT_FROM_P8A. P14_FT bundles three
# anti-shortcut interventions (anchor_aware + pipeline_random + jitter@0.25);
# this run isolates jitter alone and tests whether stronger jitter (0.50 vs 0.25)
# is materially more effective on the face-size leak.
#
# Single deltas vs P14_FT:
#   - face_scale_jitter.scale_limit: 0.25 → 0.50  (2× stronger; matches the
#     [0.7, 1.5] tightness range that flipped 53% of frames in the leak audit)
#   - anchor_aware: enabled → disabled  (not the lever we are testing here)
#   - pipeline_randomization: enabled → disabled  (not the lever we are testing)
#
# What this run answers:
#   1. Is face-scale-jitter the LOAD-BEARING lever in the P14 bundle, or is the
#      lift mostly anchor_aware + pipeline_random?
#   2. Does a STRONGER jitter (0.50) beat 0.25 on the face-size leak gate
#      (Cohen's d on dev_fake vs dev_real, tightness-sweep flips)?
#   3. Does isolated jitter retain P8A's cross-domain priors (no anchor_aware
#      false-flag pressure, no pipeline_random distribution mixing)?
#
# Read against P14_FT_FROM_P8A (in flight): if isolated 0.50-jitter matches or
# beats P14_FT on the post-train face-size-leak re-tag (PLAN.md §8.5 close
# criterion), the P14 bundle is mostly jitter; if isolated jitter is materially
# weaker, the bundle's other levers are load-bearing.
#
# DO NOT LAUNCH without explicit user OK — this is a $70 / ~8h Vertex spend.
#
# Seed: 2273 (distinct from P14 seed 737 and P15 seed 1501)
# ============================================================================

name: "R13_P14_FACE_SCALE_JITTER_ISOLATED"
description: "FT-from-P8A_step5000 + face_scale_jitter scale_limit=0.50 ONLY (anchor_aware + pipeline_random disabled)"
seed: 2273

wandb:
  tags:
    - "phase2-round13"
    - "p14-jitter-isolated"
    - "face-scale-jitter-strong"
    - "scale-limit-0.50"
    - "fork-p8a"
    - "no-anchor-aware"
    - "no-pipeline-random"
    - "seed-2273"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 3.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 8
total_training_steps: 4000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 200

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# FT from P8A best ckpt (run 9lmvb5b4, step 5000, AUC 0.9926, EER 0.0270).
load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r13_experiments/9lmvb5b4/value_composite_effort_20260424_step5000_auc0.9926_eer0.0270.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# --- Anchor-aware: DISABLED (isolation test — not the lever under study). ---
anchor_aware:
  enabled: false
  weight: 5.0
  target_mean_prob: 0.10
  samples_per_step: 16
  pool_names:
    - "dor-real-webcam-false-flag-no-virtual-bg"

# --- Face scale-jitter: ENABLED at scale_limit=0.50 (2x P14_FT's 0.25). ---
# This is the only anti-shortcut lever active in this run.
face_scale_jitter:
  enabled: true
  scale_limit: 0.50

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  # --- Pipeline-randomization: DISABLED (isolation test). ---
  pipeline_randomization:
    enabled: false
    p_real: 0.55
    p_fake: 0.45
    jpeg_quality: [40, 95]
    downscale_range: [0.85, 1.0]
    chroma_blur_ksize: 3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 2273
  seed: 2273

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 2273
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: true
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 12.0
anneal_steps: 4000

evaluate_every_steps: 500
ood_monitoring_start_step: 500
ood_monitoring_every_steps: 1000
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 10

periodic_saves:
  enabled: true
  step_list:
    - 500
    - 1000
    - 1500
    - 2000
    - 2500
    - 3000
    - 3500
    - 4000

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2r13_experiments/"
  save_every_steps: 1000
  keep_last_n: 3
