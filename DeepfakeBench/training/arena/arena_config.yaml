# ── Data sources ──
# name: human label (becomes filename prefix)
# bucket: GCS bucket name
# layout: "poc" | "teams_flat" | "teams_paired" | "auto"
#   - poc:          {fake,real}/{Method_videoId}/NNNN.png
#   - teams_flat:   {fake,real}/flat_image_files.jpg
#   - teams_paired: samples/{strategy}/frames/{fake,real}/frame_NNNN.jpg
#   - auto:         let discovery heuristic decide
# chronological: true if frames are in rough chronological order (for stability analysis)
data_sources:
  teams_test:
    bucket: "teams-faces-data-test-2914-fake-4420-real-feb-28"
    layout: teams_flat
    chronological: true
    notes: "Teams target domain — ~3,464 fake (incl 550 visomaster_enhanced) + 5,982 real (updated Mar 15)"

  poc_phase1:
    bucket: "poc-phase-1-test"
    layout: poc
    chronological: true
    notes: "PoC test set with natural video grouping"

  teams_v2:
    bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams-v2"
    layout: teams_paired
    chronological: true
    notes: "Teams v2 paired samples — 4.7x larger than v1"

# ── Inference settings ──
inference:
  batch_size: 256
  num_workers: 12
  save_embeddings: true      # save backbone features for T-SNE / UMAP
  detector_config: "./config/detector/effort.yaml"
  train_config: "./config/defaults.yaml"

# ── Analysis settings ──
analysis:
  # Stability analysis (frame-to-frame consistency)
  stability:
    enabled: true
    # Only run on chronological data sources
    thresholds: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9]  # thresholds to compute flip rates at

  # Probability health metrics
  prob_health:
    enabled: true
    # Threshold healthiness: flag if optimal threshold is outside this range
    healthy_threshold_range: [0.25, 0.75]

  # Embedding visualization
  embeddings:
    enabled: true
    method: "tsne"           # "tsne" or "umap"
    perplexity: 30           # T-SNE perplexity
    max_samples: 5000        # subsample for speed
    save_plots: true

  # Per-method breakdown
  per_method:
    enabled: true
    # Target methods of special interest (face swaps in production)
    target_methods:
      - FaceSwap
      - inswap
      - mobileswap
      - simswap

# ── Strategy search settings ──
strategy:
  enabled: true
  window_sizes: [16, 24, 32]
  # Threshold search range
  threshold_range: [0.20, 0.95]
  threshold_step: 0.01
  # K/W ratio range
  k_ratio_range: [0.30, 0.80]
  k_ratio_step: 0.02
  # Constraints
  max_teams_fpr: 0.0         # hard constraint: 0 Teams false positives
  # Health check: flag strategies with threshold outside this range
  healthy_threshold_range: [0.15, 0.85]
  # Uncertain zone
  uncertain_margins: [0, 1, 2, 3]
