# ============================================================================
# R13_SLOT1_HEAD_RETRAIN_2026-05-13.yaml
# Head-only retrain on Slot 1's frozen LoRA-P8A encoder.
#
# WHAT THIS PACKET TESTS
# ----------------------
# Slot 1 (W&B run `gf6l06rf`, LoRA-on-P8A step2000) is the strongest non-P8A
# encoder ever measured in the program:
#   - Atlas chronic_6 inv_mean Δ vs P8A: −0.0026 (essentially flat — preserved
#     P8A's substrate invariance)
#   - Atlas chronic_6 forgery AUC: 0.9950 (UP from P8A's 0.9915)
#   - may6 fired-frame count: 5/92 (vs P8A 0/92, vs E2B 53/92)
#   - Spearman r vs P8A on may6 per-frame scores: 0.97 (rank order preserved)
#   - Mean per-frame delta vs P8A on may6: +0.21 (uniform-ish additive shift)
#
# BUT the partial scorecard shows Slot 1's lb_real_fpr = 0.39 (21× P8A's
# 0.0184). The dev-calibrated τ doesn't compensate the additive shift on
# lockbox-substrate — the shift may be asymmetric per substrate. The fix:
# retrain only the classifier head with the encoder (CLIP + SVD residuals +
# LoRA adapters) frozen.
#
# Hypothesis (one sentence):
#   Slot 1's encoder is producing the right latent representation for
#   substrate-invariance + chronic_6 forgery separation; the *head* is
#   misreading it on lockbox-substrate. A fresh head trained from the same
#   encoder should fix the asymmetric shift.
#
# Falsifier: if the head-only retrain reproduces Slot 1's lockbox FPR
# (≥ 0.30), the asymmetric shift is encoded in the encoder representation,
# not the head's decision boundary — pivot to Option B (substrate-diverse
# training data) or to a different encoder.
#
# Success criteria (deployment-grade, mirrors LORA packet):
#   - lockbox_real_fpr at FPR-cal τ ≤ 0.05 (vs Slot 1's 0.39)
#   - lockbox_fake_recall at FPR-cal τ ≥ 0.50
#   - dev_fake_macro_recall ≥ 0.40
#   - no per-identity FPR > 30% on the chronic-6 set
#
# DATA OPTION CHOSEN: A — Slot 1's existing data pool (T3 SLOT1 keep-list,
# combined_paired, all data sources inherited unchanged from Slot 1).
# Reasoning: cheapest first cut; tests whether head-retrain alone fixes the
# asymmetric shift without introducing a new variable. If the lockbox FPR
# remains high (>0.10) under Option A, the next packet pivots to Option B
# (substrate-diverse mix including HDTF / QCLIPS / unused teams-v2 sub-buckets).
#
# CODE PATH
# ---------
# Triggered by `head_only_retrain.enabled: true` block; train_sweep.py:
#   1. Builds the model with SVD residuals (as Slot 1).
#   2. PRE-INSTALLS LoRA modules BEFORE checkpoint load (so the ckpt's
#      `lora_A.weight` / `lora_B.weight` keys populate correctly via
#      strict=False; verified Slot 1's step2000 ckpt has 16 LoRA keys with
#      non-zero lora_B values).
#   3. Loads Slot 1's checkpoint (state_dict includes trained LoRA weights
#      + the prior head; both are loaded).
#   4. Re-initialises the head (`nn.Linear(512, 2)` Kaiming uniform) — the
#      prior head's substrate-asymmetric boundary is discarded.
#   5. Freezes everything except `head.weight` / `head.bias`.
#   6. Rebuilds the optimizer with only the head params (~1026 trainable
#      out of ~91M total → ~0.001% trainable fraction).
#
# COST: ~$3-8 Vertex (us-east1, A100×1, 2000 steps; head retrain is fast
# because <2K trainable params + standard forward pass).
# CONFIDENCE: 40-60% the head-retrain closes >50% of the dev↔lockbox gap;
# the alternative (Option B) is still on the table if this lever fails.
# Seed: 9802 (NOT taken by T5C/T6/T7/LORA-9801).
# ============================================================================

name: "R13_SLOT1_HEAD_RETRAIN_2026-05-13"
description: "Head-only retrain on Slot 1's frozen LoRA-P8A encoder. Encoder = P8A + SVD residuals + Slot 1's trained LoRA A/B at resblocks 10-11 (all frozen). Trainable surface = nn.Linear(512, 2) only. Tests whether Slot 1's lockbox FPR=0.39 is a head-decision-boundary issue (correctable here) vs an encoder-representation issue (would survive this retrain)."
seed: 9802

wandb:
  tags:
    - "phase2-round13"
    - "head-only-retrain"
    - "ft-from-slot1"
    - "lora-l10-l11-frozen"
    - "frozen-encoder"
    - "frozen-lora"
    - "inherits-t3-slot1-data"
    - "no-multi-axis-grl"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "no-arcface"
    - "seed-9802"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  # SVD stays ON to match Slot 1's training config (P8A's training config).
  # The head_only_retrain freeze sweep will freeze every SVD residual along
  # with everything else.
  apply_svd_to_in_proj: true
  apply_svd_to_mlp: true
  unfreeze_final_proj: false
  unfreeze_final_ln: false

# Head LR = 1.0e-4 (10× higher than Slot 1's 1e-5 — appropriate for a
# from-init head re-initialised via Kaiming uniform). LoRA LR is irrelevant
# here because the LoRA params are frozen (lora_lr_mult is read but the LoRA
# group is empty post-freeze).
learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8

optimizer:
  type: "adam"
  adam:
    lr: 1.0e-4
    eps: 1.0e-8
    weight_decay: 0.05
    # lora_lr_mult left at 1.0 — LoRA params are frozen by head_only_retrain
    # so this multiplier never gates an active optimizer step.
    lora_lr_mult: 1.0

lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 6
total_training_steps: 2000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 200

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# === KEY: load Slot 1's checkpoint (LoRA-trained, step2000) ===
load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/best_checkpoints/gf6l06rf/top_n_effort_20260513_step2000_auc0.9929_eer0.0229.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# === HEAD-ONLY RETRAIN config (NEW for this packet) ===
# Read by train_sweep.py to (a) pre-install LoRA BEFORE ckpt load so the
# trained lora_A/lora_B weights populate, (b) freeze every non-head param
# post-load, (c) re-initialise the head, (d) rebuild the optimizer.
# See train_sweep.py block guarded by `_head_only_enabled`.
head_only_retrain:
  enabled: true
  reinit_head: true
  # Default selector substrings target `head.weight` / `head.bias` (nn.Linear).
  # Override here only if you change the head architecture (ArcFace etc.).
  trainable_param_substrings:
    - "head.weight"
    - "head.bias"

# === LoRA config (matches Slot 1 exactly — modules get pre-installed via
# head_only_retrain block; freeze_base will then freeze the LoRA A/B too) ===
lora:
  enabled: true
  target_layers: [10, 11]
  rank: 16
  alpha: 32
  target_modules: ["attn.in_proj", "attn.out_proj", "mlp.c_fc", "mlp.c_proj"]
  freeze_base: true

# === Disabled levers ===

multi_axis_grl:
  enabled: false

pair_rank_loss:
  lambda: 0.0

use_group_dro: false

correlation_penalty:
  enabled: false

anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: false

# === Augmentation (inherited unchanged from Slot 1 / T5C / T3 SLOT1) ===
augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

# Canary probe — in-training deployment-quality monitor (per spec §3.4).
canary_probe:
  enabled: true
  parquet_path: "arena/canaries/teams_chronic_diverse_800_2026-05-07.parquet"
  frequency_steps: 500
  max_frames: 1000
  batch_size: 64

# === Data (T3 SLOT1 keep-list lever, inherited unchanged from Slot 1) ===
combined_paired:
  identity_balanced_sampling: true
  split_seed: 9802
  seed: 9802

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    # T3 SLOT1 keep-list (drop top-25% lap_var Teams reals). Held fixed —
    # this is the data lever that produced the first lockbox lift over P8A
    # (memory: project_t3_slot1_step1500_lockbox_lift_2026-05-09).
    frame_keep_list_path: "analysis/cpu_diagnostics_2026-05-09/slot1_teams_real_keep_list_2026-05-09.csv"

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 9802
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 250
ood_monitoring_start_step: 250
ood_monitoring_every_steps: 500
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 12

# Periodic ckpt saves every 250 steps (short total training; we want fine
# trajectory resolution to pick the right operating point).
periodic_saves:
  enabled: true
  step_list:
    - 100
    - 250
    - 500
    - 750
    - 1000
    - 1250
    - 1500
    - 1750
    - 2000

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
