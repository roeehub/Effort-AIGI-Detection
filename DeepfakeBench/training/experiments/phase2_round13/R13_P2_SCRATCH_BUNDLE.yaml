# ============================================================================
# R13_P2_SCRATCH_BUNDLE.yaml
# Phase 2, Round 13 — Packet P2 (PREVENT_NOT_UNLEARN), Slot A: bundle.
#
#   FROM-SCRATCH (CLIP-B16 init, no FT base) +
#   correlation_penalty (4 axes: sharpness, luma, face_area, color_b_dev) +
#   pair_rank_loss +
#   face_scale_jitter@0.50 baseline
#
# WHY THIS PACKET (the user's pet peeve, made explicit):
#   Through R13 Packets P8A → P15 → PA/PC/PD → P1 we accumulated 5 layers of
#   FT-from-FT chains. Today's CPU jobs (analysis/p1_pe_eval_2026-05-07/) made
#   the case empirical:
#     * Job 7 (PD vs P1 head-to-head at calibrated τ): NEITHER FT-child
#       strictly dominates its base. PD-deeplive_corr lifts dev_macro by
#       +0.149 over E2B but breaks dor invariance (5/6 ckpts dor_FPR ≥ 0.46).
#       P1-BUNDLE breaks deeplive_enhanced recall to 0.000 at calibrated τ.
#     * Job 5 (joint τ-sweep on P1): F1 ∩ F4 ∩ F5 overlap region is EMPTY for
#       BUNDLE_step500 — Roy_D real frames sit in the same score band as
#       lockbox fakes; no monotone τ-cut separates them. Calibration-shifting
#       hypothesis is REFUTED — the fix has to be representational.
#     * Probe 7 (`project_per_layer_divergence_2026-05-06`): shortcut signal
#       at AUC=1.000 at every encoder layer including patch-embed (layer 0).
#       FT cannot fix what's at layer 0. Only training the patch embedder
#       from start under shortcut-prevention can.
#
# THE HYPOTHESIS: shortcuts can be PREVENTED from being acquired in the first
# place if every batch is penalized for correlating with named pixel axes
# AND if pair_rank pushes paired (real, fake) scores apart. From-scratch is
# the only setting where "punishment-from-step-0" is actually the right
# name — FT-from-FT inherits whatever the parent learned.
#
# WHAT'S NEW VS PRIOR ROUND EVIDENCE:
#   - 4-axis correlation_penalty (PD ran 3 axes: sharp/luma/face_area). Added
#     `color_b_dev` to target the SHIFTED-shortcut path PD's frozen-head
#     prototype revealed (memory project_dor_drift_named_axes_2026-05-06
#     attributes 27-38% of named-axis drift to color_b_dev) AND the Roy_D
#     P1 regression mechanism (Δr=+0.71 mirror; analysis/p1_pe_eval_2026-05-07/
#     roy_d_regression/ROY_D_REGRESSION_FACTS_2026-05-07.md).
#   - From-scratch + bundle is novel — PD ran corr_penalty FT-from-E2B; P1
#     ran pair_rank FT-from-P8A; nothing has run them together from CLIP init.
#   - Quality-enhancement routing fix (memory project_quality_enhancement_
#     routing_2026-05-05) — every prior R13 packet trained on contaminated
#     data; this is the first packet under the corrected routing.
#   - Canary probe (NEW infrastructure 2026-05-07): 800-frame fixed canary
#     forward-passed every 1000 steps logs deployment-relevant scalars
#     (per-chronic-identity FPR, FPR-calibrated lockbox recall, score
#     distribution shape, Wilcoxon vs P8A reference). Catches Roy_D-style
#     regressions BEFORE they bake in. Memory project_train_auc_not_valid_
#     promotion_signal motivates this directly.
#
# WHAT WE'RE NOT DOING:
#   - GroupDRO: Wilcoxon p=0.875 (P1 counter-theory probe) — non-additive
#     over pair_rank for non-target collateral. Wasted regularization budget.
#   - anchor_aware: P14 evidence — bundle 0.116 vs single-lever 0.661.
#   - Data-axis lever: project_data_axis_lever_pulled_twice_no_lift refuted
#     twice on FT-from-P8A and FT-from-E2B paths.
#   - Codec aug: project_pc_codec_aug_hurts_viso_2026-05-05 (-50pp on viso F4).
#   - is_webcam axis: feedback_per_mode_tau_not_deployable — Teams doesn't
#     surface capture_mode at inference; non-deployable leak.
#
# Pre-registered close criterion (4/4):
#   F1 — lockbox fake recall ≥ 90% at FPR ≤ 10%.
#   F2 — pair-ranking metric: ≥30% relative lift on previously-missed-fake
#        pair gaps on ≥2 of N evaluable suites under the Phase-A-evaluable
#        form (analysis/p1_pe_eval_2026-05-07/f2_pair_rank/F2_PHASE_A_
#        EVALUABLE_FACTS_2026-05-07.md).
#   F3 — no untargeted axis amplifies +50% (face_area, min_dim, etc.) on
#        the F3 audit harness post-train.
#   F4 — HDTF cross-substrate FPR ≤ 5% (Phase C).
#   F5 — pc_generator + Q + bla_bla_chow + Roy_D mean prob_fake on real
#        frames: each identity ≤ 0.30 at the F1-passing τ. (NEW: Roy_D added
#        as the binding constraint per analysis/p1_pe_eval_2026-05-07/
#        joint_tau_sweep_2026-05-07/.)
#
# Cost: ~$60-80 Vertex (us-east1, 10-12h, 8000 steps, scratch regime).
# Seed: 5301.
# ============================================================================

name: "R13_P2_SCRATCH_BUNDLE"
description: "P2 Slot A — from-scratch + 4-axis corr_penalty + pair_rank + face_scale_jitter@0.50. Tests prevention-not-unlearning on CLIP-B16 from step 0."
seed: 5301

wandb:
  tags:
    - "phase2-round13"
    - "p2-scratch-bundle"
    - "from-scratch"
    - "prevent-not-unlearn"
    - "correlation-penalty-4axis"
    - "pair-rank-loss"
    - "face-scale-jitter-050"
    - "canary-probe-enabled"
    - "post-quality-enhancement-fix"
    - "post-2feea58-codepath"
    - "no-group-dro"
    - "no-anchor-aware"
    - "no-arcface"
    - "cross-entropy-loss"
    - "seed-5301"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

# Scratch hyperparams from E2b precedent (R13_E2b_SCRATCH_B16_NO_ARCFACE.yaml).
# LR 2e-4 + 1000-step warmup + 8000 total steps + 16 epochs = scratch-appropriate.
# FT-LR (3e-5) would not converge from scratch.
learning_rate: 2.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 16
total_training_steps: 8000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 1000

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# THE LEVER: scratch from raw CLIP, NOT FT from any prior R13 ckpt.
load_base_checkpoint: false

label_smoothing: 0.0
stability_lambda: 0.0

# Correlation-penalty (4 axes): sharpness, luma, face_area, color_b_dev.
# `color_b_dev` is NEW — Roy_D-mechanism-targeting (P1 finding, 2026-05-07).
correlation_penalty:
  enabled: true
  lambda: 1.0
  axes:
    - sharpness_laplacian
    - luma_mean
    - face_area_fraction
    - color_b_dev

# Pair-rank loss: same hyperparams as P1 (validated F4 + F5 PASS BIG on FT;
# now testing whether scratch+pair_rank can avoid the Roy_D regression
# observed on FT-from-P8A by combining with corr_penalty's color_b_dev axis).
pair_rank_loss:
  lambda: 0.2
  margin: 0.5

# Anti-shortcut levers explicitly disabled (per anti_shortcut_bundle_decomposition
# discipline — single-lever ablations live in Slots B and C').
anchor_aware:
  enabled: false

# face_scale_jitter@0.50 — baseline anti-shortcut aug (P14 winner on trainer
# composite; project_face_scale_jitter_load_bearing). Same scale_limit on
# all 3 P2 slots so the comparison isolates loss-level vs aug-level.
face_scale_jitter:
  enabled: true
  scale_limit: 0.50

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

# Canary probe — in-training deployment-quality monitor. NEW 2026-05-07.
# Reads 800 fixed canary frames + P8A reference scores, fires every 1000 steps,
# logs deployment-relevant scalars to W&B. Bulletproof — never crashes training.
canary_probe:
  enabled: true
  parquet_path: "arena/canaries/teams_chronic_diverse_800_2026-05-07.parquet"
  frequency_steps: 1000
  max_frames: 1000
  batch_size: 64

combined_paired:
  identity_balanced_sampling: true
  split_seed: 5301
  identity_split_mode: "hash_stable"
  seed: 5301
  bad_data_policy_manifest: "policy/visomaster_bad_data/VISOMASTER_BAD_DATA_POLICY_MANIFEST_2026-04-17.csv"
  bad_data_policy_summary: "policy/visomaster_bad_data/VISOMASTER_BAD_DATA_POLICY_SUMMARY_2026-04-17.json"

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  # bad data per memory project_visomaster_hints_lanes_bad_data — NEVER train.
  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 5301
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 500
ood_monitoring_start_step: 500
ood_monitoring_every_steps: 1000
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 12

# Periodic saves at canary cadence — each saved ckpt has a corresponding
# canary readout in W&B. Lets us pull whichever ckpt the canary called best.
periodic_saves:
  enabled: true
  step_list:
    - 500
    - 1000
    - 2000
    - 3000
    - 4000
    - 5000
    - 6000
    - 7000
    - 8000

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
