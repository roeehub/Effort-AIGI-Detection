# ============================================================================
# R13_E2_SCRATCH_B16_EVAL_AUG.yaml
# Phase 2, Round 13 — B16 SCRATCH from CLIP + E1's eval-targeted aug curriculum.
#
# Forks: R13_E1_EVAL_TARGETED_AUG (this packet's aug curriculum reference)
#        + R13_P13_FROM_SCRATCH (scratch hyperparam reference).
#
# Single lever vs E1: load_base_checkpoint=false (scratch from raw CLIP-B16
# instead of FT from P8A_step5000). All aug + sampling identical to E1.
#
# Why (cite: analysis/clip_vs_p8a_viso_2026-05-03/FINDINGS.md, Stream B):
#   Stream B (2026-05-03) ran a frozen-feature linear probe on viso eval frames
#   for raw CLIP-B16 vs P8A. Both saturate at AUC=1.0 with default classifier
#   hyperparameters. Under classifier-capacity stress (small C, small n_train),
#   raw CLIP outperforms P8A by 9-17pp:
#     - C=1e-4: CLIP 0.9988 vs P8A 0.8259 (+17.3pp)
#     - C=1e-3: CLIP 1.0000 vs P8A 0.9261 (+7.4pp)
#     - n=16:   CLIP 0.9976 vs P8A 0.9117 (+8.6pp)
#   Three non-exclusive interpretations all license scratch retry:
#     (1) Effort orthogonal-regularization spread weight too thinly across axes
#     (2) P8A FT'd toward teams-domain axis, weakly correlated with viso
#     (3) 5-stage FT ossification (CLIP→R12g→RLP6_04→RLP7_02→P8A) narrowed
#         the activation manifold, with viso discriminability as collateral damage
#   Stream A also relevant: P8A's L0–L4 in_proj-SVD residuals are noise-dominated
#   (in_proj-SVD gradient bug pre-2026-04-26 fix). Scratch starts from a fresh
#   init that doesn't carry that legacy.
#
# What P13 from-scratch was MISSING that E2 has:
#   - The post-2026-04-26 in_proj-SVD gradient fix (commit 2feea58) — every
#     SVD layer now actually trains
#   - The P22-class blur+brightness aug curriculum (none of P13's interventions
#     addressed sharpness)
#   - E1's stronger eval-targeted aug parameters (Stream C — laplacian gap)
#   - WITHOUT the anti-shortcut bundle (anchor_aware + face_scale_jitter) —
#     P13's bundle was the lever found to HURT vs single-lever
#
# Single-lever discipline:
#   - anchor_aware                 DISABLED (P14 lever, ruled out)
#   - face_scale_jitter            DISABLED (mclioexb FAILED contract solo)
#   - GRL                          DISABLED (P15/P18 lever, ruled out)
#   - data-axis source weights     UNCHANGED from E1
#   - aug curriculum               IDENTICAL to E1 (eval-targeted blur/brightness)
#   - load_base_checkpoint         FALSE (THE LEVER — scratch from CLIP)
#   - LR + warmup + total_steps    Scratch-appropriate (LR 2e-4, warmup 1000,
#                                  8000 steps; matches L14_ablation winner pattern,
#                                  scaled for B16). NOT a separate lever — these
#                                  are the necessary hyperparam adaptations for
#                                  scratch (FT-LR=3e-5 would not converge from scratch).
#
# Pre-registered falsifiers (CPU post-training; run on best-by-class_sep ckpt):
#   F-E2-A: Best ckpt val AUC ≥ 0.97 (verifies model trained at all from scratch)
#   F-E2-B: Viso recall at joint dev+lockbox FPR=10% > 35% (P8A 27%, P22 24.9%)
#   F-E2-C: Lockbox dor_dev FPR ≤ 10% at calibrated τ (preserve dor invariance,
#           even though scratch starts without P8A's specific dor invariance)
#   F-E2-D: teams_real_all_dev FPR at the same τ ≤ 10% (basic real-side sanity;
#           P13 from-scratch failed this with modern_v2 FPR=30%)
#   3-4/4 → E2 succeeded; PROMOTE as new B16 base. 0-2/4 → scratch+aug NOT enough,
#   architecture (E3 / L14) becomes the next lever.
#
# Cost: ~$30-45 Vertex (1 day us-east1 A100; scratch 8000 steps).
# Region: us-east1 (E1 takes us-west4; parallelize across regions).
#
# Seed: 3002 (distinct from E1=3001).
# ============================================================================

name: "R13_E2_SCRATCH_B16_EVAL_AUG"
description: "B16 SCRATCH from CLIP + E1's eval-targeted aug curriculum (blur σ∈[2,8], brightness asym, jpeg q∈[30,90]). Stream B evidence: raw CLIP beats P8A by 9-17pp under classifier stress on viso. Single lever vs E1: scratch instead of FT-from-P8A."
seed: 3002

wandb:
  tags:
    - "phase2-round13"
    - "e2"
    - "scratch-from-clip"
    - "stream-b-evidence"
    - "eval-targeted-aug"
    - "post-apr26-fixes"
    - "no-anti-shortcut-bundle"
    - "single-lever"
    - "no-grl"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "seed-3002"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

# Scratch hyperparameters (per L14_ablation winner pattern, scaled for B16):
learning_rate: 2.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 16
total_training_steps: 8000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 1000

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# THE LEVER: scratch from raw CLIP, NOT FT from P8A.
load_base_checkpoint: false

label_smoothing: 0.0
stability_lambda: 0.0

# --- Anchor-aware: DISABLED (P14 lever, ruled out as net-negative). ---
anchor_aware:
  enabled: false
  weight: 5.0
  target_mean_prob: 0.10
  samples_per_step: 16
  pool_names:
    - "dor-real-webcam-false-flag-no-virtual-bg"

# --- Face scale-jitter: DISABLED (mclioexb FAILED contract solo). ---
face_scale_jitter:
  enabled: false
  scale_limit: 0.50

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  # --- Pipeline-randomization: IDENTICAL to E1 (eval-targeted, heavier than P22). ---
  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 3002
  seed: 3002

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 3002
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

# ArcFace schedule for scratch (more conservative than P13's s=18; cap at 12
# to avoid the "ArcFace s ≥ 10 + heavy aug = collapse" pattern observed in S1/S2/S3).
use_arcface_head: true
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 12.0
anneal_steps: 4000

evaluate_every_steps: 200
ood_monitoring_start_step: 200
ood_monitoring_every_steps: 400
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 10

periodic_saves:
  enabled: true
  step_list:
    - 200
    - 500
    - 1000
    - 1500
    - 2000
    - 2500
    - 3000
    - 4000
    - 5000
    - 6000
    - 7000
    - 8000

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
