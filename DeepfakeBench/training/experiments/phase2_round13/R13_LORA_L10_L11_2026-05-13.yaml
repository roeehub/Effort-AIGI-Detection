# ============================================================================
# R13_LORA_L10_L11_2026-05-13.yaml
# Parameter-efficient FT: LoRA on resblocks 10 and 11 only, frozen base.
#
# WHAT THIS PACKET TESTS
# ----------------------
# Stage 2 (2026-05-09) found every FT-from-P8A regime tested drifts the
# dor cluster within 500-2500 steps (memory:
# project_stage2_all_levers_regress_p8a_2026-05-09). LoRA is structurally
# distinct: the base encoder weights are frozen by construction, so any
# behavioral change must be expressible as a low-rank delta at the chosen
# layers — it cannot drift the bulk of the encoder.
#
# Layer choice: per memory project_per_layer_divergence_2026-05-06, the
# behavioural divergence between P8A and E2B (and by extension between
# P8A and any FT'd descendant) is concentrated at resblocks 10-11; layers
# 0-9 are largely shared. Adapting only layers 10-11 trains the specific
# region where ckpt-behaviour differentiates.
#
# Hypothesis (one sentence):
#   Training a low-rank delta on resblocks[10] and resblocks[11] of P8A
#   (everything else frozen) + the existing head produces a ckpt with
#   T5C-step3500-class catch AND P8A-class chronic-cohort invariance.
#
# Falsifier: if this regime reproduces the Stage-2 dor-cluster regression
# (Roy_D real-FPR at FPR-cal τ > 70%), the binding constraint is the
# data/objective, NOT the FT regime — pivot to data ingestion.
#
# Success criteria (deployment-grade):
#   - lockbox_real_fpr at FPR-cal τ ≤ 0.025 (≈ T5C step3500 0.0240)
#   - lockbox_fake_recall at FPR-cal τ ≥ 0.50 (≈ T5C step3500)
#   - dev_fake_macro_recall ≥ 0.40
#   - no per-identity FPR > 30% on the chronic-6 set
#
# RESOLVED ARCHITECTURAL DECISIONS (see LORA_LAYERS_10_11_TASK §9b)
# -----------------------------------------------------------------
# D1. LoRA stacks ON TOP of frozen SVD. apply_svd_to_in_proj / _to_mlp stay
#     TRUE (matching P8A_step5000's training config); freeze_base_clip_encoder
#     freezes all SVD residuals at all 12 layers. LoRA A/B at layers 10-11
#     are the only trainable encoder parameters. P8A's checkpoint loads
#     cleanly because the SVD architecture is preserved.
# D2. New `lora` param group in choose_optimizer with weight_decay=0.0 and
#     LR = base_lr × lora_lr_mult. learning_rate (head LR) = 1e-5;
#     lora_lr_mult = 10.0 -> LoRA LR = 1e-4.
# D3. Multi-axis GRL DISABLED to isolate the LoRA mechanism.
# D4. anchor_aware DISABLED.
# D5. T3 keep-list data filter KEPT (axis-level, orthogonal to LoRA).
#
# COST: ~$30-40 Vertex (us-east1 or us-west4, A100×1, ~5000 steps; LoRA is
# fast because few trainable params).
# CONFIDENCE: 30-45% any single ckpt promotes; the mechanism-vs-binding-
# constraint question is load-bearing either way (a clean refutation pivots
# us to data ingestion; a SUPPORT lifts the FT-regime ceiling).
# Seed: 9801 (NOT taken by T5C/T6/T7).
# ============================================================================

name: "R13_LORA_L10_L11_2026-05-13"
description: "Parameter-efficient FT — LoRA (rank=16, alpha=32) on resblocks 10 & 11, frozen P8A base. Tests whether the Stage-2 dor-cluster regression is intrinsic to any FT regime, or specific to full-encoder FT. Single-lever delta vs head-only retrain (which already failed): adds rank-16 trainable delta at the two layers where P8A and E2B encoders diverge most."
seed: 9801

wandb:
  tags:
    - "phase2-round13"
    - "lora"
    - "lora-l10-l11"
    - "frozen-base"
    - "rank-16-alpha-32"
    - "ft-from-p8a"
    - "inherits-t3-slot1-data"
    - "no-multi-axis-grl"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "no-arcface"
    - "seed-9801"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  # SVD stays ON (matches P8A_step5000's training config) — freeze_base_clip_encoder
  # below will freeze all SVD residuals so LoRA is the only trainable encoder
  # delta. See LORA_LAYERS_10_11_TASK_2026-05-12.md §9b D1.
  apply_svd_to_in_proj: true
  apply_svd_to_mlp: true
  # These would be no-ops anyway under freeze_base=true (the LoRA freeze
  # sweeps everything except lora_A / lora_B), but set to false for
  # explicit config clarity.
  unfreeze_final_proj: false
  unfreeze_final_ln: false

# Top-level optimizer params (read by apply_wandb_optimizer_params).
# Head LR = 1.0e-5. LoRA LR is set by lora_lr_mult in the nested block.
learning_rate: 1.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8

# Nested optimizer block — surfaces lora_lr_mult to choose_optimizer.
# LoRA LR = learning_rate × lora_lr_mult = 1e-5 × 10 = 1e-4. See
# utils/setup.py choose_optimizer (the `lora` param group, added 2026-05-12).
optimizer:
  type: "adam"
  adam:
    lr: 1.0e-5
    eps: 1.0e-8
    weight_decay: 0.05
    lora_lr_mult: 10.0

lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 14
total_training_steps: 5000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 500

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r13_experiments/9lmvb5b4/value_composite_effort_20260424_step5000_auc0.9926_eer0.0270.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# ===== LoRA: low-rank adapter at resblocks 10 and 11 (NEW for this packet) =====
# Read by train_sweep.py after checkpoint load; wraps the named linears
# inside resblocks[10] and resblocks[11], freezes everything else under
# the visual encoder, rebuilds the optimizer with a `lora` param group.
# See detectors/lora_adapter.py for the wrapper implementation and
# tests/test_lora_adapter.py for the unit tests.
lora:
  enabled: true
  target_layers: [10, 11]
  rank: 16
  alpha: 32
  target_modules: ["attn.in_proj", "attn.out_proj", "mlp.c_fc", "mlp.c_proj"]
  freeze_base: true

# ===== Disabled levers (isolation of the LoRA mechanism) =====

multi_axis_grl:
  enabled: false

pair_rank_loss:
  lambda: 0.0

use_group_dro: false

correlation_penalty:
  enabled: false

anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: false

# ===== Augmentation (inherited from T5C / T3 SLOT1) =====

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

# Canary probe — in-training deployment-quality monitor (per spec §3.4).
canary_probe:
  enabled: true
  parquet_path: "arena/canaries/teams_chronic_diverse_800_2026-05-07.parquet"
  frequency_steps: 1000
  max_frames: 1000
  batch_size: 64

# ===== Data (T3 SLOT1 keep-list lever, inherited unchanged from T5C) =====

combined_paired:
  identity_balanced_sampling: true
  split_seed: 9801
  seed: 9801

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    # T3 SLOT1 keep-list (drop top-25% lap_var Teams reals). Held fixed —
    # this is the data lever that produced the first lockbox lift over P8A.
    frame_keep_list_path: "analysis/cpu_diagnostics_2026-05-09/slot1_teams_real_keep_list_2026-05-09.csv"

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
