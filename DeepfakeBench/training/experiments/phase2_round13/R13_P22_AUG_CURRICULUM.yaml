# ============================================================================
# R13_P22_AUG_CURRICULUM.yaml
# Phase 2, Round 13 — FT-from-P8A + train-time blur/brightness/JPEG curriculum
#                     to close the train-eval image-quality gap.
#
# Hypothesis (cite: analysis/cpu_decision_2026-05-02_pm_late/FINDINGS_AND_DECISION.md):
#   The model has learned a {sharpness, luminance, skin_frac} shortcut.
#   - 3-attr LR achieves AUC 0.882 (sharpness alone 0.910); P8A score AUC 0.843
#   - 94-100% of missed fakes at deployment τ are attributable to ≥1 shortcut
#   - Eval data is 4-25× LESS SHARP than training (lockbox p50 Laplacian = 10
#     vs training p50 = 164)
#
# Mechanism (CPU-validated 2026-05-02 PM late):
#   With Gaussian blur σ ∈ [0, 3] + JPEG q ∈ [50, 95] applied to BOTH labels
#   symmetrically, post-aug median Laplacian on training frames lands at 6-26
#   (overlapping eval) — the augmentation closes the distribution gap.
#   See analysis/cpu_decision_2026-05-02_pm_late/figures/p22_aug_lap_distribution.png.
#
# Single-lever discipline (per AGENT_GUIDE Rule 1):
#   - anchor_aware                 DISABLED  (P14 lever, separate test)
#   - face_scale_jitter            DISABLED  (P14 lever, separate test)
#   - GRL                          DISABLED  (P15/P18 lever, ruled out)
#   - data-axis source weights     UNCHANGED (P14_DATA_FIX/P16 ruled out)
#   - pipeline_randomization       ENABLED   (THIS is the lever — symmetric
#                                              labels, eval-distribution-matched
#                                              blur+jpeg+brightness)
#
# Falsifiers (post-training, all CPU on the resulting checkpoint):
#   1. Pearson r(score, laplacian_var) on dev viso drops by ≥ 0.15 magnitude
#   2. Standalone-shortcut LR AUC on the post-trained model drops 0.882 → ≤ 0.78
#   3. Viso recall at FPR=2% rises 0.5% → ≥ 3%
#   2/3 → P22 succeeded. 0/3 → P22 didn't bite. 1/3 → ambiguous.
#
# Trade-off (per user ask "lower training AUC, higher robustness"):
#   We expect training AUC to drop slightly because some training-fake samples
#   now look closer to training-real samples on attrs the model used to lean on.
#   That's the point. Promote on contract scorecard, not on val AUC.
#
# Cost: ~$30-45 Vertex (1 day us-west4 A100; FT 8000 steps from P8A_step5000).
# Region preference per CLAUDE.md: us-west4 → us-east1 → us-central1.
#
# Seed: 2226 (distinct from P14=737/2273, P15=1501, P16, P17, P18)
# ============================================================================

name: "R13_P22_AUG_CURRICULUM"
description: "FT-from-P8A_step5000 + symmetric train-time blur/JPEG/brightness curriculum matching eval distribution. Targets the image-quality shortcut directly."
seed: 2226

wandb:
  tags:
    - "phase2-round13"
    - "p22"
    - "image-quality-shortcut"
    - "blur-jpeg-brightness-curriculum"
    - "fork-p8a"
    - "single-lever"
    - "no-grl"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "seed-2226"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 3.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 16
total_training_steps: 8000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 400

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# FT from P8A best ckpt (run 9lmvb5b4, step 5000, AUC 0.9926, EER 0.0270).
load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r13_experiments/9lmvb5b4/value_composite_effort_20260424_step5000_auc0.9926_eer0.0270.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# --- Anchor-aware: DISABLED (single-lever discipline). ---
anchor_aware:
  enabled: false
  weight: 5.0
  target_mean_prob: 0.10
  samples_per_step: 16
  pool_names:
    - "dor-real-webcam-false-flag-no-virtual-bg"

# --- Face scale-jitter: DISABLED (single-lever discipline). ---
face_scale_jitter:
  enabled: false
  scale_limit: 0.50

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  # --- Pipeline-randomization: ENABLED — THIS IS THE P22 LEVER. ---
  # Symmetric across labels (p_real == p_fake) so the model can't use the
  # presence of augmentation as a label signal. Sub-augs:
  #   - blur (luma Gaussian) σ ∈ [0.5, 4.0]   p=0.7  ← closes Laplacian gap
  #   - jpeg roundtrip q ∈ [40, 95]           p=0.6  ← compression noise
  #   - brightness shift β ∈ [-40, 40]        p=0.5  ← closes luma gap
  #   - downscale-upscale [0.85, 1.0]         p=0.3  ← mild softening (legacy)
  #   - chroma blur ksize=3                   p=0.3  ← mild (legacy)
  #   - gamma [0.92, 1.08]                    p=0.3  ← mild (legacy)
  #   - yuv roundtrip                         p=0.0  ← off (not in P22 hypothesis)
  #
  # Tuned 2026-05-02 PM via CPU smoke gate: initial blur_p=0.5 σ∈[0,3] yielded
  # post-aug median Laplacian 110 (still in handoff's "too weak" band [100,400]);
  # bumped to blur_p=0.7 σ∈[0.5,4] which lands median ≈ 30 — overlapping
  # eval suites (teams_fake_dev p50=28, lockbox p50=10).
  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.7
    blur_sigma_range: [0.5, 4.0]
    brightness_p: 0.5
    brightness_range: [-40.0, 40.0]
    jpeg_p: 0.6
    jpeg_quality: [40, 95]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 2226
  seed: 2226

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 2226
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: true
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 12.0
anneal_steps: 8000

evaluate_every_steps: 500
ood_monitoring_start_step: 500
ood_monitoring_every_steps: 1000
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 16

periodic_saves:
  enabled: true
  step_list:
    - 500
    - 1000
    - 1500
    - 2000
    - 2500
    - 3000
    - 3500
    - 4000
    - 5000
    - 6000
    - 7000
    - 8000

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2r13_experiments/"
  save_every_steps: 1000
  keep_last_n: 4
