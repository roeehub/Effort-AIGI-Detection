# --- B16_LAION Optimized: All Improvements (s_end=18) ---
# PURPOSE: Apply L14 learnings to B16_LAION backbone
# KEY CHANGES vs original B16 experiments:
#   - learning_rate: 2e-4 (4x higher than 5e-5)
#   - warmup: 1000 steps (4x shorter than 4000)
#   - ArcFace anneal aligned with warmup
# EXPECTED: ~0.90-0.95 AUC based on L14 results
# Created: Jan 12, 2026

name: "B16_LAION_s18_all_improvements"
description: "B16 LAION + LR=2e-4 + warmup=1000 - applying L14 learnings"

# === DATA SOURCE ===
data_source: combined_paired

# Backbone Configuration (LAION via OpenCLIP)
backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512  # OpenCLIP output dimension
  resolution: 224

# Training Hyperparameters - OPTIMIZED FROM L14 LEARNINGS
learning_rate: 2.0e-4  # 4x higher - critical for ~19k trainable params
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 1.0
# ViT-B-16 attention layers are 768x768
# rank=767 gives k=1 trainable singular direction
rank: 767

# Gradient Clipping
gradient_clip_val: 1.0

# Training Schedule
nEpochs: 150

# Dataloader Configuration
dataloader_strategy: combined_paired
frames_per_batch: 256  # B16 can handle larger batch than L14
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# Combined Dataset Configuration
combined_paired:
  identity_balanced_sampling: true
  df40:
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods: null
  deeplive:
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
  train_split: 0.9
  val_split: 0.1
  test_split: 0.0
  seed: 737

# Augmentation
augmentation:
  version: "base_only"
  base:
    horizontal_flip: true
    color_augmentations: true
    quality_augmentations: true
    geometric_augmentations: true

# Fixed Context
test_batch_size: 32
evaluate_every_steps: 500
seed: 737
load_base_checkpoint: false

# Early stopping
early_stopping_enabled: true
early_stopping_patience: 15
early_stopping_min_delta: 0.001

# Learning rate scheduler - SHORT WARMUP (key learning from L14)
lr_scheduler: "cosine_with_warmup"
total_training_steps: 12000
lr_scheduler_warmup_steps: 1000  # 4x shorter - critical!

# ============================================
# ArcFace Configuration - Aligned with warmup
# ============================================
use_arcface_head: true
arcface_s: 18.0
arcface_m: 0.28
s_start: 10.0
s_end: 18.0
anneal_steps: 1000  # Aligned with warmup

# Normalization
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

# GCS Assets
gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

# Checkpointing
checkpointing:
  gcs_prefix: "gs://training-job-outputs/B16_LAION_optimized/"
  save_every_steps: 2000
  keep_last_n: 3

# Evaluation
evaluation:
  metrics: ["auc", "eer", "accuracy"]
  evaluate_every_steps: 500

# W&B
wandb:
  project: "B16-LAION-optimized"
  tags:
    - "B16-LAION-optimized"
    - "vit-b-16"
    - "laion"
    - "s_end_18"
    - "all_improvements"
    - "lr_2e4"
