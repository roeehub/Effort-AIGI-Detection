# Iterative-mode suite manifest for the Teams promotion contract.
#
# Authored 2026-05-08 to support the iterative scorecard mode introduced by
# `launch_teams_promotion_contract.sh --mode iterative`. See
# `docs/packet_retrospectives/SCORECARD_GUIDE.md` for the discipline.
#
# WHAT THIS DROPS vs the FULL manifest
# (`target_domain_suites.teams_promotion_contract_2026-04-23_with_dor.yaml`):
# - `teams_real_poor_quality_lockbox` — covered by `teams_real_poor_quality_dev`
#   which DOES drive τ
# - `teams_real_lighting_extreme_lockbox` — covered by
#   `teams_real_lighting_extreme_dev` which DOES drive τ
#
# These 2 lockbox-stress diagnostics are pure readouts whose dev counterparts
# already shape τ via the lex policy. Their lockbox counterparts add a small
# cross-substrate sanity check that is valuable at promotion-verdict time but
# is redundant for iterative "did this packet move the needle?" runs.
#
# Saves ~1.5-2 min per ckpt × suite × ~3-5 ckpts = ~5-10 min wall-clock per
# iterative scorecard. Small absolute savings, but free — these suites add
# zero information that the dev counterparts don't already carry for the
# iterative question.
#
# WHAT THIS KEEPS that's NOT τ-deciding (= still load-bearing for iterative):
# - All 17 `teams_capture_<identity>_dev` per-identity diagnostic suites.
#   These are kept because per-identity FPR is the load-bearing diagnostic
#   for detecting chronic-FP regressions hidden by macro suites — see memory
#   `project_p1_pe_eval` (Roy_D regression hidden in macro until per-identity
#   surfaced it) and `project_chronic_offenders_partition_per_ckpt_2026-05-04`
#   (different ckpts handle different identities).
#
# Use the FULL manifest for trajectory and final-promotion-verdict scorecards;
# use this iterative manifest for "did this packet move the needle?" runs.

suites:
  - name: teams_real_all_dev
    df40_mode: none
    external_real_manifest: "arena/manifests/teams_target_domain_manifest_2026-04-23_with_dor.json"
    external_real_manifest_split: "dev"
    external_real_manifest_slices: "teams_real_all"
    external_real_deterministic: true

  - name: teams_real_poor_quality_dev
