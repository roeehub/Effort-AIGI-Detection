# ============================================================================
# R13_FACE_POOL_HEAD_2026-05-25.yaml — Phase 2 HEAD (face-pool head-only retrain)
#
# SINGLE-LEVER DELTA vs Slot A v2 step3500 base: enable `face_pool_readout`
# at L11 with centered 7x7 subgrid (49 patches), freeze backbone via
# `head_only_retrain`, and train ONLY the classifier head on face-pool
# features for 2500 steps. All other Slot A v2 levers (anchor_aware,
# multi_axis_grl, augmentations) are inherited unchanged.
#
# MOTIVATION (FACTS):
#   Phase 0 Probe 2 (2026-05-22, analysis/substrate_pair_geometry_2026-05-22/)
#   showed face-region patch features are MORE substrate-invariant than CLS
#   at L11: cos_pair 0.87 (CLS) -> 0.96 (face); delta_pair_vs_within -0.077
#   (CLS) -> -0.016 (face).
#
#   The 2026-05-22 face-pool inference scorecard (fad721a) Pareto-improved
#   lockbox metrics on Slot A v2 step3500:
#     - lockbox_real_fpr  0.0191 -> 0.0154   (-19% relative)
#     - lockbox_fake_recall 0.6877 -> 0.7668 (+11.5pp absolute)
#     - composite (λ=1.0)  0.331 -> 0.249    (-25% relative)
#   At the cost of visomaster_enhanced_macro_dev recall: 0.1673 -> 0.0673.
#
# HYPOTHESIS:
#   The Pareto improvement of face-pool inference is robust to head-fitting
#   on face-pool features. Training the head on face-pool features (instead
#   of reusing the CLS-pool-trained head at inference time) should recover
#   the visomaster recall regression by letting the boundary adapt to the
#   shifted feature distribution.
#
# FALSIFIERS (close criterion = abort):
#   - lockbox_real_fpr regresses vs face-pool inference baseline (> 0.0154)
#   - lockbox_fake_recall regresses below face-pool inference baseline
#     (< 0.7668)
#
# CONFIRMATION (Ship gate per /Users/roeedar/.claude/plans/...quasar.md):
#   - lockbox_real_fpr ≤ 0.016
#   - lockbox_fake_recall ≥ 0.74
#   - visomaster_enhanced_macro_dev recall ≥ 0.15
#   - composite (λ=1.0) ≤ 0.20
#
# DIFFERS FROM PRIOR HEAD-RETRAIN PACKETS:
#   - R13_SLOT1_HEAD_RETRAIN (2026-05-13): head-only on LoRA-trained Slot 1
#     CLS pool. Refuted (over-fired lockbox reals 80-92%).
#   - Job 7 head retrains (2026-05-04): 6 retrained heads over-fired lockbox
#     reals 80-92% on CLS pool — substrate-invariance is the load-bearing
#     P8A property and CLS head retrain destroyed it. THIS packet differs:
#     the FEATURES the head sees are now face-pool (substrate-invariant per
#     Probe 2), so the head no longer needs to learn invariance — it just
#     learns the decision boundary on already-invariant features.
#
# COST: ~$0.50-1.00 smoke (200 steps, A100 us-east1, ~10-15 min) +
#       ~$7-9 full (2500 steps, A100 us-east1, ~2.5 h).
# CONFIDENCE: 40-55% any periodic ckpt meets the four-gate ship criterion;
#   65-80% lockbox metrics improve vs Slot A v2 step3500 CLS baseline.
# Seed: 9914
# ============================================================================

name: "R13_FACE_POOL_HEAD_2026-05-25"
description: "Phase 2 HEAD — face-pool head-only retrain on Slot A v2 step3500 base. Productionizes the 2026-05-22 face-pool monkey-patch (centered 7x7 of 14x14 patch grid at L11, mean -> ln_post -> visual.proj 768->512) as a yaml-gated wrapper flag. Backbone frozen via head_only_retrain; only classifier head trains. Tests whether face-pool inference's Pareto lockbox improvement is robust to head-fitting on face-pool features and whether it recovers the visomaster regression."
seed: 9914

wandb:
  tags:
    - "phase2-round13"
    - "phase2-head-2026-05-22"
    - "face-pool-readout-l11-r3"
    - "head-only-retrain"
    - "ft-from-slot-a-v2-step3500"
    - "inherits-anchor-aware"
    - "inherits-multi-axis-grl"
    - "single-lever"
    - "no-pair-rank"
    - "no-group-dro"
    - "no-resolution-chain-aug"
    - "no-face-scale-jitter"
    - "no-arcface"
    - "no-lora"
    - "seed-9914"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 1.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 10
total_training_steps: 2500
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 250

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# === LOAD FROM SLOT A v2 STEP3500 (deployment candidate, has anchor_aware) ===
load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/best_checkpoints/hp35c51p/periodic_effort_20260516_step3500_auc0.9952_eer0.0123.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# ===== NEW LEVER: face_pool_readout (Phase 2 HEAD) =====
# Read by detectors/effort_detector.py:OpenCLIPVisionModelWrapper to swap
# CLS pooling for centered face-region mean at L11.
#   layer=11           — last resblock (matches Probe 2 + face-pool canary)
#   subgrid_radius=3   — centered 7x7 of 14x14 (49 face patches at center
#                        ~75% of frame; matches Probe 2)
face_pool_readout:
  enabled: true
  layer: 11
  subgrid_radius: 3

# ===== HEAD-ONLY RETRAIN (Phase 2 HEAD) =====
# Read by train_sweep.py. With enabled=true, every non-head param is frozen
# AFTER checkpoint load; only head.weight + head.bias train. reinit_head=true
# discards the CLS-trained boundary so the optimization finds a fresh
# boundary on face-pool features.
head_only_retrain:
  enabled: true
  reinit_head: true
  trainable_param_substrings:
    - "head.weight"
    - "head.bias"

# ===== Multi-axis encoder-level GRL — INHERITED from Slot A v2 (NOT changed) =====
# Note: with head_only_retrain.enabled=true the encoder is frozen, so GRL
# has no gradient path. We keep the block enabled so trainer-side stat
# logging proceeds (the GRL classifier itself trains but its gradient
# reversal has no effect on the frozen encoder). This avoids changing any
# inherited lever's enabled flag.
multi_axis_grl:
  enabled: true
  axes:
    - chronic_flag
    - is_dor
    - sharpness_laplacian_high
    - color_a_approx_dev_high
  lambda_max: 1.0
  lambda_warmup_steps: 250
  loss_weight: 1.0
  hidden_dim: 1024
  bottleneck_dim: 128

# ===== NO resolution_chain_aug =====
resolution_chain_aug:
  enabled: false

# ===== All other inherited levers (no change vs Slot A v2 ancestor) =====

pair_rank_loss:
  lambda: 0.0

use_group_dro: false

correlation_penalty:
  enabled: false

# ===== anchor_aware (Slot A v2 lever, inherited) =====
# Same caveat as GRL: encoder is frozen by head_only_retrain so the
# anchor-aware backward effect on the encoder is null. We still compute
# the penalty for trainer-side stat visibility.
anchor_aware:
  enabled: true
  weight: 5.0
  target_mean_prob: 0.10
  samples_per_step: 16
  pool_names:
    - "dor-real-webcam-false-flag-no-virtual-bg"

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

combined_paired:
  identity_balanced_sampling: true
  split_seed: 9914
  seed: 9914

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    frame_keep_list_path: "analysis/cpu_diagnostics_2026-05-09/slot1_teams_real_keep_list_2026-05-09.csv"

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 9914
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 250
ood_monitoring_start_step: 250
ood_monitoring_every_steps: 500
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 12

periodic_saves:
  enabled: true
  step_list:
    - 100
    - 500
    - 1000
    - 1500
    - 2500

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
