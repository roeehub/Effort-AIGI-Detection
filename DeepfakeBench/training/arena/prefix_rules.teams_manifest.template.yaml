# Optional explicit prefix/session provenance overrides for
# build_teams_target_domain_manifest.py.
#
# Matching order:
# 1. "<prefix>__<session_id>" (for example "Cam_Test__s33")
# 2. "<prefix>"             (for example "deeplive_dor")
#
# Keys under each label may set:
#   method: <metric/reporting method name>
#   slices: [slice_a, slice_b, ...]
#
# Example:
# fake:
#   Cam_Test__s33:
#     method: deeplive_regular
#     slices: [deeplive_regular]
#   Test_Cam__s53:
#     method: visomaster_original_macro
#     slices: [visomaster_original_macro]
#   Test_Cam__s76:
#     method: visomaster_simswap512
#     slices: [visomaster_simswap512]
#
# Safe freeze option:
# If the bucket filenames are not sufficient to prove the canonical family
# (`deeplive_regular`, `visomaster_original_macro`, etc.), freeze rows to a
# session-level provenance label first. That removes `teams_fake_unknown`
# without over-claiming method identity. The session labels below reflect the
# unresolved fake lanes discovered on 2026-04-06.

