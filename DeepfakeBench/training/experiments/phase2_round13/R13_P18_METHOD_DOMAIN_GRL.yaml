# ============================================================================
# R13_P18_METHOD_DOMAIN_GRL.yaml  ⚠ DRAFT — needs combined_paired.py change ⚠
#
# Phase 2, Round 13 — Phase 3 packet (Option I-α): FT-from-P8A_step5000 +
# finer-grained source-domain GRL, isolated.
#
# Why P18 exists: P17 falsified the layer-3 trained-head readout idea
# (P17_FINAL_VERDICT_2026-05-01.md). Phase 1A diagnostic
# (PHASE1A_SUBSTRATE_DIRECTION_FINDING_2026-05-01.md) established that the
# trained P17 heads modally align with `is_dor_shkedi` /
# `is_deeplive_enhanced` cluster (cos +0.10–+0.14, monotonic across training)
# and are essentially orthogonal to capture-mode (cos < 0.08). So the P15 GRL
# at static λ=0.20 didn't bite (domain probe AUC 0.9994) because GRL was
# trying to flatten an axis the encoder wasn't using. The Phase 1 synthesis
# concludes: GRL has to attack identity/fake-method clustering, not
# capture-mode. The minimal-code first test of that hypothesis is finer-grained
# *source-family* GRL — separate IDs for `deeplive`, `deeplive_teams`,
# `visomaster`, `visomaster_enhanced`, `df40`, `external`.
#
# Single delta (well, two related ones) from R13_P14_FT_FROM_P8A.yaml:
#   1. Replace the P14 anti-shortcut bundle (anchor_aware + pipeline_random +
#      face_scale_jitter@0.25) with method-conditional GRL ALONE. Per
#      `anti_shortcut_bundle_decomposition` thread (mclioexb verdict): the
#      bundle was net-negative against face_scale_jitter@0.50 alone. Single-axis
#      isolation respects that lesson.
#   2. quality_domain_count: 3 → 12, using the Phase 2C method-bucket map
#      (analysis/method_class_audit_2026-05-01/proposed_method_domain_map.py).
#      Twelve buckets (0–11):
#        0  df40                 — academic clean (17 methods collapsed)
#        1  deeplive_basic       — edge_cases + minimal_processing
#        2  deeplive_enhanced    — quality_enhancement + *_enhanced  ★ Phase 1A's modal axis
#        3  deeplive_teams       — Teams passthrough (incl. dor_shkedi)
#        4  visomaster_inswapper — Inswapper128 + SimSwap512
#        5  visomaster_ghost     — GhostFace v1/v2/v3
#        6  visomaster_other     — CSCS + InStyleSwapper256-A/B/C
#        7  visomaster_enhanced  — RESERVED (lane currently disabled in P14/P15)
#        8  visomaster_teams_recap — RESERVED (Teams-enhanced; disabled)
#        9  proper_visomaster_clean — RESERVED (proper-data wave; disabled)
#        10 external_vcd_real
#        11 realpool_real
#      Buckets 7-9 are reserved so the map doesn't need re-versioning when those
#      data sources are turned on later. Domain 2 (deeplive_enhanced) directly
#      targets the `is_deeplive_enhanced` axis Phase 1A pinpointed; domain 3
#      (deeplive_teams) is where dor_shkedi-cluster captures sit.
#   3. quality_head_hidden_dim: 128 → 256 (4× cardinality vs P15's 3-class).
#
# IMPORTANT — pre-launch blockers (CODE CHANGES, see PHASE2D_CODE_CHANGE_CHECKLIST):
#   1. Update `data/sources/combined_paired.py:66` QUALITY_DOMAIN_MAP →
#      method-aware lookup using `lookup_method_domain(method, source)` from
#      analysis/method_class_audit_2026-05-01/proposed_method_domain_map.py.
#   2. Update all 21+ call sites in combined_paired.py that assign
#      `quality_domain` to use the new method-aware lookup.
#   3. Update `detectors/effort_detector.py:280` QualityDomainHead.DOMAIN_MAP
#      to mirror the 12-bucket map (or rename to MethodDomainHead).
#   4. `tests/test_unpaired_reals_and_grl.py` currently fails at the
#      augmentation-pipeline import stage (PLAN.md §10.7). Fix the relative
#      import bug before any P18 launch — the smoke run depends on this test
#      passing.
#   5. Confirm with `scripts/launch/check_grl_domain_populations.py
#      --config experiments/phase2_round13/R13_P18_METHOD_DOMAIN_GRL.yaml`:
#      every active domain (0–6, 10–11) has ≥ 2000 samples in train; no domain
#      has >90% concentration in a single source family. Bucket 10
#      (external_vcd_real) is HIGH RISK per 2C audit — it IS the source family
#      and the GRL will trivially classify it. Mitigation: lower `external_real`
#      family weight from 2.0 → 1.0 below; alternatively kill-gate bucket 10
#      FPR mid-training.
#
# Pre-launch CPU smoke gates (per Phase 1 synthesis §"Pre-Phase-3 work"):
#   1. Edit QUALITY_DOMAIN_MAP. Run `pytest tests/test_unpaired_reals_and_grl.py`
#      (must all pass — Codex round 1 flagged a relative-import failure that
#      needs fixing before launch; see PLAN.md §10.7).
#   2. Run `python scripts/launch/check_grl_domain_populations.py
#      --config experiments/phase2_round13/R13_P18_METHOD_DOMAIN_GRL.yaml`
#      and confirm per-(domain, label) cells are non-zero for the 6 active
#      domains AND no domain has >90% concentration in a single source family.
#   3. Domain-confusion probe analog: run a 6-class LR on cached P8A features
#      → confirm baseline source-family discrimination AUC >> 0.5 (i.e., the
#      domains are linearly separable in P8A's [CLS] features). If macro-OVR
#      AUC > 0.85, GRL has signal to attack. Output to
#      `analysis/domain_confusion_probe_2026-04-30/outputs/probe_p8a_six_classes/`.
#   4. Smoke run (200 steps, no checkpoint upload) on Vertex with this yaml +
#      `--total_training_steps 200` override. Confirm:
#         - "Quality domain head ENABLED with 6 domains, hidden_dim=128, ..."
#           log line fires at trainer init.
#         - `train/loss/quality_domain` is non-zero throughout the smoke run.
#         - `train/grad_norm/quality_domain_head` is non-zero.
#
# Expected outcome lattice (per readiness-note pattern):
#   α (PASSES): post-training domain-confusion AUC drops materially on the new
#     6-class basis (e.g. 0.95 → 0.65); contract scorecard recall lifts > 5pp
#     on `visomaster_enhanced_macro_dev` vs P8A.  → ship P18.
#   β (PARTIAL): domain-confusion AUC drops but contract scorecard
#     under-promotes. → next packet adds ramped λ (trainer patch ~10 lines)
#     and/or production-tight retrain.
#   γ (NO BITE): domain-confusion AUC stays ~0.95 (like SLOT2_GRL did).
#     → 6-class GRL is also wrong axis; pivot to identity-conditional GRL or
#     Move 4 paired same-identity contrastive (Option II in synthesis).
#
# Cost: ~$60 / 8h on us-west4 or us-east1. Pair with R13_P18_NO_GRL_CONTROL
# for clean attribution (~$60 marginal). Total: ~$120 / 1 day Vertex.
#
# Seed: 1801 (P14=737, P15=1501, P16=2273, P17=5503-5506; P18=1801-1802).
# ============================================================================

name: "R13_P18_METHOD_DOMAIN_GRL"
description: "FT-from-P8A_step5000 + 6-class source-domain GRL ISOLATED (no anchor_aware, no pipeline_random, no face_scale_jitter)"
seed: 1801

wandb:
  tags:
    - "phase2-round13"
    - "p18-method-grl"
    - "anti-shortcut"
    - "grl"
    - "quality-domain-12-class"
    - "method-conditional-grl"
    - "lambda-0.20-static"
    - "fork-p8a"
    - "isolated-no-bundle"
    - "seed-1801"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 3.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 8
total_training_steps: 4000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 200

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# FT from P8A best ckpt (run 9lmvb5b4, step 5000).
load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r13_experiments/9lmvb5b4/value_composite_effort_20260424_step5000_auc0.9926_eer0.0270.pth"

label_smoothing: 0.0
stability_lambda: 0.0

# === GRL Method Domain Head — 12-class method-conditional ===
# REQUIRES: code changes per header pre-launch checklist (combined_paired.py,
# effort_detector.py, tests). Without those, this yaml will either crash at
# trainer init (label out-of-range) or fall through to the legacy 3-class map
# and test nothing new.
use_quality_domain_head: true
quality_domain_loss_weight: 0.20
quality_domain_require_labels: true
quality_domain_count: 12
quality_head_hidden_dim: 256

# === Anti-shortcut bundle DISABLED — single-axis isolation ===
# Per anti_shortcut_bundle_decomposition thread, the bundle was empirically
# net-negative against face_scale_jitter@0.50 alone (mclioexb 0.661 vs
# bundle 0.116). Future packet may stack with face_scale_jitter@0.50 only
# AFTER P18 establishes whether 6-class GRL bites in isolation.
anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: false

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  # Pipeline-randomization DISABLED — single-axis isolation
  pipeline_randomization:
    enabled: false

combined_paired:
  identity_balanced_sampling: true
  split_seed: 737
  seed: 737

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 737
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 1.0  # P18: lowered from 2.0 — bucket 10 (external_vcd_real)
                          # IS the source family (label-confound). Halving
                          # weight reduces the trivial-classification risk per
                          # Phase 2C audit.

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

# ArcFace: FT-friendly schedule (matches P14, P15).
use_arcface_head: true
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 12.0
anneal_steps: 4000

evaluate_every_steps: 500
ood_monitoring_start_step: 500
ood_monitoring_every_steps: 1000
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 10

# Periodic step-based saves at FT cadence (matches P15).
periodic_saves:
  enabled: true
  step_list:
    - 500
    - 1000
    - 1500
    - 2000
    - 2500
    - 3000
    - 3500
    - 4000

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2r13_experiments/"
  save_every_steps: 1000
  keep_last_n: 3
