# =============================================================================
# Round 3 — R3_S2 Phase 2: Continue from Phase 1 with moderate augmentation
# =============================================================================
# Purpose: Phase 2 of the curriculum approach. Loads the best checkpoint from
#   R3_S2_curriculum_phase1_light and continues with quality_robust_moderate
#   at lower LR. The model has already learned SVD structure and basic
#   classification — now we harden it against quality shortcuts.
#
# ★ BEFORE LAUNCHING: Update gcs_base_checkpoint with the actual best
#   checkpoint path from Phase 1. Example:
#   gs://training-job-outputs/phase2r3_experiments/<run_id>/top_n_effort_*.pth
#
# Theme: Stage B — augmentation curriculum (phase 2)
# Compare: R3_S2 Phase 1 (light aug only) — did moderate phase help?
#          R3_S1 (moderate from epoch 0) — is curriculum better?
# =============================================================================

name: "R3_S2_curriculum_phase2_moderate"
description: "Curriculum Phase 2: continue from Phase 1 best ckpt with moderate aug"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true

# ★ Lower LR for phase 2 — structure already learned
learning_rate: 5.0e-5
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736  # k=32
gradient_clip_val: 1.0

nEpochs: 10
total_training_steps: 20000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 500

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# ★ IMPORTANT: Update this with Phase 1's best checkpoint before launching!
load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/phase2r3_experiments/PLACEHOLDER_PHASE1_RUN_ID/top_n_effort_PLACEHOLDER.pth"

combined_paired:
  identity_balanced_sampling: true

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods: null

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "Inswapper128"
    tiers: null

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05
  seed: 737

# ★ Phase 2: MODERATE augmentation — harden against quality shortcuts
augmentation:
  version: "quality_robust"
  strength: "moderate"

use_arcface_head: true
arcface_m: 0.0
arcface_s: 10.0
s_start: 10.0
s_end: 18.0
anneal_steps: 30000

evaluate_every_steps: 500
test_batch_size: 32
seed: 737

early_stopping_enabled: true
early_stopping_patience: 8

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2r3_experiments/"

# W&B tags
# tags: phase2-round3, R3-S2-phase2, curriculum, quality-robust, moderate
