# --- Combined Paired Experiment: ViT-B-16 (OpenAI CLIP) ---
# Training on DF40 + DeepLive combined dataset with identity-balanced sampling
# Created: Jan 9, 2026 - Fixes for identity leakage and frequency imbalance
#
# Key fixes applied:
# 1. Identity-stratified splitting (no identity in multiple splits)
# 2. One-method-per-identity sampling (balanced frequency across identities)
# 3. Combined DF40 (~954 identities) + DeepLive (~920 identities) = ~1,874 identities

name: "Combined_Paired_ViT_B16_OpenAI"
description: "DF40+DeepLive combined (~1,874 identities), identity-stratified split, identity-balanced sampling, ViT-B-16"

# === DATA SOURCE ===
data_source: combined_paired

# Backbone Configuration (OpenAI via HuggingFace)
backbone:
  name: "vit_b_16_openai"
  variant: "ViT-B-16"
  source: "openai"
  huggingface_id: "openai/clip-vit-base-patch16"
  hidden_size: 768
  resolution: 224

# Training Hyperparameters - REDUCED LR to prevent collapse
learning_rate: 5.0e-5  # Reduced from 1e-4 for stability
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 1.0
rank: 767  # hidden_size - 1

# Gradient Clipping
gradient_clip_val: 1.0

# Training Schedule
nEpochs: 30

# Dataloader Configuration
dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8  # Sparse sampling
num_workers: 4
prefetch_factor: 2

# Combined Dataset Configuration
combined_paired:
  # Identity-balanced sampling (one method per identity per epoch)
  identity_balanced_sampling: true
  
  # DF40 settings
  df40:
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods: null  # All methods
  
  # DeepLive settings
  deeplive:
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
  
  # Split ratios (applied to identities, not samples)
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 737

# Augmentation Configuration
# NOTE: DF40 has NO landmarks, DeepLive has landmarks
# Using base_only to be safe - landmark occlusion applied only where available
augmentation:
  version: "base_only"
  base:
    horizontal_flip: true
    color_augmentations: true
    quality_augmentations: true
    geometric_augmentations: true

# Fixed Context
test_batch_size: 32
# ~1,499 train identities × 1 sample/identity × 8 frames = ~11,992 frames / 32 = ~375 steps/epoch
evaluate_every_steps: 500
seed: 737
load_base_checkpoint: false

# Early stopping
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_delta: 0.001

# Learning rate scheduler
# ~375 steps/epoch × 30 epochs = ~11,250 total steps
lr_scheduler: "cosine_with_warmup"
total_training_steps: 12000
lr_scheduler_warmup_steps: 1200  # ~10% warmup

# ArcFace head
use_arcface_head: true
arcface_s: 30.0
arcface_m: 0.28
s_start: 10.0
s_end: 30.0
anneal_steps: 4000  # Anneal over ~10 epochs

# Mean and std for normalization (CLIP)
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

# GCS Assets
gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/clip-vit-base-patch16/"
    local_path: "./weights/clip-vit-base-patch16/"

# Checkpointing
checkpointing:
  gcs_prefix: "gs://training-job-outputs/combined_paired_experiments/"
  save_every_steps: 2000
  keep_last_n: 3

# Evaluation
evaluation:
  metrics:
    - "auc"
    - "eer"
    - "accuracy"
  evaluate_every_steps: 500

# W&B Configuration
wandb:
  project: "combined-paired-experiments"
  tags:
    - "combined-paired"
    - "df40"
    - "deeplive"
    - "vit-b-16"
    - "openai"
    - "identity-balanced"
    - "identity-stratified"
