# ============================================================================
# R13_PC_CODEC_PLUS_DATA.yaml
# Phase 2, Round 13 — E2B + enhanced viso data + Teams codec aug.
#
# Forks: R13_PA_VISOMASTER_ENHANCED_DATA.yaml (Packet A)
#
# TWO CHANGES vs E2B baseline (multi-lever, both well-motivated):
#   1. Enable visomaster_enhanced + visomaster_teams_enhanced data
#      (same as Packet A — fixes the "no enhanced viso in training" gap)
#   2. Enable teams_codec_simulation aug (calibrated to MEASURED Teams deltas)
#      VERIFIED 2026-05-05 (analysis/codec_aug_verification_2026-05-05/):
#      cosine similarity 0.87-0.99 between aug-induced and actual-teams-induced
#      IQ feature shifts on 30 paired (raw, teams) viso fake samples.
#      Aug magnitude is 97-106% of actual teams-transport magnitude per feature.
#
# Why both interventions in one packet:
#   - Packet A tests data alone. This packet (C-codec) tests data + codec aug.
#   - If C > A on viso: codec aug provides additional value beyond data.
#   - If C ≈ A: codec aug doesn't add when enhanced data is present.
#   - For 72h ship: combining both interventions maximizes shipping probability.
#
# Codec aug history: used in P8A (teams_codec_sim_p=0.50), P11_HEAVY (0.65),
# RLP7_02 (0.40), R9_F/R9_G "Wave 2". Disabled in current packets without
# documented reason. Re-enabling on E2B is the natural test.
#
# Pre-registered falsifiers (CPU post-training):
#   F-PC-A: viso AUC on visomaster_enhanced_macro_dev ≥ 0.75 (E2B 0.68 → +0.07
#           — should beat Packet A's +0.05 target since codec aug adds variety
#           that aligns with eval substrate)
#   F-PC-B: TEAMS-TRANSPORTED viso recall at deployment-honest tau ≥ 30%
#           (P8A 17.8%, E2B 13.1% on teams subtype). This is THE deployment
#           metric and the primary test of codec aug's value-add.
#   F-PC-C: deeplive recall ≥ 92% at 5% FPR (E2B 97% baseline; allow 5pp
#           regression headroom for the multi-lever combination)
#   F-PC-D: NO collapse: val AUC stays ≥ 0.95 throughout (no codec-aug-induced
#           training instability)
#   3-4/4 → PROMOTE. 0-2/4 → codec aug doesn't add over data alone; ship Packet A
#   if it succeeded.
#
# Cost: ~$87 Vertex. Region: us-east1 preferred.
# Seed: 3024 (distinct from E2B=3022, PA=3023).
# ============================================================================

name: "R13_PC_CODEC_PLUS_DATA"
description: "Packet A + Teams codec aug. Enable enhanced viso data + teams_codec_simulation (adaptive policy, p=0.5) on E2B baseline. Codec aug verified 2026-05-05 to faithfully reproduce actual teams transport (cosine 0.87-0.99 vs measured pairs)."
seed: 3024

wandb:
  tags:
    - "phase2-round13"
    - "packet-c-codec"
    - "data-plus-codec-aug"
    - "enhanced-viso-enabled"
    - "teams-enhanced-enabled"
    - "teams-codec-simulation-enabled"
    - "codec-aug-adaptive-mixture"
    - "scratch-from-clip"
    - "no-anti-shortcut-bundle"
    - "no-arcface"
    - "cross-entropy-loss"
    - "no-grl"
    - "no-anchor-aware"
    - "no-face-scale-jitter"
    - "seed-3024"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

# Scratch hyperparameters (identical to E2B):
learning_rate: 2.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 16
total_training_steps: 8000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 1000

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# THE LEVER (matched to E2B): scratch from raw CLIP, NOT FT from P8A.
load_base_checkpoint: false

label_smoothing: 0.0
stability_lambda: 0.0

# --- Anchor-aware: DISABLED (matched to E2B). ---
anchor_aware:
  enabled: false
  weight: 5.0
  target_mean_prob: 0.10
  samples_per_step: 16
  pool_names:
    - "dor-real-webcam-false-flag-no-virtual-bg"

# --- Face scale-jitter: DISABLED (matched to E2B). ---
face_scale_jitter:
  enabled: false
  scale_limit: 0.50

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  # --- Pipeline-randomization: IDENTICAL to E2B (eval-targeted aug). ---
  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

  # --- NEW (Packet C-codec LEVER): Teams codec simulation -------------------
  # Calibrated against measured Teams transport (data/augmentations/teams_simulation.py:6).
  # Verified 2026-05-05: cosine 0.87-0.99 with actual teams transport on viso pairs;
  # magnitude ratio 97-106% of actual shift per IQ feature.
  # Adaptive policy routes ENHANCED families to heavier mode (more blur, lower JPEG q,
  # stronger deblock) and ordinary families to milder mode.
  # Exclude families that already carry REAL Teams codec fingerprint to avoid double-codec.
  teams_codec_simulation:
    enabled: true
    probability: 0.5                 # P8A used 0.50; we match that
    policy: "adaptive_mixture"       # routes by enhanced_families list
    enhanced_families:
      - "visomaster_enhanced_fake"
      - "deeplive_enhanced_fake"
      - "proper_visomaster_enhanced_clean_fake"
      - "proper_visomaster_enhanced_teams_fake"
    exclude_families:
      # Don't apply synthetic codec to data that already has real Teams codec
      - "deeplive_teams_real"
      - "deeplive_teams_fake"
      - "visomaster_hints_teams_real"
      - "visomaster_hints_teams_fake"
      - "proper_visomaster_teams_fake"
      - "proper_visomaster_enhanced_teams_fake"
      - "proper_real_teams"

combined_paired:
  identity_balanced_sampling: true
  split_seed: 3024
  seed: 3024

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  # NEW (Packet A LEVER): V1 enhanced viso (enhancer pass, no Teams transport)
  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  # EXPLICITLY DISABLED — bad data lane per memory project_visomaster_hints_lanes_bad_data.
  # Block kept here as a guard so future merges don't accidentally enable it.
  visomaster_hints_teams:
    enabled: false

  # NEW (Packet A LEVER): V1 enhanced + Teams-v2 transport (the conjunction).
  # This is the eval-substrate-matching source.
  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 3024
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0          # NEW — matches base visomaster_fake.
                                              # No upweight (P14 fw=8.0 collapsed
                                              # under bundle confounds; P16 fw=2.0
                                              # didn't lift on FT base; default fw
                                              # is the cleanest single-lever test).
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

# THE FIX vs failed E2: ArcFace head disabled. Trainer falls back to CrossEntropy.
# Identical to E2B (CrossEntropy stable, no collapse).
use_arcface_head: false
arcface_m: 0.15      # left for backwards compat; trainer ignores when head disabled
arcface_s: 6.0
s_start: 6.0
s_end: 6.0           # No annealing when head is disabled
anneal_steps: 1

evaluate_every_steps: 200
ood_monitoring_start_step: 200
ood_monitoring_every_steps: 400
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 10

periodic_saves:
  enabled: true
  step_list:
    - 200
    - 500
    - 1000
    - 1500
    - 2000
    - 2500
    - 3000
    - 4000
    - 5000
    - 6000
    - 7000
    - 8000

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
