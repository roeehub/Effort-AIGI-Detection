# =============================================================================
# Phase 2 — Experiment B6: Checkpoint Resume + Group DRO
# =============================================================================
# Purpose: Best of both worlds — Phase 1 checkpoint + per-method fairness.
# Night: 2 (Training Strategy)
# =============================================================================

name: "P2_B6_checkpoint_resume_dro"
description: "Resume from Phase 1 checkpoint + Group DRO on all 3 sources"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true

learning_rate: 5.0e-5  # Lower LR for fine-tuning
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 760
gradient_clip_val: 1.0

nEpochs: 15
total_training_steps: 30000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 500

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

# ★ Load Phase 1 winning checkpoint
load_base_checkpoint: true
gcs_base_checkpoint: "gs://training-job-outputs/best_checkpoints/top_n_effort_20260119_step14000_auc0.9947_eer0.0218_B16_LAION.patched.pth"

combined_paired:
  identity_balanced_sampling: true
  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods: null
  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models: ["CSCS", "GhostFace-v1", "GhostFace-v2", "InStyleSwapper256-A", "InStyleSwapper256-B", "Inswapper128"]
    tiers: null
  train_split: 0.85
  val_split: 0.10
  test_split: 0.05
  seed: 737

# ★ Group DRO ENABLED
use_group_dro: true
group_dro_params:
  beta: 3.0
  clip_min: 1.0
  clip_max: 4.0
  ema_alpha: 0.1

augmentation:
  version: "base_only"
  base:
    horizontal_flip: true
    color_augmentations: true
    quality_augmentations: true

use_arcface_head: false
evaluate_every_steps: 500
test_batch_size: 32
seed: 737

early_stopping_enabled: true
early_stopping_patience: 8
early_stopping_min_delta: 0.001

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files: [open_clip_config.json, open_clip_pytorch_model.bin]
  base_checkpoint:
    gcs_path: "gs://training-job-outputs/best_checkpoints/top_n_effort_20260119_step14000_auc0.9947_eer0.0218_B16_LAION.patched.pth"
    local_path: "./weights/base.pth"

checkpointing:
  gcs_prefix: "gs://training-job-outputs/phase2_experiments/"
  save_every_steps: 2000
  keep_last_n: 3

mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

wandb:
  project: "phase2-training-strategy"
  tags: ["phase2", "night2", "B6-checkpoint-resume-dro", "training-strategy", "transfer-learning", "group-dro"]
