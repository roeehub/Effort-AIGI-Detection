# ============================================================================
# R13_P2_SCRATCH_FOURIER.yaml
# Phase 2, Round 13 — Packet P2 (PREVENT_NOT_UNLEARN), Slot D: fourier-aug-only.
#
#   FROM-SCRATCH (CLIP-B16 init) +
#   band-limited Fourier amplitude aug (bands 8-13 randomize, 5-6 preserve) +
#   face_scale_jitter@0.50 baseline
#   NO pair_rank_loss
#   NO correlation_penalty
#
# THE LEVER (vs P2_SCRATCH_BUNDLE = Slot A, P2_SCRATCH_CORR_ONLY = Slot B,
#           P2_SCRATCH_PAIRRANK_ONLY = Slot C):
#   Loss-side levers (corr_penalty + pair_rank) BOTH disabled. The single
#   active anti-shortcut lever is the new band-limited Fourier amplitude
#   aug — randomize bands 8-13 (radial bins from FFT center), preserve
#   bands 5-6 (manipulation-signal-carrying per Probe 6 GREEN verdict).
#
# THE QUESTION THIS SLOT ANSWERS:
#   Can a data-side intervention (Fourier amplitude randomization on the
#   shortcut-carrying high-frequency bands) achieve what loss-side
#   interventions on Slots A/B/C are attempting?
#
# Empirical foundation:
#   analysis/fourier_band_overlap_2026-05-06/run_probe.py — Probe 6.
#   summary.json verdict: GREEN_BAND_LIMITED_FOURIER_VIABLE.
#   per_band_aucs.csv — bands 12-13: shortcut AUC 0.97 / signal AUC 0.46-0.52.
#   threads/processing_signature_shortcut.md §"Probe 6 (closes loop)".
#   memory: project_fourier_band_overlap_2026-05-06.md.
#
# ALL OTHER LEVERS, AUG, DATA, CANARY, HYPERPARAMS — IDENTICAL TO SLOTS A/B/C.
# Single delta vs Slot B is `correlation_penalty.enabled: false` AND a new
# `fourier_aug` block.
#
# Pre-registered close criterion: same F1-F5 as Slot A.
# Cost: ~$60-80 Vertex (10-12h).
# Seed: 5304.
# ============================================================================

name: "R13_P2_SCRATCH_FOURIER"
description: "P2 Slot D — from-scratch + band-limited Fourier amp aug (no corr_penalty, no pair_rank). Bands 8-13 randomize, 5-6 preserve."
seed: 5304

wandb:
  tags:
    - "phase2-round13"
    - "p2-scratch-fourier"
    - "from-scratch"
    - "prevent-not-unlearn"
    - "fourier-band-amp-aug"
    - "bands-8-13-randomize"
    - "bands-5-6-preserve"
    - "no-correlation-penalty"
    - "no-pair-rank"
    - "face-scale-jitter-050"
    - "canary-probe-enabled"
    - "post-quality-enhancement-fix"
    - "post-2feea58-codepath"
    - "no-group-dro"
    - "no-anchor-aware"
    - "no-arcface"
    - "cross-entropy-loss"
    - "single-lever-ablation"
    - "seed-5304"

data_source: combined_paired

backbone:
  name: "vit_b_16_laion_datacomp"
  variant: "ViT-B-16-DataComp-XL"
  source: "laion"
  model_name: "ViT-B-16"
  pretrained: "datacomp_xl_s13b_b90k"
  hidden_size: 512
  resolution: 224
  apply_svd_to_in_proj: true
  unfreeze_final_proj: true
  unfreeze_final_ln: true
  apply_svd_to_mlp: true

learning_rate: 2.0e-4
weight_decay: 0.05
optimizer_eps: 1.0e-8
lambda_reg: 0.01
rank: 736
gradient_clip_val: 1.0

nEpochs: 16
total_training_steps: 8000
lr_scheduler: "cosine_with_warmup"
lr_scheduler_warmup_steps: 1000

dataloader_strategy: combined_paired
frames_per_batch: 32
frames_per_video: 8
num_workers: 4
prefetch_factor: 2

load_base_checkpoint: false

label_smoothing: 0.0
stability_lambda: 0.0

# THE LEVER vs Slots A/B: correlation_penalty DISABLED (mirror Slot C's pattern).
correlation_penalty:
  enabled: false
  lambda: 0.0
  axes: []

# THE LEVER vs Slots A/C: pair_rank DISABLED (mirror Slot B's pattern).
pair_rank_loss:
  lambda: 0.0
  margin: 0.5

anchor_aware:
  enabled: false

face_scale_jitter:
  enabled: true
  scale_limit: 0.50

# THE NEW LEVER for this slot: band-limited Fourier amplitude randomization.
# Bands 8-13: shortcut-only zone per Probe 6 (shortcut AUC 0.97, signal AUC 0.46-0.52
# in the cleanest cell). Bands 5-6: explicitly manipulation-signal-carrying (signal
# AUC > shortcut AUC) — preserved. Phase preserved universally. Per-frame independent
# (preserves labels by construction). p_apply=0.5 matches pipeline_randomization cadence.
# Empirical foundation: analysis/fourier_band_overlap_2026-05-06/run_probe.py.
fourier_aug:
  enabled: true
  p_apply: 0.5
  bands_randomize: [8, 9, 10, 11, 12, 13]
  bands_preserve: [5, 6]
  noise_log_range: [-0.3, 0.3]
  radial_resolution: 16
  image_resolution: 224

augmentation:
  version: "quality_targeted_family"
  strength: "vcd_targeted"
  routing:
    mode: "family_aware"
    enhanced_strategy_names:
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
  context_variation_enabled: true
  context_variation_gamma_limit: [80, 120]
  context_variation_brightness: 0.25
  context_variation_contrast: 0.25
  context_variation_shift: 0.05
  context_variation_scale: 0.15
  context_variation_rotate: 10
  context_variation_oneof_p: 0.30
  context_variation_individual_p: 0.15

  pipeline_randomization:
    enabled: true
    p_real: 0.5
    p_fake: 0.5
    blur_p: 0.85
    blur_sigma_range: [2.0, 8.0]
    brightness_p: 0.7
    brightness_range: [-30.0, 70.0]
    jpeg_p: 0.7
    jpeg_quality: [30, 90]
    downscale_p: 0.3
    downscale_range: [0.85, 1.0]
    chroma_blur_p: 0.3
    chroma_blur_ksize: 3
    yuv_roundtrip_p: 0.0
    gamma_p: 0.3
    gamma_range: [0.92, 1.08]

canary_probe:
  enabled: true
  parquet_path: "arena/canaries/teams_chronic_diverse_800_2026-05-07.parquet"
  frequency_steps: 1000
  max_frames: 1000
  batch_size: 64

combined_paired:
  identity_balanced_sampling: true
  split_seed: 5304
  identity_split_mode: "hash_stable"
  seed: 5304
  bad_data_policy_manifest: "policy/visomaster_bad_data/VISOMASTER_BAD_DATA_POLICY_MANIFEST_2026-04-17.csv"
  bad_data_policy_summary: "policy/visomaster_bad_data/VISOMASTER_BAD_DATA_POLICY_SUMMARY_2026-04-17.json"

  face_area_parquet_path: "analysis/deeplive_face_geometry_2026-05-05/face_area.parquet"

  df40:
    enabled: true
    pair_json: "dataset/df40_pairs/df40-pair-matching.json"
    gcs_bucket: "df40-frames-recropped-rfa85"
    sampling_mode: "sparse"
    anchor_indices: [0, 4, 8, 12, 16, 20, 24, 28]
    methods:
      - "simswap"
      - "facedancer"
      - "blendface"
      - "e4s"
      - "inswap"
      - "mobileswap"
      - "uniface"

  deeplive:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    use_landmarks: false
    sampling_mode: "sparse"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    include_strategies:
      - "edge_cases"
      - "minimal_processing"
      - "quality_enhancement"
      - "edge_cases_enhanced"
      - "minimal_processing_enhanced"
    exclude_strategies: []
    strategy_expectations:
      mode: "withenhanced"
      min_counts:
        edge_cases_enhanced: 400
        minimal_processing_enhanced: 390

  visomaster:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    frames_bucket: "live-deepfake-methods-real-and-fake-frames"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    swap_models:
      - "CSCS"
      - "GhostFace-v1"
      - "GhostFace-v2"
      - "GhostFace-v3"
      - "InStyleSwapper256-A"
      - "InStyleSwapper256-B"
      - "InStyleSwapper256-C"
      - "Inswapper128"
      - "SimSwap512"
    tiers: null

  visomaster_enhanced:
    enabled: true
    gcs_bucket: "visomaster-enhanced-face-cropped"
    original_bucket: "live-deepfake-methods-real-and-fake-frames-cropped"
    exclude_tiers: ["ARTIFACT"]

  visomaster_hints_teams:
    enabled: false

  visomaster_teams_enhanced:
    enabled: true
    resolver_manifest_uri: "gs://training-job-outputs/cache/visomaster/enhanced_visomaster_resolver_2026-04-06.json"
    enhanced_bucket: "enhanced-visomaster-cropped"
    companion_domains:
      - "teams_v2"
    include_statuses:
      - "teams_v2_companion"
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]
    p_original: 0.5
    sampling_family_key: "visomaster_enhanced_fake"

  teams:
    enabled: true
    gcs_bucket: "live-deepfake-methods-real-and-fake-frames-cropped-teams"
    require_pair_complete: true
    anchor_indices: [0, 2, 4, 6, 8, 10, 12, 14]

  external_training_reals:
    - bucket: "effort-collected-data"
      prefix: "real/VCD"
      method: "external_vcd_real"
      grouping: "per_image"
      identity_pattern: "real__VCD__(?P<md5>[a-f0-9]{32})_"
      identity_train_fraction: 0.40
      identity_split_seed: 5304
      max_frames_per_identity: 15
      max_total_samples: 1200
      deterministic: true

  sampling:
    strategy: "identity_resample_weighted"
    family_weights:
      df40_fake: 0.2
      visomaster_fake: 4.0
      visomaster_enhanced_fake: 4.0
      deeplive_non_enhanced_fake: 2.5
      deeplive_enhanced_fake: 3.0
      deeplive_teams_fake: 7.0
      deeplive_teams_real: 5.0
      df40_real: 0.5
      realpool_real: 1.5
      external_real: 2.0

  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

  holdout:
    mode: "identity"
    max_samples_per_method: 300

  ood_monitoring:
    enabled: true
    exclude_training_identities: true
    external_real_sources:
      - bucket: "effort-collected-data"
        prefix: "real/external_youtube_avspeech"
        method: "external_youtube_avspeech"
        grouping: "by_folder"
        max_videos: 200
        deterministic: true
      - bucket: "effort-collected-data"
        prefix: "real/VCD"
        method: "zoom_vcd_real"
        grouping: "per_image"
        max_videos: 1200
        deterministic: true
    external_fake_sources:
      - bucket: "effort-collected-data"
        prefix: "wma_validation/enhanced_fake"
        method: "wma_failure_fake"
        grouping: "per_image"
        max_videos: 1202
        deterministic: true
    expected_counts:
      external_youtube_avspeech: 200
      zoom_vcd_real: 1200
      wma_failure_fake: 1202
    strict_expected_counts: true

use_arcface_head: false
arcface_m: 0.15
arcface_s: 6.0
s_start: 6.0
s_end: 6.0
anneal_steps: 1

evaluate_every_steps: 500
ood_monitoring_start_step: 500
ood_monitoring_every_steps: 1000
test_batch_size: 32

early_stopping_enabled: true
early_stopping_patience: 12

periodic_saves:
  enabled: true
  step_list:
    - 500
    - 1000
    - 2000
    - 3000
    - 4000
    - 5000
    - 6000
    - 7000
    - 8000

gcs_assets:
  clip_backbone:
    gcs_path: "gs://base-checkpoints/effort-aigi/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    local_path: "./weights/CLIP-ViT-B-16-DataComp.XL-s13B-b90K/"
    files:
      - open_clip_config.json
      - open_clip_pytorch_model.bin
